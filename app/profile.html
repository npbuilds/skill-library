<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Profile // Tengan Fingerprint</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   WEATHERED CYBERPUNK THEME (copied from observatory.html)
   ═══════════════════════════════════════════════ */
:root {
  --font-mono: 'Share Tech Mono', monospace;
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
  --radius: 4px;
  --ease: cubic-bezier(0.0, 0.0, 0.2, 1);
}

[data-theme="dark"] {
  --bg-deep: #06070d;
  --bg-panel: #0b0d18;
  --bg-panel-hover: #10132a;
  --border-dim: #1a1d3a;
  --border-glow: #2a3a6a;
  --cyan-faded: #3a8a8a;
  --cyan-bright: #5acece;
  --cyan-glow: #3acece44;
  --magenta-faded: #8a3a6a;
  --magenta-bright: #ce5aaa;
  --magenta-glow: #ce3aaa33;
  --amber-faded: #8a7a3a;
  --amber-bright: #ceb45a;
  --amber-glow: #ceb43a33;
  --red-faded: #8a3a3a;
  --red-bright: #ce5a5a;
  --green-faded: #3a8a4a;
  --green-bright: #5ace6a;
  --text-primary: #a0aab8;
  --text-dim: #5a6478;
  --text-bright: #d0dae8;
  --scanline-opacity: 0.03;
  --header-gradient-start: #0d1020;
  --crt-vignette: rgba(0,0,0,0.4);
  --noise-opacity: 0.04;
}

[data-theme="light"] {
  --bg-deep: #e8ecf2;
  --bg-panel: #f0f3f8;
  --bg-panel-hover: #dce2ec;
  --border-dim: #c0c8d8;
  --border-glow: #8898b8;
  --cyan-faded: #1a7070;
  --cyan-bright: #0e8a8a;
  --cyan-glow: #0e8a8a22;
  --magenta-faded: #8a2a5a;
  --magenta-bright: #a83880;
  --magenta-glow: #a8388022;
  --amber-faded: #7a6a20;
  --amber-bright: #9a8420;
  --amber-glow: #9a842022;
  --red-faded: #983030;
  --red-bright: #c04040;
  --green-faded: #1a7830;
  --green-bright: #208a38;
  --text-primary: #3a4050;
  --text-dim: #6a7488;
  --text-bright: #1a2030;
  --scanline-opacity: 0.015;
  --header-gradient-start: #d8dfe8;
  --crt-vignette: rgba(0,0,0,0.06);
  --noise-opacity: 0.02;
}

/* RESET & BASE */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* CRT scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px,
    rgba(0,0,0,var(--scanline-opacity)) 2px, rgba(0,0,0,var(--scanline-opacity)) 4px);
}

/* Noise texture on panels */
.ap-noise::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: var(--noise-opacity);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
  border-radius: var(--radius);
}

::selection { background: var(--cyan-glow); }

a { color: var(--cyan-bright); text-decoration: none; }
a:hover { color: var(--text-bright); }

/* ═══════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════ */
.ap-header {
  background: linear-gradient(135deg, var(--header-gradient-start), var(--bg-deep));
  border-bottom: 1px solid var(--border-dim);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-wrap: wrap;
  gap: 12px;
}

.ap-logo {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--cyan-bright);
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: logo-flicker 4s ease-in-out infinite;
}
.ap-logo span { color: var(--magenta-bright); }

@keyframes logo-flicker {
  0%, 95%, 100% { opacity: 1; }
  96% { opacity: 0.8; }
  97% { opacity: 1; }
  98% { opacity: 0.7; }
}

.ap-meta-bar {
  display: flex;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  flex-wrap: wrap;
  align-items: center;
}
.ap-meta-bar #ap-avg-conf,
.ap-meta-bar #ap-outputs,
.ap-meta-bar #ap-updated {
  color: var(--cyan-bright);
}

.ap-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.ap-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 12px;
  border: 1px solid var(--border-dim);
  background: var(--bg-panel);
  color: var(--text-dim);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s var(--ease);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.ap-btn:hover { border-color: var(--cyan-faded); color: var(--cyan-bright); }

/* ═══════════════════════════════════════════════
   SUMMARY
   ═══════════════════════════════════════════════ */
.ap-summary {
  position: relative;
  margin: 24px;
  padding: 24px 28px;
  background: var(--bg-panel);
  border: 1px solid var(--border-dim);
  border-left: 3px solid var(--cyan-bright);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text-primary);
  line-height: 1.6;
  overflow: hidden;
}
.ap-summary p { margin-bottom: 8px; position: relative; z-index: 1; }
.ap-summary p:last-child { margin-bottom: 0; }
.ap-summary strong { color: var(--cyan-bright); font-weight: 600; }

/* ═══════════════════════════════════════════════
   RADAR
   ═══════════════════════════════════════════════ */
.ap-radar-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 16px 48px;
}
.ap-radar-container {
  width: 100%;
  max-width: 760px;
  position: relative;
}
.ap-radar-svg {
  width: 100%;
  height: auto;
  display: block;
}

.ap-radar-grid {
  fill: none;
  stroke: var(--border-dim);
  stroke-width: 0.5;
}
.ap-radar-axis {
  stroke: var(--border-dim);
  stroke-width: 0.5;
}
.ap-radar-polygon {
  fill: var(--cyan-glow);
  stroke: var(--cyan-bright);
  stroke-width: 1.5;
  stroke-linejoin: round;
}
.ap-radar-vertex {
  fill: var(--cyan-bright);
  stroke: var(--bg-deep);
  stroke-width: 1;
  transition: all 0.15s var(--ease);
}
.ap-radar-hit:hover + .ap-radar-vertex,
.ap-radar-hit:hover {
  cursor: pointer;
}
.ap-radar-label {
  font-family: var(--font-mono);
  font-size: 11px;
  fill: var(--text-dim);
  pointer-events: none;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.ap-radar-sector {
  pointer-events: none;
}

/* ═══════════════════════════════════════════════
   TENDENCIES
   ═══════════════════════════════════════════════ */
.ap-tendencies {
  margin: 16px 24px 48px;
}
.ap-section-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--magenta-bright);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-dim);
}
.ap-tendency-list {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 12px;
}
.ap-tendency-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-dim);
  border-left: 2px solid var(--cyan-faded);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-primary);
  transition: border-color 0.2s var(--ease);
}
.ap-tendency-card:hover { border-left-color: var(--cyan-bright); }
.ap-tendency-card .ap-tendency-name {
  font-family: var(--font-display);
  color: var(--cyan-bright);
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 11px;
  display: block;
  margin-bottom: 6px;
}
.ap-tendency-card .ap-tendency-body {
  color: var(--text-primary);
}

/* ═══════════════════════════════════════════════
   TOOLTIP
   ═══════════════════════════════════════════════ */
.ap-tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--bg-panel);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-primary);
  z-index: 300;
  max-width: 280px;
  opacity: 0;
  transition: opacity 0.15s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.ap-tooltip.show { opacity: 1; }
.ap-tt-name { font-family: var(--font-display); color: var(--cyan-bright); font-size: 12px; letter-spacing: 1px; margin-bottom: 4px; }
.ap-tt-cat { color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; font-size: 9px; letter-spacing: 1.5px; }
.ap-tt-poles { color: var(--text-primary); margin-bottom: 6px; }
.ap-tt-poles span { color: var(--text-bright); }
.ap-tt-metrics { display: flex; gap: 12px; color: var(--text-dim); }
.ap-tt-metrics b { color: var(--text-bright); }

/* ═══════════════════════════════════════════════
   DETAIL PANEL
   ═══════════════════════════════════════════════ */
.ap-detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 400;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s var(--ease);
}
.ap-detail-overlay.open { opacity: 1; pointer-events: auto; }

.ap-detail-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 480px;
  max-width: 100vw;
  height: 100vh;
  background: var(--bg-panel);
  border-left: 1px solid var(--border-glow);
  z-index: 500;
  transform: translateX(100%);
  transition: transform 0.3s var(--ease);
  overflow-y: auto;
  padding: 32px 28px 48px;
}
.ap-detail-panel.open { transform: translateX(0); }
.ap-detail-panel::before { z-index: 0; }
.ap-detail-panel > * { position: relative; z-index: 1; }

.ap-detail-close {
  position: absolute;
  top: 12px;
  right: 16px;
  background: transparent;
  border: 1px solid var(--border-dim);
  color: var(--text-dim);
  width: 32px;
  height: 32px;
  border-radius: var(--radius);
  font-size: 20px;
  cursor: pointer;
  transition: all 0.15s var(--ease);
  z-index: 2;
}
.ap-detail-close:hover { color: var(--cyan-bright); border-color: var(--cyan-faded); }

.ap-detail-name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.ap-detail-cat {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 3px 9px;
  border: 1px solid var(--cyan-faded);
  border-radius: 999px;
  color: var(--cyan-bright);
  margin-bottom: 24px;
}

.ap-detail-spectrum {
  margin: 20px 0 28px;
}
.ap-spectrum-poles {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.ap-spectrum-bar {
  position: relative;
  height: 6px;
  background: var(--bg-deep);
  border: 1px solid var(--border-dim);
  border-radius: 999px;
  overflow: visible;
}
.ap-spectrum-fill {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--magenta-glow), var(--cyan-glow));
  border-radius: 999px;
}
.ap-spectrum-marker {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--cyan-bright);
  border: 2px solid var(--bg-deep);
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px var(--cyan-glow);
}

.ap-stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 28px;
}
.ap-stat {
  background: var(--bg-deep);
  border: 1px solid var(--border-dim);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.ap-stat-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.ap-stat-val {
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--cyan-bright);
}

.ap-detail-section {
  margin-bottom: 22px;
}
.ap-detail-section h3 {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--magenta-bright);
  margin-bottom: 8px;
}
.ap-detail-section p {
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.6;
}

.ap-detail-footer {
  margin-top: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--border-dim);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ═══════════════════════════════════════════════
   LOADING
   ═══════════════════════════════════════════════ */
.ap-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  animation: ap-pulse 1.6s ease-in-out infinite;
}
.ap-radar-loading {
  min-height: 720px;
}
.ap-tendencies .ap-loading {
  min-height: 100px;
}
@keyframes ap-pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.85; }
}

/* ═══════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════ */
@media (max-width: 768px) {
  .ap-header { padding: 12px 16px; }
  .ap-summary { margin: 16px; padding: 16px 18px; font-size: 14px; }
  .ap-tendencies { margin: 16px; }
  .ap-detail-panel { width: 100vw; padding: 24px 18px 40px; }
  .ap-stat-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<header class="ap-header">
  <div class="ap-logo">AESTHETIC <span>PROFILE</span></div>
  <div class="ap-meta-bar">
    <span>17 dimensions</span>
    <span>·</span>
    <span>avg confidence <span id="ap-avg-conf">0.00</span></span>
    <span>·</span>
    <span><span id="ap-outputs">0</span> outputs tracked</span>
    <span>·</span>
    <span>last updated <span id="ap-updated">—</span></span>
  </div>
  <div class="ap-controls">
    <a href="/" class="ap-btn">← Dashboard</a>
    <a href="/observatory" class="ap-btn">◈ Observatory</a>
    <button class="ap-btn" id="ap-theme-toggle" title="Toggle theme">◑</button>
  </div>
</header>

<section class="ap-summary ap-noise" id="ap-summary">
  <div class="ap-loading">Loading aesthetic profile...</div>
</section>

<section class="ap-radar-wrap">
  <div class="ap-radar-container" id="ap-radar"><div class="ap-loading ap-radar-loading">Computing fingerprint...</div></div>
</section>

<section class="ap-tendencies">
  <h2 class="ap-section-title">Active Tendencies</h2>
  <ul class="ap-tendency-list" id="ap-tendencies"><li class="ap-loading" style="grid-column: 1 / -1;">Loading tendencies...</li></ul>
</section>

<div class="ap-tooltip" id="ap-tooltip"></div>
<div class="ap-detail-overlay" id="ap-detail-overlay"></div>
<div class="ap-detail-panel ap-noise" id="ap-detail-panel">
  <button class="ap-detail-close" id="ap-detail-close">×</button>
  <div id="ap-detail-content"></div>
</div>

<script>
/* ═══════════════════════════════════════════════
   AP — Aesthetic Profile
   ═══════════════════════════════════════════════ */
const AP = {};

/* Helpers */
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ───────────── CONFIG ───────────── */
AP.config = {
  categoryColors: {
    'Spatial':      'var(--cyan-faded)',
    'Chromatic':    'var(--magenta-faded)',
    'Form':         'var(--cyan-faded)',
    'Temporal':     'var(--amber-faded)',
    'Emotional':    'var(--magenta-faded)',
    'Photographic': 'var(--green-faded)',
    'Discovered':   'rgb(170, 90, 206)'
  },
  radarSize: 720,
  radarRadius: 240,
  labelOffset: 50,
};

/* ───────────── THEME ───────────── */
AP.theme = {
  init() {
    const saved = localStorage.getItem('ap-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    const btn = document.getElementById('ap-theme-toggle');
    if (btn) {
      btn.addEventListener('click', () => AP.theme.toggle());
    }
  },
  toggle() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('ap-theme', next);
    // Re-render to pick up CSS variables baked into SVG inline styles
    if (AP.data.dimensions) AP.radar.render();
  }
};

/* ───────────── DATA ───────────── */
AP.data = {
  raw: null,
  dimensions: null,
  async load() {
    try {
      const res = await fetch('/data/dimensions.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('Failed to load dimensions.json: ' + res.status);
      const data = await res.json();
      AP.data.raw = data;
      AP.data.dimensions = data.dimensions || [];
      return data;
    } catch (err) {
      console.error('AP.data.load error', err);
      document.getElementById('ap-summary').innerHTML =
        `<p style="color:var(--red-bright)">Failed to load profile: ${escapeHtml(err.message)}</p>`;
      throw err;
    }
  },
  avgConfidence() {
    if (!AP.data.dimensions || !AP.data.dimensions.length) return 0;
    return AP.data.dimensions.reduce((s, d) => s + (d.confidence || 0), 0) / AP.data.dimensions.length;
  }
};

/* ───────────── NARRATIVE ───────────── */
AP.narrative = {
  render() {
    const d = AP.data.raw;
    if (!d) return;

    // Meta bar
    document.getElementById('ap-avg-conf').textContent =
      (d.aggregates?.avgConfidence ?? AP.data.avgConfidence()).toFixed(2);
    document.getElementById('ap-outputs').textContent = d.totalOutputsTracked ?? 0;
    document.getElementById('ap-updated').textContent = d.lastUpdated || '—';

    // Summary blockquote — convert markdown bold + linebreaks to HTML
    const summary = d.summary || '';
    const summaryHtml = summary
      .split('\n')
      .filter(line => line.trim().length)
      .map(line => '<p>' + AP.narrative.markdownInline(line) + '</p>')
      .join('');
    document.getElementById('ap-summary').innerHTML = summaryHtml ||
      '<p>No summary available.</p>';

    // Active tendencies
    const list = document.getElementById('ap-tendencies');
    list.innerHTML = '';
    const tendencies = d.activeTendencies || [];
    tendencies.forEach(raw => {
      const li = document.createElement('li');
      li.className = 'ap-tendency-card';
      // Parse the leading **bold** segment as the name
      const m = raw.match(/^\*\*(.+?)\*\*\s*(.*)$/);
      if (m) {
        li.innerHTML =
          `<span class="ap-tendency-name">${escapeHtml(m[1])}</span>` +
          `<span class="ap-tendency-body">${AP.narrative.markdownInline(m[2])}</span>`;
      } else {
        li.innerHTML = `<span class="ap-tendency-body">${AP.narrative.markdownInline(raw)}</span>`;
      }
      list.appendChild(li);
    });
  },
  markdownInline(s) {
    // Escape, then re-introduce bold via <strong>
    let out = escapeHtml(s);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return out;
  }
};

/* ───────────── RADAR ───────────── */
AP.radar = {};

AP.radar.render = function() {
  const dims = AP.data.dimensions;
  if (!dims || !dims.length) return;
  const n = dims.length;
  const size = AP.config.radarSize;
  const cx = size / 2;
  const cy = size / 2;
  const r = AP.config.radarRadius;
  const labelR = r + AP.config.labelOffset;

  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ap-radar-svg" preserveAspectRatio="xMidYMid meet">`;

  // Defs
  svg += `<defs>`;
  svg += `<filter id="ap-glow" x="-50%" y="-50%" width="200%" height="200%">`;
  svg += `<feGaussianBlur stdDeviation="3" result="blur"/>`;
  svg += `<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>`;
  svg += `</filter>`;
  svg += `</defs>`;

  // Category sector backgrounds — group consecutive dims by category
  // Each axis "i" occupies an angular slice from (i - 0.5) * step to (i + 0.5) * step
  const step = (Math.PI * 2) / n;
  const sectors = []; // {category, startIdx, endIdx}
  let curStart = 0;
  for (let i = 1; i <= n; i++) {
    if (i === n || dims[i].category !== dims[curStart].category) {
      sectors.push({ category: dims[curStart].category, startIdx: curStart, endIdx: i - 1 });
      curStart = i;
    }
  }
  // Outer arc radius slightly larger than r
  const sectorR = r + 12;
  sectors.forEach(sec => {
    const a0 = (sec.startIdx - 0.5) * step - Math.PI / 2;
    const a1 = (sec.endIdx + 0.5) * step - Math.PI / 2;
    const x0 = cx + sectorR * Math.cos(a0);
    const y0 = cy + sectorR * Math.sin(a0);
    const x1 = cx + sectorR * Math.cos(a1);
    const y1 = cy + sectorR * Math.sin(a1);
    const largeArc = (a1 - a0) > Math.PI ? 1 : 0;
    const fill = AP.config.categoryColors[sec.category] || 'var(--border-dim)';
    const path = `M ${cx} ${cy} L ${x0} ${y0} A ${sectorR} ${sectorR} 0 ${largeArc} 1 ${x1} ${y1} Z`;
    // Use style="fill:..." not fill="..." — SVG presentation attributes don't resolve CSS variables
    svg += `<path d="${path}" class="ap-radar-sector" style="fill:${fill}" opacity="0.06"/>`;
  });

  // Grid rings
  for (const pct of [0.25, 0.5, 0.75, 1.0]) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const angle = step * i - Math.PI / 2;
      pts.push(`${cx + r * pct * Math.cos(angle)},${cy + r * pct * Math.sin(angle)}`);
    }
    svg += `<polygon points="${pts.join(' ')}" class="ap-radar-grid"/>`;
  }

  // Axes
  for (let i = 0; i < n; i++) {
    const angle = step * i - Math.PI / 2;
    const ex = cx + r * Math.cos(angle);
    const ey = cy + r * Math.sin(angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" class="ap-radar-axis"/>`;
  }

  // Data polygon
  const dataPts = [];
  const vertices = [];
  for (let i = 0; i < n; i++) {
    const angle = step * i - Math.PI / 2;
    const v = Math.max(0, Math.min(1, dims[i].position ?? 0.5));
    const px = cx + r * v * Math.cos(angle);
    const py = cy + r * v * Math.sin(angle);
    dataPts.push(`${px},${py}`);
    vertices.push({ x: px, y: py, dim: dims[i] });
  }
  const avgConf = AP.data.avgConfidence();
  const strokeOpacity = Math.min(1, Math.max(0.4, avgConf + 0.4));
  svg += `<polygon points="${dataPts.join(' ')}" class="ap-radar-polygon" style="stroke-opacity:${strokeOpacity}" filter="url(#ap-glow)"/>`;

  // Vertex dots — size scales with confidence
  for (const v of vertices) {
    const dotR = 2 + ((v.dim.confidence || 0) * 7);
    svg += `<circle cx="${v.x}" cy="${v.y}" r="${dotR}" class="ap-radar-vertex" data-name="${escapeHtml(v.dim.name)}"/>`;
  }

  // Hit areas — thick invisible line from center to rim covers the entire axis
  // (so hovering the data vertex OR anywhere along the axis triggers the dimension's tooltip)
  for (let i = 0; i < n; i++) {
    const angle = step * i - Math.PI / 2;
    const ex = cx + r * Math.cos(angle);
    const ey = cy + r * Math.sin(angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="transparent" stroke-width="28" class="ap-radar-hit" data-idx="${i}" style="cursor:pointer"/>`;
  }

  // Axis labels
  for (let i = 0; i < n; i++) {
    const angle = step * i - Math.PI / 2;
    const lx = cx + labelR * Math.cos(angle);
    const ly = cy + labelR * Math.sin(angle);
    let anchor = 'middle';
    const c = Math.cos(angle);
    const s = Math.sin(angle);
    if (c > 0.3) anchor = 'start';
    else if (c < -0.3) anchor = 'end';
    const dy = s > 0.3 ? '1em' : (s < -0.3 ? '-0.3em' : '0.3em');
    svg += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dy="${dy}" class="ap-radar-label">${escapeHtml(dims[i].name)}</text>`;
  }

  svg += `</svg>`;
  document.getElementById('ap-radar').innerHTML = svg;

  // Wire up hit-area listeners
  document.querySelectorAll('.ap-radar-hit').forEach(el => {
    el.addEventListener('mouseenter', (e) => {
      const idx = parseInt(el.dataset.idx, 10);
      AP.tooltip.show(e, AP.radar.tooltipHtml(dims[idx]));
    });
    el.addEventListener('mousemove', (e) => AP.tooltip.move(e));
    el.addEventListener('mouseleave', () => AP.tooltip.hide());
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      AP.detail.open(dims[idx]);
    });
  });
};

AP.radar.tooltipHtml = function(d) {
  const poles = d.poles || ['', ''];
  return `
    <div class="ap-tt-name">${escapeHtml(d.name)}</div>
    <div class="ap-tt-cat">${escapeHtml(d.category)}</div>
    <div class="ap-tt-poles"><span>${escapeHtml(poles[0])}</span> ↔ <span>${escapeHtml(poles[1])}</span></div>
    <div class="ap-tt-metrics">
      <span>position <b>${(d.position ?? 0).toFixed(2)}</b></span>
      <span>confidence <b>${(d.confidence ?? 0).toFixed(2)}</b></span>
      <span>${d.dataPoints ?? 0} pts</span>
    </div>
  `;
};

/* ───────────── TOOLTIP ───────────── */
AP.tooltip = {
  el: null,
  ensure() {
    if (!AP.tooltip.el) AP.tooltip.el = document.getElementById('ap-tooltip');
    return AP.tooltip.el;
  },
  show(e, html) {
    const el = AP.tooltip.ensure();
    el.innerHTML = html;
    el.classList.add('show');
    AP.tooltip.move(e);
  },
  move(e) {
    const el = AP.tooltip.ensure();
    const pad = 14;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    const rect = el.getBoundingClientRect();
    if (x + rect.width > window.innerWidth - 8) x = e.clientX - rect.width - pad;
    if (y + rect.height > window.innerHeight - 8) y = e.clientY - rect.height - pad;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  },
  hide() {
    const el = AP.tooltip.ensure();
    el.classList.remove('show');
  }
};

/* ───────────── DETAIL PANEL ───────────── */
AP.detail = {
  init() {
    document.getElementById('ap-detail-close').addEventListener('click', AP.detail.close);
    document.getElementById('ap-detail-overlay').addEventListener('click', AP.detail.close);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') AP.detail.close();
    });
  },
  open(d) {
    if (!d) return;
    const poles = d.poles || ['', ''];
    const pos = Math.max(0, Math.min(1, d.position ?? 0.5));
    const html = `
      <div class="ap-detail-name">${escapeHtml(d.name)}</div>
      <span class="ap-detail-cat">${escapeHtml(d.category)}</span>

      <div class="ap-detail-spectrum">
        <div class="ap-spectrum-poles">
          <span>${escapeHtml(poles[0])}</span>
          <span>${escapeHtml(poles[1])}</span>
        </div>
        <div class="ap-spectrum-bar">
          <div class="ap-spectrum-fill"></div>
          <div class="ap-spectrum-marker" style="left:${(pos * 100).toFixed(1)}%"></div>
        </div>
      </div>

      <div class="ap-stat-grid">
        <div class="ap-stat">
          <div class="ap-stat-label">Position</div>
          <div class="ap-stat-val">${(d.position ?? 0).toFixed(2)}</div>
        </div>
        <div class="ap-stat">
          <div class="ap-stat-label">Confidence</div>
          <div class="ap-stat-val">${(d.confidence ?? 0).toFixed(2)}</div>
        </div>
        <div class="ap-stat">
          <div class="ap-stat-label">Data pts</div>
          <div class="ap-stat-val">${d.dataPoints ?? 0}</div>
        </div>
      </div>

      ${d.measures ? `
        <div class="ap-detail-section">
          <h3>What it measures</h3>
          <p>${escapeHtml(d.measures)}</p>
        </div>` : ''}

      ${d.evidence ? `
        <div class="ap-detail-section">
          <h3>Evidence</h3>
          <p>${escapeHtml(d.evidence)}</p>
        </div>` : ''}

      ${d.discoveredDate ? `
        <div class="ap-detail-footer">
          Discovered on ${escapeHtml(d.discoveredDate)}
        </div>` : ''}
    `;
    document.getElementById('ap-detail-content').innerHTML = html;
    document.getElementById('ap-detail-overlay').classList.add('open');
    document.getElementById('ap-detail-panel').classList.add('open');
    AP.tooltip.hide();
  },
  close() {
    document.getElementById('ap-detail-overlay').classList.remove('open');
    document.getElementById('ap-detail-panel').classList.remove('open');
  }
};

/* ───────────── BOOTSTRAP ───────────── */
(async function() {
  AP.theme.init();
  try {
    await AP.data.load();
    AP.narrative.render();
    AP.radar.render();
    AP.detail.init();
  } catch (err) {
    // Errors already surfaced in summary section
  }
})();
</script>
