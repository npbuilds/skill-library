<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Observatory // Skill Library</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore-compat.js"></script>
<style>
/* ═══════════════════════════════════════════════
   WEATHERED CYBERPUNK THEME
   ═══════════════════════════════════════════════ */
:root {
  --font-mono: 'Share Tech Mono', monospace;
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
  --radius: 4px;
  --ease: cubic-bezier(0.0, 0.0, 0.2, 1);
}

[data-theme="dark"] {
  --bg-deep: #06070d;
  --bg-panel: #0b0d18;
  --bg-panel-hover: #10132a;
  --border-dim: #1a1d3a;
  --border-glow: #2a3a6a;
  --cyan-faded: #3a8a8a;
  --cyan-bright: #5acece;
  --cyan-glow: #3acece44;
  --magenta-faded: #8a3a6a;
  --magenta-bright: #ce5aaa;
  --magenta-glow: #ce3aaa33;
  --amber-faded: #8a7a3a;
  --amber-bright: #ceb45a;
  --amber-glow: #ceb43a33;
  --red-faded: #8a3a3a;
  --red-bright: #ce5a5a;
  --green-faded: #3a8a4a;
  --green-bright: #5ace6a;
  --text-primary: #a0aab8;
  --text-dim: #5a6478;
  --text-bright: #d0dae8;
  --scanline-opacity: 0.03;
  --header-gradient-start: #0d1020;
  --crt-vignette: rgba(0,0,0,0.4);
  --noise-opacity: 0.04;
}

[data-theme="light"] {
  --bg-deep: #e8ecf2;
  --bg-panel: #f0f3f8;
  --bg-panel-hover: #dce2ec;
  --border-dim: #c0c8d8;
  --border-glow: #8898b8;
  --cyan-faded: #1a7070;
  --cyan-bright: #0e8a8a;
  --cyan-glow: #0e8a8a22;
  --magenta-faded: #8a2a5a;
  --magenta-bright: #a83880;
  --magenta-glow: #a8388022;
  --amber-faded: #7a6a20;
  --amber-bright: #9a8420;
  --amber-glow: #9a842022;
  --red-faded: #983030;
  --red-bright: #c04040;
  --green-faded: #1a7830;
  --green-bright: #208a38;
  --text-primary: #3a4050;
  --text-dim: #6a7488;
  --text-bright: #1a2030;
  --scanline-opacity: 0.015;
  --header-gradient-start: #d8dfe8;
  --crt-vignette: rgba(0,0,0,0.06);
  --noise-opacity: 0.02;
}

/* Domain colors */
:root {
  --d-investing: #5acece;
  --d-sommelier: #ce5aaa;
  --d-writing: #ceb45a;
  --d-worldbuilding: #5ace6a;
  --d-game-theory: #ce5a5a;
  --d-design: #8a7ace;
  --d-data-science: #5a9ace;
  --d-infrastructure: #8ace5a;
  --d-research: #ce8a5a;
  --d-artifacts: #5acea0;
  --d-meta: #9a9aaa;
  --d-philosophy: #ce7a8a;
  --d-neocortex: #aa5ace;
  --d-biotech-venture: #4aceaa;
  --d-world-history: #ce9a6a;
  --d-product: #6aaace;
}

/* ═══════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* CRT scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px,
    rgba(0,0,0,var(--scanline-opacity)) 2px, rgba(0,0,0,var(--scanline-opacity)) 4px);
}

/* Noise texture on panels */
.no-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: var(--noise-opacity);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
  border-radius: var(--radius);
}

::selection { background: var(--cyan-glow); }

/* ═══════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════ */
.no-header {
  background: linear-gradient(135deg, var(--header-gradient-start), var(--bg-deep));
  border-bottom: 1px solid var(--border-dim);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.no-logo {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--cyan-bright);
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: logo-flicker 4s ease-in-out infinite;
}
.no-logo span { color: var(--magenta-bright); }

@keyframes logo-flicker {
  0%, 95%, 100% { opacity: 1; }
  96% { opacity: 0.8; }
  97% { opacity: 1; }
  98% { opacity: 0.7; }
}

.no-stats-bar {
  display: flex;
  gap: 20px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
}
.no-stats-bar .stat-val { color: var(--cyan-bright); }
.no-stats-bar .stat-label { margin-left: 4px; }

.no-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.no-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 12px;
  border: 1px solid var(--border-dim);
  background: var(--bg-panel);
  color: var(--text-dim);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.no-btn:hover { border-color: var(--cyan-faded); color: var(--cyan-bright); }
.no-btn.active { border-color: var(--cyan-bright); color: var(--cyan-bright); background: var(--cyan-glow); }
.no-btn.refreshing { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.refresh-status {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-right: 8px;
  opacity: 0;
  transition: opacity 0.3s;
}
.refresh-status.show { opacity: 1; }

/* ═══════════════════════════════════════════════
   GRID LAYOUT
   ═══════════════════════════════════════════════ */
.no-grid {
  display: grid;
  grid-template-columns: 1fr 320px;
  grid-template-rows: auto minmax(400px, 60vh) auto;
  gap: 1px;
  background: var(--border-dim);
}

.no-panel {
  position: relative;
  background: var(--bg-panel);
  padding: 16px;
  overflow: hidden;
}

.no-panel-title {
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.no-panel-title::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan-bright);
  box-shadow: 0 0 6px var(--cyan-glow);
}

/* ═══════════════════════════════════════════════
   DOMAIN VITALS STRIP
   ═══════════════════════════════════════════════ */
.vitals-strip {
  grid-column: 1 / -1;
  display: flex;
  gap: 1px;
  background: var(--border-dim);
  overflow-x: auto;
}

.vital-card {
  flex: 1;
  min-width: 90px;
  background: var(--bg-panel);
  padding: 10px 12px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  position: relative;
}
.vital-card:hover { background: var(--bg-panel-hover); }
.vital-card.active { box-shadow: inset 0 -2px 0 var(--cyan-bright); }

.vital-domain {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.vital-count {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
}

.vital-bar {
  height: 3px;
  background: var(--border-dim);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}
.vital-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s var(--ease);
}

/* ═══════════════════════════════════════════════
   CORTEX MAP
   ═══════════════════════════════════════════════ */
#cortex-panel { position: relative; overflow: hidden; }

.view-svg {
  width: 100%;
  height: 100%;
  cursor: grab;
}
.view-svg:active { cursor: grabbing; }

/* Cortex map */
.cortex-link { stroke: var(--border-dim); stroke-opacity: 0.3; fill: none; }
.cortex-link.cross-domain {
  stroke-dasharray: 4 3;
  stroke-opacity: 0.5;
  animation: flow 2s linear infinite;
}
@keyframes flow { to { stroke-dashoffset: -14; } }

.cortex-node { cursor: pointer; transition: r 0.15s var(--ease); }
.cortex-node:hover { filter: brightness(1.3); }

.cortex-label {
  font-family: var(--font-mono);
  font-size: 8px;
  fill: var(--text-dim);
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: central;
}

.domain-label {
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: central;
  opacity: 0.5;
}

.learning-trail {
  fill: none;
  stroke: var(--amber-bright);
  stroke-width: 2;
  stroke-opacity: 0.5;
  stroke-dasharray: 6 4;
  animation: flow 3s linear infinite;
}

@keyframes pulse-ring {
  0% { r: 0; opacity: 0.6; }
  100% { r: 18; opacity: 0; }
}
.pulse-ring {
  fill: none;
  stroke-width: 1.5;
  pointer-events: none;
  animation: pulse-ring 2s ease-out infinite;
}

/* Org chart */
.org-link {
  fill: none;
  stroke: var(--border-dim);
  stroke-width: 1.2;
  stroke-opacity: 0.5;
}
.org-node { cursor: pointer; }
.org-node-bg {
  rx: 4;
  ry: 4;
  stroke-width: 1.5;
  transition: all 0.2s var(--ease);
}
.org-node:hover .org-node-bg { filter: brightness(1.2); }
.org-node-label {
  font-family: var(--font-mono);
  font-size: 11px;
  fill: var(--text-bright);
  pointer-events: none;
  dominant-baseline: central;
}
.org-node-type {
  font-family: var(--font-display);
  font-size: 7px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  pointer-events: none;
  dominant-baseline: central;
}
.org-node-count {
  font-family: var(--font-mono);
  font-size: 9px;
  fill: var(--text-dim);
  pointer-events: none;
  dominant-baseline: central;
}
.org-collapse-icon {
  font-family: var(--font-mono);
  font-size: 12px;
  fill: var(--text-dim);
  pointer-events: none;
  dominant-baseline: central;
  text-anchor: middle;
}

/* View toggle tabs in panel */
.view-tabs {
  display: flex;
  gap: 2px;
  position: absolute;
  top: 12px;
  right: 16px;
  z-index: 5;
}
.view-tab {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 10px;
  border: 1px solid var(--border-dim);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s var(--ease);
}
.view-tab:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.view-tab:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.view-tab:hover { border-color: var(--cyan-faded); color: var(--text-primary); }
.view-tab.active { background: var(--cyan-glow); border-color: var(--cyan-bright); color: var(--cyan-bright); }

/* ═══════════════════════════════════════════════
   SIDEBAR PANELS
   ═══════════════════════════════════════════════ */
.sidebar-stack {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border-dim);
}

/* Signals feed */
.signal-item {
  padding: 8px 12px;
  border-left: 3px solid var(--border-dim);
  font-size: 12px;
  font-family: var(--font-mono);
  transition: background 0.15s var(--ease);
}
.signal-item:hover { background: var(--bg-panel-hover); }
.signal-item.sig-usage { border-left-color: var(--cyan-faded); }
.signal-item.sig-gap { border-left-color: var(--red-faded); }
.signal-item.sig-change { border-left-color: var(--amber-faded); }
.signal-time {
  font-size: 10px;
  color: var(--text-dim);
  display: block;
  margin-top: 2px;
}

/* Heatmap */
.heatmap-grid {
  display: grid;
  gap: 2px;
  grid-template-columns: 70px repeat(7, 1fr);
}
.heatmap-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  padding-right: 4px;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 2px;
  background: var(--bg-deep);
  transition: background 0.2s var(--ease);
  min-height: 12px;
}

/* ═══════════════════════════════════════════════
   BOTTOM PANELS (Timeline + Table)
   ═══════════════════════════════════════════════ */
.bottom-panels {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border-dim);
}

#timeline-svg {
  width: 100%;
  height: 200px;
}

/* Skill table */
.skill-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 11px;
}
.skill-table th {
  text-align: left;
  padding: 6px 8px;
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-dim);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.skill-table th:hover { color: var(--cyan-bright); }
.skill-table th.sorted { color: var(--cyan-bright); }
.skill-table th.sorted::after { content: ' \25BE'; }
.skill-table th.sorted.asc::after { content: ' \25B4'; }

.skill-table td {
  padding: 5px 8px;
  border-bottom: 1px solid var(--border-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}
.skill-table tr { transition: background 0.1s; cursor: pointer; }
.skill-table tr:hover { background: var(--bg-panel-hover); }

.health-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 4px;
}
.health-dot.healthy { background: var(--green-bright); }
.health-dot.warning { background: var(--amber-bright); }
.health-dot.critical { background: var(--red-bright); animation: pulse-dot 2s ease infinite; }

@keyframes pulse-dot {
  0%, 100% { box-shadow: none; }
  50% { box-shadow: 0 0 6px var(--red-bright); }
}

.score-bar {
  height: 4px;
  background: var(--border-dim);
  border-radius: 2px;
  width: 50px;
  display: inline-block;
  vertical-align: middle;
  margin-left: 6px;
}
.score-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--cyan-faded);
  transition: width 0.4s var(--ease);
}

.domain-tag {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 2px;
  border: 1px solid;
  opacity: 0.8;
}

.table-wrap {
  max-height: 300px;
  overflow-y: auto;
}
.table-wrap::-webkit-scrollbar { width: 4px; }
.table-wrap::-webkit-scrollbar-track { background: var(--bg-deep); }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 2px; }

/* ═══════════════════════════════════════════════
   DETAIL INSPECTOR
   ═══════════════════════════════════════════════ */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s var(--ease);
}
.detail-overlay.open { opacity: 1; pointer-events: all; }

.detail-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 420px;
  height: 100vh;
  background: var(--bg-panel);
  border-left: 1px solid var(--border-glow);
  z-index: 201;
  transform: translateX(100%);
  transition: transform 0.3s var(--ease);
  overflow-y: auto;
  padding: 20px;
}
.detail-panel.open { transform: translateX(0); }

.detail-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: 1px solid var(--border-dim);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 14px;
  width: 28px;
  height: 28px;
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-close:hover { border-color: var(--red-faded); color: var(--red-bright); }

.detail-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 4px;
}
.detail-desc {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 16px;
  line-height: 1.4;
}

.detail-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.detail-meta-item {
  background: var(--bg-deep);
  padding: 8px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border-dim);
}
.detail-meta-label {
  font-family: var(--font-display);
  font-size: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
}
.detail-meta-val {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-bright);
  margin-top: 2px;
}

/* Radar chart */
.radar-wrap { text-align: center; margin: 16px 0; }
.radar-label {
  font-family: var(--font-mono);
  font-size: 9px;
  fill: var(--text-dim);
}
.radar-polygon {
  fill: var(--cyan-glow);
  stroke: var(--cyan-bright);
  stroke-width: 1.5;
}
.radar-grid { stroke: var(--border-dim); fill: none; }

.detail-deps {
  margin-top: 16px;
}
.detail-deps h4 {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.dep-chip {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 8px;
  border: 1px solid var(--border-dim);
  border-radius: 2px;
  margin: 2px;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s;
}
.dep-chip:hover { border-color: var(--cyan-faded); color: var(--cyan-bright); }

/* ═══════════════════════════════════════════════
   TOOLTIP
   ═══════════════════════════════════════════════ */
.no-tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--bg-panel);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-primary);
  z-index: 300;
  max-width: 260px;
  opacity: 0;
  transition: opacity 0.12s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.no-tooltip.show { opacity: 1; }
.no-tooltip .tt-name { color: var(--text-bright); font-weight: 700; }
.no-tooltip .tt-dim { color: var(--text-dim); }

/* ═══════════════════════════════════════════════
   COMMAND PALETTE
   ═══════════════════════════════════════════════ */
.palette-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 400;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 10vh;
  opacity: 0;

<script>
/* ═══════════════════════════════════════════════
   NEURAL OBSERVATORY — Modular Namespace
   ═══════════════════════════════════════════════ */
const NO = {};

/* ─── Config ─── */
NO.config = {
  firebase: {
    apiKey: 'AIzaSyDzUrhgqUHedNXYlGSqq2sFISBVrc2-Bbg',
    authDomain: 'skill-library-prod.firebaseapp.com',
    projectId: 'skill-library-prod',
    storageBucket: 'skill-library-prod.firebasestorage.app',
    messagingSenderId: '792932882875',
    appId: '1:792932882875:web:838c3d1c33afdfd5298c9e',
  },
  domainColors: {
    investing: '#5acece', sommelier: '#ce5aaa', writing: '#ceb45a',
    worldbuilding: '#5ace6a', 'game-theory': '#ce5a5a', design: '#8a7ace',
    'data-science': '#5a9ace', infrastructure: '#8ace5a', research: '#ce8a5a',
    artifacts: '#5acea0', meta: '#9a9aaa', philosophy: '#ce7a8a', neocortex: '#aa5ace',
    'biotech-venture': '#4aceaa', 'world-history': '#ce9a6a', product: '#6aaace'
  },
  typeRadius: { orchestrator: 9, director: 7, action: 6, knowledge: 5, observer: 5 },
  typeShape: { orchestrator: 'diamond', director: 'square', action: 'circle', knowledge: 'circle', observer: 'triangle' },
};

/* ─── Data Module ─── */
NO.data = {
  registry: null, skills: null, skillList: [],
  usage: [], gaps: [], evolution: [], changelogs: {},
  domains: {}, skillDomain: {}, domainOrder: [],

  async loadAll() {
    if (!this._db) {
      firebase.initializeApp(NO.config.firebase);
      this._db = firebase.firestore();
      // Connect to emulator when running locally
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        try { this._db.useEmulator('localhost', 8080); } catch(e) {}
      }
    }
    const db = this._db;

    const [skillsSnap, metaSnap, usageSnap, gapsSnap, evoSnap, changeSnap] = await Promise.all([
      db.collection('skills').get(),
      db.collection('meta').doc('registry').get(),
      db.collection('usage').orderBy('timestamp', 'desc').get(),
      db.collection('gaps').get(),
      db.collection('evolution').orderBy('date', 'asc').get(),
      db.collection('changelogs').get(),
    ]);

    // Skills
    const skills = {};
    skillsSnap.forEach(d => { skills[d.id] = d.data(); });
    const meta = metaSnap.exists ? metaSnap.data() : {};

    this.registry = {
      schema_version: meta.schema_version || 2,
      plugin_version: meta.plugin_version || '1.0.0',
      last_scan: meta.last_scan || null,
      skills,
      network: { domains: meta.network_domains || {} },
    };
    this.skills = skills;
    this.skillList = Object.values(skills);
    this.domains = meta.network_domains || {};

    // Usage
    this.usage = [];
    usageSnap.forEach(d => this.usage.push(d.data()));

    // Gaps
    this.gaps = [];
    gapsSnap.forEach(d => this.gaps.push(d.data()));

    // Evolution
    this.evolution = [];
    evoSnap.forEach(d => this.evolution.push(d.data()));

    // Changelogs
    this.changelogs = {};
    changeSnap.forEach(d => {
      const data = d.data();
      this.changelogs[data.skill || d.id] = data.entries || data;
    });

    // Build skill→domain mapping
    this.skillDomain = {};
    for (const [d, skillNames] of Object.entries(this.domains)) {
      for (const s of skillNames) this.skillDomain[s] = d;
    }

    // Domain order by size
    this.domainOrder = Object.entries(this.domains)
      .sort((a, b) => b[1].length - a[1].length)
      .map(d => d[0]);

    this.computeDerived();
  },

  computeDerived() {
    // Count cross-domain edges
    let crossCount = 0;
    let totalEdges = 0;
    for (const entry of this.skillList) {
      const d = this.skillDomain[entry.name] || '';
      for (const dep of (entry.depends_on || [])) {
        totalEdges++;
        if (this.skillDomain[dep] && this.skillDomain[dep] !== d) crossCount++;
      }
      for (const ref of (entry.referenced_by || [])) {
        totalEdges++;
        if (this.skillDomain[ref] && this.skillDomain[ref] !== d) crossCount++;
      }
    }
    this.totalEdges = totalEdges;
    this.crossDomainEdges = crossCount;

    // Usage counts
    this.usageCounts = {};
    for (const e of this.usage) {
      this.usageCounts[e.skill] = (this.usageCounts[e.skill] || 0) + 1;
    }

    // Heatmap: domain × day
    this.heatmapData = {};
    for (const e of this.usage) {
      const d = this.skillDomain[e.skill];
      if (!d) continue;
      const day = e.timestamp?.substring(0, 10);
      if (!day) continue;
      const key = `${d}|${day}`;
      this.heatmapData[key] = (this.heatmapData[key] || 0) + 1;
    }
  }
};

/* ─── Tooltip ─── */
NO.tooltip = {
  el: document.getElementById('tooltip'),
  show(evt, html) {
    this.el.innerHTML = html;
    this.el.classList.add('show');
    const x = Math.min(evt.clientX + 12, window.innerWidth - 280);
    const y = Math.min(evt.clientY + 12, window.innerHeight - 100);
    this.el.style.left = x + 'px';
    this.el.style.top = y + 'px';
  },
  hide() { this.el.classList.remove('show'); }
};

/* ─── Detail Inspector ─── */
NO.detail = {
  overlay: document.getElementById('detail-overlay'),
  panel: document.getElementById('detail-panel'),
  content: document.getElementById('detail-content'),

  init() {
    document.getElementById('detail-close').onclick = () => this.close();
    this.overlay.onclick = () => this.close();
  },

  open(name) {
    const s = NO.data.skills[name];
    if (!s) return;
    const m = s.metrics || {};
    const domain = NO.data.skillDomain[name] || 'unknown';
    const color = NO.config.domainColors[domain] || '#888';
    const used = NO.data.usageCounts[name] || 0;

    // Radar data
    const radarAxes = [
      { label: 'Structure', val: this.estStructure(m) },
      { label: 'Depth', val: this.estDepth(m) },
      { label: 'Connect', val: Math.min(100, ((s.depends_on?.length || 0) + (s.referenced_by?.length || 0)) * 10) },
      { label: 'Fresh', val: this.estFreshness(s) },
      { label: 'Usage', val: Math.min(100, used * 15) },
      { label: 'Refs', val: Math.min(100, (m.reference_files || 0) * 25) },
    ];

    let html = `<div class="detail-name" style="color:${this.esc(color)}">${this.esc(name)}</div>`;
    html += `<div class="detail-desc">${this.esc(s.description || '')}</div>`;
    html += `<div class="detail-meta-grid">`;
    html += this.metaItem('Domain', domain);
    html += this.metaItem('Type', s.type || '?');
    html += this.metaItem('Score', s.composite_score || 0);
    html += this.metaItem('Health', s.health_status || '?');
    html += this.metaItem('Words', (m.body_words || 0).toLocaleString());
    html += this.metaItem('Tokens', (m.estimated_tokens_total || 0).toLocaleString());
    html += this.metaItem('Refs', m.reference_files || 0);
    html += this.metaItem('Used', used + 'x');
    html += `</div>`;

    // Radar SVG
    html += `<div class="radar-wrap">${this.renderRadar(radarAxes)}</div>`;

    // Dependencies
    if (s.depends_on?.length) {
      html += `<div class="detail-deps"><h4>Depends On</h4>`;
      for (const dep of s.depends_on) {
        html += `<span class="dep-chip" data-skill="${this.esc(dep)}">${this.esc(dep)}</span>`;
      }
      html += `</div>`;
    }
    if (s.referenced_by?.length) {
      html += `<div class="detail-deps"><h4>Referenced By</h4>`;
      for (const ref of s.referenced_by) {
        html += `<span class="dep-chip" data-skill="${this.esc(ref)}">${this.esc(ref)}</span>`;
      }
      html += `</div>`;
    }

    // Dates
    html += `<div style="margin-top:16px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">`;
    if (s.created) html += `created: ${s.created}<br>`;
    if (s.last_modified) html += `modified: ${s.last_modified}`;
    html += `</div>`;

    this.content.innerHTML = html;
    this.panel.classList.add('open');
    this.overlay.classList.add('open');

    // Wire dep chips
    this.content.querySelectorAll('.dep-chip').forEach(el => {
      el.onclick = () => this.open(el.dataset.skill);
    });
  },

  close() {
    this.panel.classList.remove('open');
    this.overlay.classList.remove('open');
  },

  metaItem(label, val) {
    return `<div class="detail-meta-item"><div class="detail-meta-label">${this.esc(label)}</div><div class="detail-meta-val">${this.esc(String(val))}</div></div>`;
  },

  renderRadar(axes) {
    const size = 160, cx = size/2, cy = size/2, r = 60;
    const n = axes.length;
    let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;

    // Grid rings
    for (const pct of [0.25, 0.5, 0.75, 1.0]) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
        pts.push(`${cx + r * pct * Math.cos(angle)},${cy + r * pct * Math.sin(angle)}`);
      }
      svg += `<polygon points="${pts.join(' ')}" class="radar-grid"/>`;
    }

    // Axes
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const ex = cx + r * Math.cos(angle), ey = cy + r * Math.sin(angle);
      svg += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--border-dim)" stroke-width="0.5"/>`;
      const lx = cx + (r + 14) * Math.cos(angle), ly = cy + (r + 14) * Math.sin(angle);
      svg += `<text x="${lx}" y="${ly}" class="radar-label" text-anchor="middle" dominant-baseline="central">${axes[i].label}</text>`;
    }

    // Data polygon
    const dataPts = [];
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const v = Math.max(0, Math.min(100, axes[i].val)) / 100;
      dataPts.push(`${cx + r * v * Math.cos(angle)},${cy + r * v * Math.sin(angle)}`);
    }
    svg += `<polygon points="${dataPts.join(' ')}" class="radar-polygon"/>`;
    svg += `</svg>`;
    return svg;
  },

  estStructure(m) {
    const sections = Math.min(100, (m.section_count || 0) * 12);
    const refs = Math.min(100, (m.reference_files || 0) * 30);
    return Math.round(sections * 0.6 + refs * 0.4);
  },
  estDepth(m) {
    const w = m.body_words || 0;
    if (w < 100) return 20;
    if (w < 300) return 40;
    if (w > 5000) return Math.max(40, 100 - (w - 5000) / 100);
    return Math.min(100, 40 + (w - 300) * 60 / 4700);
  },
  estFreshness(s) {
    if (!s.last_modified) return 30;
    const days = (Date.now() - new Date(s.last_modified).getTime()) / 86400000;
    return Math.max(0, Math.round(100 - (days / 90) * 100));
  },

  esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
};

/* ─── Vitals Strip ─── */
NO.vitals = {
  activeFilter: null,

  render() {
    const strip = document.getElementById('vitals-strip');
    const maxCount = Math.max(...NO.data.domainOrder.map(d => NO.data.domains[d]?.length || 0));
    let html = '';

    // All domains card
    html += `<div class="vital-card ${this.activeFilter === null ? 'active' : ''}" data-domain="all">`;
    html += `<div class="vital-domain" style="color:var(--text-dim)">ALL</div>`;
    html += `<div class="vital-count">${NO.data.skillList.length}</div>`;
    html += `<div class="vital-bar"><div class="vital-bar-fill" style="width:100%;background:var(--cyan-faded)"></div></div>`;
    html += `</div>`;

    for (const d of NO.data.domainOrder) {
      const skills = NO.data.domains[d] || [];
      const color = NO.config.domainColors[d] || '#888';
      const pct = Math.round((skills.length / maxCount) * 100);
      const active = this.activeFilter === d ? ' active' : '';
      html += `<div class="vital-card${active}" data-domain="${NO.detail.esc(d)}">`;
      html += `<div class="vital-domain" style="color:${color}">${NO.detail.esc(d)}</div>`;
      html += `<div class="vital-count">${skills.length}</div>`;
      html += `<div class="vital-bar"><div class="vital-bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
      html += `</div>`;
    }

    strip.innerHTML = html;
    strip.querySelectorAll('.vital-card').forEach(el => {
      el.onclick = () => {
        const d = el.dataset.domain;
        this.activeFilter = d === 'all' ? null : (this.activeFilter === d ? null : d);
        this.render();
        NO.cortex.filterDomain(this.activeFilter);
        NO.table.render();
      };
    });
  }
};

/* ─── Cortex Map (D3 Force) ─── */
NO.cortex = {
  svg: null, sim: null, nodes: [], links: [],
  showLabels: false, showTrail: false, filteredDomain: null,
  g: null, linkG: null, nodeG: null, labelG: null, trailG: null, domainLabelG: null, pulseG: null,

  init() {
    const container = document.getElementById('cortex-panel');
    const svg = d3.select('#cortex-svg');
    this.svg = svg;

    const width = container.clientWidth;
    const height = container.clientHeight - 32;
    svg.attr('viewBox', `0 0 ${width} ${height}`);
    this.w = width;
    this.h = height;

    // Build nodes and links
    this.buildGraph(width, height);

    // Defs: glow filter + per-domain radial gradients
    const defs = svg.append('defs');
    const glow = defs.append('filter').attr('id', 'glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
    glow.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
    const merge = glow.append('feMerge');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');

    // Stronger glow for orchestrators
    const glowStrong = defs.append('filter').attr('id', 'glow-strong').attr('x', '-80%').attr('y', '-80%').attr('width', '260%').attr('height', '260%');
    glowStrong.append('feGaussianBlur').attr('stdDeviation', '5').attr('result', 'blur');
    const merge2 = glowStrong.append('feMerge');
    merge2.append('feMergeNode').attr('in', 'blur');
    merge2.append('feMergeNode').attr('in', 'SourceGraphic');

    // Groups (order matters for layering)
    const g = svg.append('g');
    this.g = g;
    this.trailG = g.append('g').attr('class', 'trail-group');
    this.linkG = g.append('g').attr('class', 'link-group');
    this.domainLabelG = g.append('g').attr('class', 'domain-label-group');
    this.pulseG = g.append('g').attr('class', 'pulse-group');
    this.nodeG = g.append('g').attr('class', 'node-group');
    this.labelG = g.append('g').attr('class', 'label-group').style('display', 'none');

    // Zoom
    const zoom = d3.zoom()
      .scaleExtent([0.3, 4])
      .on('zoom', (e) => g.attr('transform', e.transform));
    svg.call(zoom);

    // Render
    this.renderLinks();
    this.renderDomainLabels();
    this.renderNodes(width, height);
    this.renderLabels();
    this.renderPulseRings();
    this.startSimulation(width, height);
  },

  // Score-scaled radius: base type size + score bonus
  nodeRadius(d) {
    const base = NO.config.typeRadius[d.type] || 5;
    const scoreBonus = (d.score / 100) * 4; // up to +4px for score=100
    return base + scoreBonus;
  },

  buildGraph(w, h) {
    const data = NO.data;
    const domainCenters = {};
    const domainList = data.domainOrder;
    domainList.forEach((d, i) => {
      const angle = (2 * Math.PI * i / domainList.length) - Math.PI / 2;
      const radius = Math.min(w, h) * 0.32;
      domainCenters[d] = { x: w/2 + radius * Math.cos(angle), y: h/2 + radius * Math.sin(angle) };
    });
    this.domainCenters = domainCenters;

    // Identify recently used skills (last 15 usage events)
    const recentlyUsed = new Set(NO.data.usage.slice(-15).map(e => e.skill));

    this.nodes = data.skillList.map(s => ({
      id: s.name,
      domain: data.skillDomain[s.name] || 'unknown',
      type: s.type,
      score: s.composite_score || 0,
      health: s.health_status,
      used: (data.usageCounts[s.name] || 0) > 0,
      recent: recentlyUsed.has(s.name),
      words: s.metrics?.body_words || 0,
      refs: s.metrics?.reference_files || 0,
      x: (domainCenters[data.skillDomain[s.name]]?.x || w/2) + (Math.random() - 0.5) * 40,
      y: (domainCenters[data.skillDomain[s.name]]?.y || h/2) + (Math.random() - 0.5) * 40,
    }));

    const nodeMap = new Map(this.nodes.map(n => [n.id, n]));

    this.links = [];
    for (const s of data.skillList) {
      for (const dep of (s.depends_on || [])) {
        if (nodeMap.has(dep)) {
          const sd = data.skillDomain[s.name], td = data.skillDomain[dep];
          this.links.push({
            source: s.name, target: dep,
            crossDomain: sd && td && sd !== td
          });
        }
      }
    }
  },

  renderDomainLabels() {
    const labels = Object.entries(this.domainCenters).map(([d, pos]) => ({
      domain: d, ...pos, color: NO.config.domainColors[d] || '#888'
    }));
    this.domainLabelG.selectAll('text')
      .data(labels, d => d.domain)
      .join('text')
      .attr('class', 'domain-label')
      .attr('fill', d => d.color)
      .text(d => d.domain);
  },

  renderLinks() {
    this.linkG.selectAll('path')
      .data(this.links)
      .join('path')
      .attr('class', d => 'cortex-link' + (d.crossDomain ? ' cross-domain' : ''))
      .attr('stroke', d => d.crossDomain ? 'var(--magenta-faded)' : 'var(--border-dim)')
      .attr('stroke-width', d => d.crossDomain ? 1.5 : 0.5);
  },

  renderPulseRings() {
    const recentNodes = this.nodes.filter(d => d.recent);
    this.pulseG.selectAll('circle')
      .data(recentNodes, d => d.id)
      .join('circle')
      .attr('class', 'pulse-ring')
      .attr('stroke', d => NO.config.domainColors[d.domain] || '#888');
  },

  renderNodes(w, h) {
    const self = this;
    const nodeEls = this.nodeG.selectAll('g')
      .data(this.nodes, d => d.id)
      .join('g')
      .attr('class', 'cortex-node-g')
      .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) self.sim.alphaTarget(0.1).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) self.sim.alphaTarget(0); d.fx = null; d.fy = null; })
      );

    nodeEls.each(function(d) {
      const g = d3.select(this);
      g.selectAll('*').remove();
      const r = self.nodeRadius(d);
      const color = NO.config.domainColors[d.domain] || '#888';
      const opacity = d.used ? 0.9 : 0.35;

      if (d.type === 'orchestrator') {
        const s = r * 1.2;
        g.append('rect')
          .attr('width', s * 2).attr('height', s * 2)
          .attr('x', -s).attr('y', -s)
          .attr('transform', 'rotate(45)')
          .attr('fill', color)
          .attr('opacity', opacity)
          .attr('filter', 'url(#glow-strong)');
      } else if (d.type === 'director') {
        const s = r;
        g.append('rect')
          .attr('width', s * 2).attr('height', s * 2)
          .attr('x', -s).attr('y', -s)
          .attr('rx', 2)
          .attr('fill', color)
          .attr('opacity', opacity)
          .attr('filter', 'url(#glow)');
      } else if (d.type === 'action') {
        // Hexagon-ish (6-sided)
        const hex = d3.range(6).map(i => {
          const a = (Math.PI / 3) * i - Math.PI / 6;
          return [r * Math.cos(a), r * Math.sin(a)];
        });
        g.append('polygon')
          .attr('points', hex.map(p => p.join(',')).join(' '))
          .attr('fill', color)
          .attr('opacity', opacity);
      } else {
        g.append('circle')
          .attr('r', r)
          .attr('fill', color)
          .attr('opacity', opacity);
      }

      // Score ring for high-scoring skills
      if (d.score >= 60) {
        g.append('circle')
          .attr('r', r + 3)
          .attr('fill', 'none')
          .attr('stroke', color)
          .attr('stroke-width', 0.8)
          .attr('stroke-opacity', 0.4)
          .attr('stroke-dasharray', `${(d.score / 100) * (2 * Math.PI * (r + 3))} 999`);
      }
    });

    // Hover: highlight connected nodes
    nodeEls
      .on('mouseover', (e, d) => {
        const color = NO.config.domainColors[d.domain] || '#888';
        const usages = NO.data.usageCounts[d.id] || 0;
        NO.tooltip.show(e,
          `<div class="tt-name" style="color:${color}">${d.id}</div>` +
          `<div class="tt-dim">${d.domain} / ${d.type}${d.recent ? ' &bull; recent' : ''}</div>` +
          `<div>Score: ${d.score} | Words: ${d.words.toLocaleString()} | Used: ${usages}x</div>`
        );
        // Dim unconnected nodes
        const connected = new Set();
        connected.add(d.id);
        for (const link of self.links) {
          const sid = typeof link.source === 'object' ? link.source.id : link.source;
          const tid = typeof link.target === 'object' ? link.target.id : link.target;
          if (sid === d.id) connected.add(tid);
          if (tid === d.id) connected.add(sid);
        }
        self.nodeG.selectAll('.cortex-node-g').style('opacity', n => connected.has(n.id) ? 1 : 0.15);
        self.linkG.selectAll('path').style('opacity', l => {
          const sid = typeof l.source === 'object' ? l.source.id : l.source;
          const tid = typeof l.target === 'object' ? l.target.id : l.target;
          return (sid === d.id || tid === d.id) ? 0.8 : 0.03;
        });
      })
      .on('mouseout', () => {
        NO.tooltip.hide();
        const domain = self.filteredDomain;
        self.nodeG.selectAll('.cortex-node-g').style('opacity', d => !domain || d.domain === domain ? 1 : 0.1);
        self.linkG.selectAll('path').style('opacity', d => {
          if (!domain) return d.crossDomain ? 0.5 : 0.3;
          const sd = d.source.domain || d.source, td = d.target.domain || d.target;
          return (sd === domain || td === domain) ? 0.5 : 0.05;
        });
      })
      .on('click', (e, d) => { e.stopPropagation(); NO.detail.open(d.id); });
  },

  renderLabels() {
    this.labelG.selectAll('text')
      .data(this.nodes, d => d.id)
      .join('text')
      .attr('class', 'cortex-label')
      .text(d => d.id.length > 14 ? d.id.substring(0, 12) + '..' : d.id);
  },

  startSimulation(w, h) {
    const self = this;
    const centers = this.domainCenters;

    function forceCluster(alpha) {
      for (const d of self.nodes) {
        const c = centers[d.domain];
        if (!c) continue;
        d.vx += (c.x - d.x) * 0.12 * alpha;
        d.vy += (c.y - d.y) * 0.12 * alpha;
      }
    }

    this.sim = d3.forceSimulation(this.nodes)
      .force('link', d3.forceLink(this.links).id(d => d.id).distance(35).strength(0.2))
      .force('charge', d3.forceManyBody().strength(-60).distanceMax(180))
      .force('x', d3.forceX(w / 2).strength(0.07))
      .force('y', d3.forceY(h / 2).strength(0.07))
      .force('cluster', forceCluster)
      .force('collide', d3.forceCollide(d => self.nodeRadius(d) + 2))
      .alphaDecay(0.02)
      .on('tick', () => this.tick());
  },

  tick() {
    this.linkG.selectAll('path')
      .attr('d', d => {
        const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
        if (d.crossDomain) {
          const mx = (sx + tx) / 2, my = (sy + ty) / 2 - 30;
          return `M${sx},${sy} Q${mx},${my} ${tx},${ty}`;
        }
        return `M${sx},${sy} L${tx},${ty}`;
      });

    this.nodeG.selectAll('.cortex-node-g')
      .attr('transform', d => `translate(${d.x},${d.y})`);

    this.labelG.selectAll('text')
      .attr('x', d => d.x)
      .attr('y', d => d.y + this.nodeRadius(d) + 10);

    // Domain labels follow cluster centers (weighted average of node positions)
    const domainPositions = {};
    for (const n of this.nodes) {
      if (!domainPositions[n.domain]) domainPositions[n.domain] = { sx: 0, sy: 0, c: 0 };
      domainPositions[n.domain].sx += n.x;
      domainPositions[n.domain].sy += n.y;
      domainPositions[n.domain].c++;
    }
    this.domainLabelG.selectAll('text')
      .attr('x', d => { const p = domainPositions[d.domain]; return p ? p.sx / p.c : d.x; })
      .attr('y', d => { const p = domainPositions[d.domain]; return p ? p.sy / p.c - (Math.min(this.w, this.h) * 0.08) : d.y; });

    // Pulse rings follow their nodes
    this.pulseG.selectAll('circle')
      .attr('cx', d => d.x)
      .attr('cy', d => d.y);
  },

  filterDomain(domain) {
    this.filteredDomain = domain;
    this.nodeG.selectAll('.cortex-node-g')
      .transition().duration(200)
      .style('opacity', d => !domain || d.domain === domain ? 1 : 0.1);
    this.linkG.selectAll('path')
      .transition().duration(200)
      .style('opacity', d => {
        if (!domain) return d.crossDomain ? 0.5 : 0.3;
        const sd = d.source.domain || d.source, td = d.target.domain || d.target;
        return (sd === domain || td === domain) ? 0.5 : 0.05;
      });
    this.domainLabelG.selectAll('text')
      .transition().duration(200)
      .style('opacity', d => !domain || d.domain === domain ? 0.5 : 0.08);
    this.pulseG.selectAll('circle')
      .transition().duration(200)
      .style('opacity', d => !domain || d.domain === domain ? 1 : 0.05);
  },

  toggleLabels() {
    this.showLabels = !this.showLabels;
    this.labelG.style('display', this.showLabels ? null : 'none');
  },

  toggleTrail() {
    this.showTrail = !this.showTrail;
    this.trailG.selectAll('*').remove();
    if (!this.showTrail) return;

    const usageNodes = [];
    const nodeMap = new Map(this.nodes.map(n => [n.id, n]));
    for (const e of NO.data.usage) {
      const n = nodeMap.get(e.skill);
      if (n) usageNodes.push(n);
    }
    if (usageNodes.length < 2) return;

    const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveCatmullRom.alpha(0.5));
    this.trailG.append('path')
      .datum(usageNodes)
      .attr('class', 'learning-trail')
      .attr('d', line);
  }
};

/* ─── Org Chart (Collapsible Tree) ─── */
NO.org = {
  svg: null, g: null, root: null, treeLayout: null,
  nodeW: 160, nodeH: 28, duration: 400,

  init() {
    const container = document.getElementById('cortex-panel');
    const svg = d3.select('#org-svg');
    this.svg = svg;

    const width = container.clientWidth;
    const height = container.clientHeight - 32;
    svg.attr('viewBox', `0 0 ${width} ${height}`);

    const g = svg.append('g').attr('transform', 'translate(40, 20)');
    this.g = g;
    this.width = width;
    this.height = height;

    // Zoom
    svg.call(d3.zoom().scaleExtent([0.2, 3])
      .on('zoom', (e) => g.attr('transform', e.transform)));

    // Build hierarchy from registry parent data
    this.buildTree();
    this.render(this.root);
  },

  buildTree() {
    const data = NO.data;
    const skills = data.skills;

    // Root node
    const treeData = { name: 'Skill Library', type: 'root', children: [] };

    // Group by domain
    for (const domain of data.domainOrder) {
      const domainNode = {
        name: domain, type: 'domain', domain: domain,
        color: NO.config.domainColors[domain] || '#888',
        children: []
      };

      const domainSkills = data.domains[domain] || [];
      const childrenOf = {}; // parent → [children]

      for (const sName of domainSkills) {
        const s = skills[sName];
        if (!s) continue;
        const parent = s.parent;
        if (parent && domainSkills.includes(parent)) {
          if (!childrenOf[parent]) childrenOf[parent] = [];
          childrenOf[parent].push(sName);
        }
      }

      // Find root skills in this domain (no parent, or parent not in domain)
      const roots = domainSkills.filter(sName => {
        const s = skills[sName];
        return !s?.parent || !domainSkills.includes(s.parent);
      });

      // Recursive tree builder
      const buildNode = (sName) => {
        const s = skills[sName];
        if (!s) return null;
        const node = {
          name: sName,
          type: s.type,
          domain: domain,
          color: NO.config.domainColors[domain] || '#888',
          score: s.composite_score || 0,
          description: s.description || '',
        };
        const kids = childrenOf[sName];
        if (kids && kids.length) {
          node.children = kids.sort((a, b) => {
            const ta = skills[a]?.type || '', tb = skills[b]?.type || '';
            const order = { orchestrator: 0, director: 1, action: 2, knowledge: 3, observer: 4 };
            return (order[ta] ?? 5) - (order[tb] ?? 5) || a.localeCompare(b);
          }).map(buildNode).filter(Boolean);
        }
        return node;
      };

      // Sort roots: orchestrators first
      roots.sort((a, b) => {
        const ta = skills[a]?.type || '', tb = skills[b]?.type || '';
        const order = { orchestrator: 0, director: 1, action: 2, knowledge: 3, observer: 4 };
        return (order[ta] ?? 5) - (order[tb] ?? 5) || a.localeCompare(b);
      });

      domainNode.children = roots.map(buildNode).filter(Boolean);
      treeData.children.push(domainNode);
    }

    this.root = d3.hierarchy(treeData);

    // Start with domains expanded, children collapsed
    this.root.children?.forEach(domainNode => {
      domainNode.children?.forEach(child => {
        if (child.children) this.collapse(child);
      });
    });

    this.root.x0 = this.height / 2;
    this.root.y0 = 0;
  },

  collapse(d) {
    if (d.children) {
      d._children = d.children;
      d._children.forEach(c => this.collapse(c));
      d.children = null;
    }
  },

  toggle(d) {
    if (d.children) {
      d._children = d.children;
      d.children = null;
    } else if (d._children) {
      d.children = d._children;
      d._children = null;
    }
  },

  render(source) {
    const self = this;
    const tree = d3.tree().nodeSize([this.nodeH + 4, this.nodeW + 20]);
    tree(this.root);

    const nodes = this.root.descendants();
    const links = this.root.links();

    // Normalize depth for horizontal layout
    nodes.forEach(d => { d.y = d.depth * (this.nodeW + 30); });

    // ── Links ──
    const link = this.g.selectAll('.org-link-g')
      .data(links, d => d.target.data.name + d.target.depth);

    const linkEnter = link.enter().append('path')
      .attr('class', 'org-link')
      .attr('d', () => {
        const o = { x: source.x0, y: source.y0 };
        return this.diagonal(o, o);
      });

    link.merge(linkEnter)
      .transition().duration(this.duration)
      .attr('d', d => this.diagonal(d.source, d.target))
      .attr('stroke', d => d.target.data.color || 'var(--border-dim)');

    link.exit().transition().duration(this.duration)
      .attr('d', () => {
        const o = { x: source.x, y: source.y };
        return this.diagonal(o, o);
      }).remove();

    // ── Nodes ──
    const node = this.g.selectAll('.org-node')
      .data(nodes, d => d.data.name + d.depth);

    const nodeEnter = node.enter().append('g')
      .attr('class', 'org-node')
      .attr('transform', `translate(${source.y0},${source.x0})`)
      .style('opacity', 0);

    // Background rect
    nodeEnter.append('rect')
      .attr('class', 'org-node-bg')
      .attr('width', d => d.data.type === 'root' ? 100 : d.data.type === 'domain' ? 90 : this.nodeW)
      .attr('height', this.nodeH)
      .attr('y', -this.nodeH / 2)
      .attr('x', -4);

    // Collapse indicator
    nodeEnter.append('text')
      .attr('class', 'org-collapse-icon')
      .attr('x', -14)
      .attr('y', 1);

    // Label
    nodeEnter.append('text')
      .attr('class', 'org-node-label')
      .attr('x', 6)
      .attr('y', -2);

    // Type badge
    nodeEnter.append('text')
      .attr('class', 'org-node-type')
      .attr('x', 6)
      .attr('y', 10);

    // Child count
    nodeEnter.append('text')
      .attr('class', 'org-node-count');

    // ── Update all ──
    const nodeUpdate = node.merge(nodeEnter);

    nodeUpdate.transition().duration(this.duration)
      .attr('transform', d => `translate(${d.y},${d.x})`)
      .style('opacity', 1);

    nodeUpdate.select('.org-node-bg')
      .attr('fill', d => {
        if (d.data.type === 'root') return 'var(--bg-deep)';
        if (d.data.type === 'domain') return d.data.color + '18';
        return 'var(--bg-deep)';
      })
      .attr('stroke', d => d.data.color || 'var(--border-dim)')
      .attr('stroke-opacity', d => d.data.type === 'root' ? 0.3 : 0.5);

    nodeUpdate.select('.org-collapse-icon')
      .text(d => d.children ? '\u25BC' : d._children ? '\u25B6' : '')
      .attr('fill', d => d.data.color || 'var(--text-dim)');

    nodeUpdate.select('.org-node-label')
      .text(d => {
        const n = d.data.name;
        const maxLen = d.data.type === 'domain' ? 12 : 18;
        return n.length > maxLen ? n.substring(0, maxLen - 1) + '\u2026' : n;
      })
      .attr('fill', d => d.data.type === 'domain' ? d.data.color : 'var(--text-bright)')
      .attr('font-weight', d => (d.data.type === 'domain' || d.data.type === 'orchestrator') ? '700' : '400');

    nodeUpdate.select('.org-node-type')
      .text(d => (d.data.type !== 'root' && d.data.type !== 'domain') ? d.data.type : '')
      .attr('fill', d => d.data.color || 'var(--text-dim)');

    nodeUpdate.select('.org-node-count')
      .text(d => {
        const kids = d._children || d.children;
        return kids ? `(${this.countDescendants(d)})` : '';
      })
      .attr('x', d => {
        const w = d.data.type === 'root' ? 100 : d.data.type === 'domain' ? 90 : this.nodeW;
        return w + 4;
      })
      .attr('y', 1);

    // Click handler
    nodeUpdate.on('click', (e, d) => {
      if (d.data.type !== 'root' && d.data.type !== 'domain' && !d.children && !d._children) {
        // Leaf node — open detail
        NO.detail.open(d.data.name);
        return;
      }
      this.toggle(d);
      this.render(d);
    }).on('mouseover', (e, d) => {
      if (d.data.description) {
        NO.tooltip.show(e, `<div class="tt-name" style="color:${d.data.color || 'var(--text-bright)'}">${d.data.name}</div><div>${d.data.description}</div>${d.data.score ? '<div class="tt-dim">Score: ' + d.data.score + '</div>' : ''}`);
      }
    }).on('mouseout', () => NO.tooltip.hide());

    // ── Exit ──
    node.exit().transition().duration(this.duration)
      .attr('transform', `translate(${source.y},${source.x})`)
      .style('opacity', 0)
      .remove();

    // Stash positions for next transition
    nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
  },

  countDescendants(d) {
    let count = 0;
    const kids = d._children || d.children;
    if (!kids) return 0;
    for (const c of kids) {
      count++;
      count += this.countDescendants(c);
    }
    return count;
  },

  diagonal(s, t) {
    return `M${s.y},${s.x} C${(s.y + t.y) / 2},${s.x} ${(s.y + t.y) / 2},${t.x} ${t.y},${t.x}`;
  },

  filterDomain(domain) {
    // For org chart, rebuild the tree with only matching domain
    // (or all if null). Simple approach: re-init
    // Not needed per user request — org chart shows all, no cross-domain filtering
  }
};

/* ─── Growth Timeline ─── */
NO.timeline = {
  render() {
    const svg = d3.select('#timeline-svg');
    const container = document.getElementById('timeline-panel');
    const width = container.clientWidth - 32;
    const height = 200;
    svg.attr('viewBox', `0 0 ${width} ${height}`);
    svg.selectAll('*').remove();

    // Group evolution data by date and domain
    const evoData = NO.data.evolution;
    if (!evoData.length) {
      svg.append('text').attr('x', width/2).attr('y', height/2)
        .attr('text-anchor', 'middle').attr('fill', 'var(--text-dim)')
        .attr('font-family', 'var(--font-mono)').attr('font-size', '11')
        .text('No evolution data yet — run: python3 scripts/snapshot_evolution.py');
      return;
    }

    // Get unique dates and domains
    const dateSet = new Set();
    const domainScores = {};
    for (const e of evoData) {
      const day = e.date?.substring(0, 10);
      if (!day) continue;
      dateSet.add(day);
      const domain = NO.data.skillDomain[e.skill] || 'unknown';
      if (!domainScores[day]) domainScores[day] = {};
      if (!domainScores[day][domain]) domainScores[day][domain] = [];
      domainScores[day][domain].push(e.composite_score || 0);
    }

    const dates = [...dateSet].sort();
    const domains = NO.data.domainOrder;

    // Build stacked data: average score per domain per date
    const stackData = dates.map(day => {
      const row = { date: day };
      for (const d of domains) {
        const scores = domainScores[day]?.[d] || [];
        row[d] = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
      }
      return row;
    });

    const margin = { top: 10, right: 10, bottom: 30, left: 35 };
    const iw = width - margin.left - margin.right;
    const ih = height - margin.top - margin.bottom;

    const x = d3.scalePoint().domain(dates).range([0, iw]).padding(0.2);
    const stack = d3.stack().keys(domains).order(d3.stackOrderNone).offset(d3.stackOffsetNone);
    const series = stack(stackData);
    const yMax = d3.max(series, s => d3.max(s, d => d[1])) || 100;
    const y = d3.scaleLinear().domain([0, yMax]).range([ih, 0]);

    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    // Area
    const area = d3.area()
      .x(d => x(d.data.date))
      .y0(d => y(d[0]))
      .y1(d => y(d[1]))
      .curve(d3.curveMonotoneX);

    g.selectAll('.area')
      .data(series)
      .join('path')
      .attr('d', area)
      .attr('fill', d => NO.config.domainColors[d.key] || '#888')
      .attr('opacity', 0.6);

    // Axes
    g.append('g')
      .attr('transform', `translate(0,${ih})`)
      .call(d3.axisBottom(x).tickValues(dates.filter((_, i) => i % Math.ceil(dates.length / 6) === 0)))
      .selectAll('text').attr('fill', 'var(--text-dim)').attr('font-size', '9');

    g.append('g')
      .call(d3.axisLeft(y).ticks(4))
      .selectAll('text').attr('fill', 'var(--text-dim)').attr('font-size', '9');

    g.selectAll('.domain').attr('stroke', 'var(--border-dim)');
    g.selectAll('.tick line').attr('stroke', 'var(--border-dim)');
  }
};

/* ─── Skill Table ─── */
NO.table = {
  sortCol: 'name',
  sortAsc: true,

  init() {
    document.querySelectorAll('#skill-table th').forEach(th => {
      th.onclick = () => {
        const col = th.dataset.col;
        if (this.sortCol === col) { this.sortAsc = !this.sortAsc; }
        else { this.sortCol = col; this.sortAsc = true; }
        document.querySelectorAll('#skill-table th').forEach(t => {
          t.classList.remove('sorted', 'asc');
        });
        th.classList.add('sorted');
        if (this.sortAsc) th.classList.add('asc');
        this.render();
      };
    });

    document.getElementById('table-search').oninput = () => this.render();
    this.render();
  },

  render() {
    const tbody = document.getElementById('table-body');
    const query = (document.getElementById('table-search').value || '').toLowerCase();
    const domainFilter = NO.vitals.activeFilter;

    let rows = NO.data.skillList.map(s => ({
      name: s.name,
      domain: NO.data.skillDomain[s.name] || '',
      type: s.type,
      score: s.composite_score || 0,
      words: s.metrics?.body_words || 0,
      connections: (s.depends_on?.length || 0) + (s.referenced_by?.length || 0),
      health: s.health_status,
    }));

    // Filters
    if (query) rows = rows.filter(r => r.name.includes(query) || r.domain.includes(query));
    if (domainFilter) rows = rows.filter(r => r.domain === domainFilter);

    // Sort
    const col = this.sortCol;
    const dir = this.sortAsc ? 1 : -1;
    rows.sort((a, b) => {
      const av = a[col], bv = b[col];
      if (typeof av === 'number') return (av - bv) * dir;
      return String(av).localeCompare(String(bv)) * dir;
    });

    // Render (max 100)
    let html = '';
    for (const r of rows.slice(0, 100)) {
      const color = NO.config.domainColors[r.domain] || '#888';
      const scorePct = Math.min(100, r.score);
      html += `<tr data-skill="${NO.detail.esc(r.name)}">`;
      html += `<td><span class="health-dot ${r.health}"></span>${NO.detail.esc(r.name)}</td>`;
      html += `<td><span class="domain-tag" style="color:${color};border-color:${color}40">${NO.detail.esc(r.domain)}</span></td>`;
      html += `<td>${NO.detail.esc(r.type)}</td>`;
      html += `<td>${r.score}<span class="score-bar"><span class="score-bar-fill" style="width:${scorePct}%;background:${color}"></span></span></td>`;
      html += `<td>${r.words.toLocaleString()}</td>`;
      html += `<td>${r.connections}</td>`;
      html += `</tr>`;
    }

    tbody.innerHTML = html;

    tbody.querySelectorAll('tr').forEach(tr => {
      tr.onclick = () => NO.detail.open(tr.dataset.skill);
    });
  }
};

/* ─── Command Palette ─── */
NO.palette = {
  overlay: document.getElementById('palette-overlay'),
  input: document.getElementById('palette-input'),
  results: document.getElementById('palette-results'),
  entries: [],

  init() {
    this.buildEntries();

    // Open/close
    document.getElementById('btn-palette').onclick = () => this.open();
    this.overlay.onclick = (e) => { if (e.target === this.overlay) this.close(); };
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); this.open(); }
      if (e.key === 'Escape' && this.overlay.classList.contains('open')) this.close();
    });

    this.input.oninput = () => this.filter();
  },

  buildEntries() {
    const skills = NO.data.skills;
    const domainMap = NO.data.skillDomain;
    const domains = NO.data.domains;
    const domainOrder = NO.data.domainOrder;

    // Domain icons
    const icons = {
      investing: '\u{1F4C8}', sommelier: '\u{1F377}', writing: '\u{270F}\uFE0F',
      worldbuilding: '\u{1F30D}', 'game-theory': '\u{265F}\uFE0F', design: '\u{1F3A8}',
      'data-science': '\u{1F4CA}', infrastructure: '\u{2699}\uFE0F', research: '\u{1F50D}',
      artifacts: '\u{2728}', meta: '\u{1F9E0}', philosophy: '\u{1F4AD}', neocortex: '\u{1F52C}'
    };
    this.entries = [];

    for (const d of domainOrder) {
      const domainSkills = domains[d] || [];
      const orch = domainSkills.find(s => skills[s]?.type === 'orchestrator');
      if (!orch) continue;

      const s = skills[orch];
      const desc = s.description || '';

      // Extract "Use when..." phrase
      let useWhen = '';
      const patterns = ['Use when ', 'Activate when ', 'use when '];
      for (const p of patterns) {
        const idx = desc.indexOf(p);
        if (idx !== -1) {
          useWhen = desc.substring(idx).split(/\.\s/)[0] + '.';
          break;
        }
      }
      if (!useWhen) useWhen = desc.split('.').slice(0, 2).join('.') + '.';

      // Get directors as routes
      const directors = domainSkills
        .filter(sn => skills[sn]?.type === 'director')
        .map(sn => ({ name: sn, desc: (skills[sn]?.description || '').split('.')[0] }));

      // Get action skills
      const actions = domainSkills
        .filter(sn => skills[sn]?.type === 'action')
        .map(sn => sn);

      this.entries.push({
        domain: d,
        name: orch,
        icon: icons[d] || '\u{1F4E6}',
        color: NO.config.domainColors[d] || '#888',
        useWhen: useWhen,
        directors: directors,
        actions: actions,
        searchText: `${d} ${orch} ${useWhen} ${directors.map(dr => dr.name + ' ' + dr.desc).join(' ')} ${actions.join(' ')}`.toLowerCase()
      });
    }
  },

  open() {
    this.overlay.classList.add('open');
    this.input.value = '';
    this.filter();
    setTimeout(() => this.input.focus(), 50);
  },

  close() {
    this.overlay.classList.remove('open');
  },

  filter() {
    const q = (this.input.value || '').toLowerCase().trim();
    const matches = q ? this.entries.filter(e => e.searchText.includes(q)) : this.entries;
    this.renderResults(matches);
  },

  renderResults(entries) {
    if (!entries.length) {
      this.results.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:12px">No matching capabilities</div>';
      return;
    }

    let html = '';
    for (const e of entries) {
      html += '<div class="palette-item" data-skill="' + NO.detail.esc(e.name) + '">';
      html += '<div class="palette-icon">' + e.icon + '</div>';
      html += '<div class="palette-body">';
      html += '<div class="palette-name" style="color:' + e.color + '">' + NO.detail.esc(e.name) + ' <span style="font-weight:400;font-size:11px;color:var(--text-dim)">(' + NO.detail.esc(e.domain) + ')</span></div>';
      html += '<div class="palette-when">' + NO.detail.esc(e.useWhen) + '</div>';

      if (e.directors.length) {
        html += '<div class="palette-routes">';
        for (const dr of e.directors) {
          html += '<span class="palette-route" style="color:' + e.color + ';border-color:' + e.color + '40" title="' + NO.detail.esc(dr.desc) + '">' + NO.detail.esc(dr.name) + '</span>';
        }
        html += '</div>';
      }

      html += '</div></div>';
    }

    this.results.innerHTML = html;

    this.results.querySelectorAll('.palette-item').forEach(el => {
      el.onclick = () => {
        this.close();
        NO.detail.open(el.dataset.skill);
      };
    });
  }
};

/* ─── Chord Diagram (Cross-Domain Bridges) ─── */
NO.chord = {
  render() {
    const svg = d3.select('#chord-svg');
    const container = document.getElementById('chord-panel');
    if (!container) return;
    const size = Math.min(container.clientWidth - 32, 280);
    const outerRadius = size / 2 - 10;
    const innerRadius = outerRadius - 16;
    svg.attr('viewBox', `0 0 ${size} ${size}`);
    svg.selectAll('*').remove();

    const data = NO.data;
    const domainOrder = data.domainOrder.filter(d => {
      // Only include domains that have cross-domain edges
      return data.skillList.some(s => {
        const sd = data.skillDomain[s.name];
        if (sd !== d) return false;
        for (const dep of (s.depends_on || [])) {
          if (data.skillDomain[dep] && data.skillDomain[dep] !== d) return true;
        }
        return false;
      }) || data.skillList.some(s => {
        const sd = data.skillDomain[s.name];
        if (sd === d) return false;
        for (const dep of (s.depends_on || [])) {
          if (data.skillDomain[dep] === d) return true;
        }
        return false;
      });
    });

    if (domainOrder.length < 2) {
      svg.append('text').attr('x', size/2).attr('y', size/2)
        .attr('text-anchor', 'middle').attr('fill', 'var(--text-dim)')
        .attr('font-family', 'var(--font-mono)').attr('font-size', '11')
        .text('No cross-domain edges');
      return;
    }

    // Build adjacency matrix
    const n = domainOrder.length;
    const matrix = Array.from({ length: n }, () => Array(n).fill(0));
    const domainIdx = new Map(domainOrder.map((d, i) => [d, i]));

    for (const s of data.skillList) {
      const sd = data.skillDomain[s.name];
      const si = domainIdx.get(sd);
      if (si === undefined) continue;
      for (const dep of (s.depends_on || [])) {
        const td = data.skillDomain[dep];
        const ti = domainIdx.get(td);
        if (ti !== undefined && si !== ti) {
          matrix[si][ti]++;
          matrix[ti][si]++;
        }
      }
    }

    const g = svg.append('g').attr('transform', `translate(${size/2},${size/2})`);

    const chord = d3.chord().padAngle(0.06).sortSubgroups(d3.descending);
    const chords = chord(matrix);

    const arc = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);
    const ribbon = d3.ribbon().radius(innerRadius);

    // Arcs
    g.selectAll('.chord-arc')
      .data(chords.groups)
      .join('path')
      .attr('class', 'chord-arc')
      .attr('d', arc)
      .attr('fill', d => NO.config.domainColors[domainOrder[d.index]] || '#888')
      .attr('stroke', 'var(--bg-deep)')
      .attr('stroke-width', 1)
      .on('mouseover', (e, d) => {
        const domain = domainOrder[d.index];
        g.selectAll('.chord-ribbon').style('opacity', r =>
          r.source.index === d.index || r.target.index === d.index ? 0.7 : 0.05);
        NO.tooltip.show(e, `<div class="tt-name" style="color:${NO.config.domainColors[domain]}">${domain}</div>`);
      })
      .on('mouseout', () => {
        g.selectAll('.chord-ribbon').style('opacity', 0.5);
        NO.tooltip.hide();
      });

    // Labels
    g.selectAll('.chord-label')
      .data(chords.groups)
      .join('text')
      .attr('class', 'chord-label')
      .each(function(d) {
        const angle = (d.startAngle + d.endAngle) / 2;
        const flip = angle > Math.PI;
        d3.select(this)
          .attr('transform', `rotate(${angle * 180 / Math.PI - 90}) translate(${outerRadius + 6}) ${flip ? 'rotate(180)' : ''}`)
          .attr('text-anchor', flip ? 'end' : 'start')
          .attr('fill', NO.config.domainColors[domainOrder[d.index]] || '#888');
      })
      .text(d => {
        const name = domainOrder[d.index];
        return name.length > 10 ? name.substring(0, 8) + '..' : name;
      });

    // Ribbons
    g.selectAll('.chord-ribbon')
      .data(chords)
      .join('path')
      .attr('class', 'chord-ribbon')
      .attr('d', ribbon)
      .attr('fill', d => NO.config.domainColors[domainOrder[d.source.index]] || '#888')
      .attr('opacity', 0.5)
      .on('mouseover', (e, d) => {
        const src = domainOrder[d.source.index], tgt = domainOrder[d.target.index];
        const count = matrix[d.source.index][d.target.index];
        NO.tooltip.show(e, `<div class="tt-name">${src} \u2194 ${tgt}</div><div class="tt-dim">${count} shared edges</div>`);
      })
      .on('mouseout', () => NO.tooltip.hide());
  }
};

  } catch (e) {
    document.querySelector('.no-grid').innerHTML =
      `<div class="no-panel" style="grid-column:1/-1;text-align:center;padding:60px">
        <div style="font-family:var(--font-display);color:var(--red-bright);margin-bottom:8px">DATA LOAD ERROR</div>
        <div style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim)">${e.message}</div>
        <div style="margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">
          Check Firebase config or run: firebase emulators:start
        </div>
      </div>`;
    return;
  }

  // Header stats
  document.getElementById('stat-skills').textContent = NO.data.skillList.length;
  document.getElementById('stat-domains').textContent = NO.data.domainOrder.length;
  document.getElementById('stat-edges').textContent = NO.data.totalEdges;
  document.getElementById('stat-cross').textContent = NO.data.crossDomainEdges;

  // Init modules
  NO.theme.init();
  NO.detail.init();
  NO.vitals.render();
  NO.cortex.init();
  // Org chart is lazy-initialized on first view switch
  NO.timeline.render();
  NO.signals.render();
  NO.heatmap.render();
  NO.depth.render();
  NO.table.init();
  NO.palette.init();
  NO.chord.render();

  // Coverage toggle
  document.getElementById('btn-coverage').onclick = () => NO.coverage.toggle();

  // View toggle (cortex ↔ org chart)
  let currentView = 'cortex';
  let orgInitialized = false;
  const cortexSvg = document.getElementById('cortex-svg');
  const orgSvg = document.getElementById('org-svg');
  const viewTitle = document.getElementById('view-title');

  document.querySelectorAll('.view-tab').forEach(tab => {
    tab.onclick = () => {
      const view = tab.dataset.view;
      if (view === currentView) return;
      currentView = view;

      document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      if (view === 'cortex') {
        cortexSvg.style.display = 'block';
        orgSvg.style.display = 'none';
        viewTitle.textContent = 'Cortex Map';
        // Show cortex-specific buttons
        document.getElementById('btn-trail').style.display = '';
        document.getElementById('btn-labels').style.display = '';
      } else {
        cortexSvg.style.display = 'none';
        orgSvg.style.display = 'block';
        viewTitle.textContent = 'Org Chart';
        // Hide cortex-specific buttons
        document.getElementById('btn-trail').style.display = 'none';
        document.getElementById('btn-labels').style.display = 'none';
        // Lazy init
        if (!orgInitialized) {
          NO.org.init();
          orgInitialized = true;
        }
      }
    };
  });

  // Wire buttons
  document.getElementById('btn-trail').onclick = () => {
    NO.cortex.toggleTrail();
    document.getElementById('btn-trail').classList.toggle('active');
  };
  document.getElementById('btn-labels').onclick = () => {
    NO.cortex.toggleLabels();
    document.getElementById('btn-labels').classList.toggle('active');
  };

  // Shared refresh function — reloads all data and re-renders every panel
  const refreshBtn = document.getElementById('btn-refresh');
  const refreshStatus = document.getElementById('refresh-status');

  NO.refresh = async function(silent) {
    if (NO._refreshing) return;
    NO._refreshing = true;
    refreshBtn.classList.add('refreshing');
    if (!silent) { refreshStatus.textContent = 'loading...'; refreshStatus.classList.add('show'); }

    try {
      const oldCount = NO.data.skillList.length;
      await NO.data.loadAll();
      const newCount = NO.data.skillList.length;
      const delta = newCount - oldCount;

      // Re-render all panels
      document.getElementById('stat-skills').textContent = newCount;
      document.getElementById('stat-domains').textContent = NO.data.domainOrder.length;
      document.getElementById('stat-edges').textContent = NO.data.totalEdges;
      document.getElementById('stat-cross').textContent = NO.data.crossDomainEdges;
      NO.vitals.render();
      NO.signals.render();
      NO.heatmap.render();
      NO.depth.render();
      NO.table.render();
      NO.timeline.render();

      // Status feedback
      const msg = delta > 0 ? `+${delta} new skills` : delta < 0 ? `${delta} skills` : 'up to date';
      refreshStatus.textContent = msg;
      refreshStatus.classList.add('show');
      setTimeout(() => refreshStatus.classList.remove('show'), 3000);
    } catch (e) {
      refreshStatus.textContent = 'refresh failed';
      refreshStatus.classList.add('show');
      setTimeout(() => refreshStatus.classList.remove('show'), 3000);
    } finally {
      NO._refreshing = false;
      refreshBtn.classList.remove('refreshing');
    }
  };

  // Manual refresh button
  refreshBtn.onclick = () => NO.refresh(false);

  // Real-time listener — replaces 30s polling
  NO.data._db.collection('skills').onSnapshot((snapshot) => {
    const newCount = snapshot.size;
    if (newCount !== NO.data.skillList.length) {
      NO.refresh(true).then(() => {
        refreshStatus.textContent = 'live update';
        refreshStatus.classList.add('show');
        setTimeout(() => refreshStatus.classList.remove('show'), 3000);
      });
    }
  });

})();
</script>
</body>
</html>
