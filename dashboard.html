<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Observatory // Skill Library</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   WEATHERED CYBERPUNK THEME
   ═══════════════════════════════════════════════ */
:root {
  --font-mono: 'Share Tech Mono', monospace;
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
  --radius: 4px;
  --ease: cubic-bezier(0.0, 0.0, 0.2, 1);
}

[data-theme="dark"] {
  --bg-deep: #06070d;
  --bg-panel: #0b0d18;
  --bg-panel-hover: #10132a;
  --border-dim: #1a1d3a;
  --border-glow: #2a3a6a;
  --cyan-faded: #3a8a8a;
  --cyan-bright: #5acece;
  --cyan-glow: #3acece44;
  --magenta-faded: #8a3a6a;
  --magenta-bright: #ce5aaa;
  --magenta-glow: #ce3aaa33;
  --amber-faded: #8a7a3a;
  --amber-bright: #ceb45a;
  --amber-glow: #ceb43a33;
  --red-faded: #8a3a3a;
  --red-bright: #ce5a5a;
  --green-faded: #3a8a4a;
  --green-bright: #5ace6a;
  --text-primary: #a0aab8;
  --text-dim: #5a6478;
  --text-bright: #d0dae8;
  --scanline-opacity: 0.03;
  --header-gradient-start: #0d1020;
  --crt-vignette: rgba(0,0,0,0.4);
  --noise-opacity: 0.04;
}

[data-theme="light"] {
  --bg-deep: #e8ecf2;
  --bg-panel: #f0f3f8;
  --bg-panel-hover: #dce2ec;
  --border-dim: #c0c8d8;
  --border-glow: #8898b8;
  --cyan-faded: #1a7070;
  --cyan-bright: #0e8a8a;
  --cyan-glow: #0e8a8a22;
  --magenta-faded: #8a2a5a;
  --magenta-bright: #a83880;
  --magenta-glow: #a8388022;
  --amber-faded: #7a6a20;
  --amber-bright: #9a8420;
  --amber-glow: #9a842022;
  --red-faded: #983030;
  --red-bright: #c04040;
  --green-faded: #1a7830;
  --green-bright: #208a38;
  --text-primary: #3a4050;
  --text-dim: #6a7488;
  --text-bright: #1a2030;
  --scanline-opacity: 0.015;
  --header-gradient-start: #d8dfe8;
  --crt-vignette: rgba(0,0,0,0.06);
  --noise-opacity: 0.02;
}

/* Domain colors */
:root {
  --d-investing: #5acece;
  --d-sommelier: #ce5aaa;
  --d-writing: #ceb45a;
  --d-worldbuilding: #5ace6a;
  --d-game-theory: #ce5a5a;
  --d-design: #8a7ace;
  --d-data-science: #5a9ace;
  --d-infrastructure: #8ace5a;
  --d-research: #ce8a5a;
  --d-artifacts: #5acea0;
  --d-meta: #9a9aaa;
  --d-philosophy: #ce7a8a;
  --d-neocortex: #aa5ace;
}

/* ═══════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* CRT scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px,
    rgba(0,0,0,var(--scanline-opacity)) 2px, rgba(0,0,0,var(--scanline-opacity)) 4px);
}

/* Noise texture on panels */
.no-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: var(--noise-opacity);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
  border-radius: var(--radius);
}

::selection { background: var(--cyan-glow); }

/* ═══════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════ */
.no-header {
  background: linear-gradient(135deg, var(--header-gradient-start), var(--bg-deep));
  border-bottom: 1px solid var(--border-dim);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.no-logo {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--cyan-bright);
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: logo-flicker 4s ease-in-out infinite;
}
.no-logo span { color: var(--magenta-bright); }

@keyframes logo-flicker {
  0%, 95%, 100% { opacity: 1; }
  96% { opacity: 0.8; }
  97% { opacity: 1; }
  98% { opacity: 0.7; }
}

.no-stats-bar {
  display: flex;
  gap: 20px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
}
.no-stats-bar .stat-val { color: var(--cyan-bright); }
.no-stats-bar .stat-label { margin-left: 4px; }

.no-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.no-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 12px;
  border: 1px solid var(--border-dim);
  background: var(--bg-panel);
  color: var(--text-dim);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.no-btn:hover { border-color: var(--cyan-faded); color: var(--cyan-bright); }
.no-btn.active { border-color: var(--cyan-bright); color: var(--cyan-bright); background: var(--cyan-glow); }
.no-btn.refreshing { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.refresh-status {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-right: 8px;
  opacity: 0;
  transition: opacity 0.3s;
}
.refresh-status.show { opacity: 1; }

/* ═══════════════════════════════════════════════
   GRID LAYOUT
   ═══════════════════════════════════════════════ */
.no-grid {
  display: grid;
  grid-template-columns: 1fr 320px;
  grid-template-rows: auto 1fr;
  gap: 1px;
  background: var(--border-dim);
  min-height: calc(100vh - 56px);
}

.no-panel {
  position: relative;
  background: var(--bg-panel);
  padding: 16px;
  overflow: hidden;
}

.no-panel-title {
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.no-panel-title::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan-bright);
  box-shadow: 0 0 6px var(--cyan-glow);
}

/* ═══════════════════════════════════════════════
   DOMAIN VITALS STRIP
   ═══════════════════════════════════════════════ */
.vitals-strip {
  grid-column: 1 / -1;
  display: flex;
  gap: 1px;
  background: var(--border-dim);
  overflow-x: auto;
}

.vital-card {
  flex: 1;
  min-width: 90px;
  background: var(--bg-panel);
  padding: 10px 12px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  position: relative;
}
.vital-card:hover { background: var(--bg-panel-hover); }
.vital-card.active { box-shadow: inset 0 -2px 0 var(--cyan-bright); }

.vital-domain {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.vital-count {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
}

.vital-bar {
  height: 3px;
  background: var(--border-dim);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}
.vital-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s var(--ease);
}

/* ═══════════════════════════════════════════════
   CORTEX MAP
   ═══════════════════════════════════════════════ */
#cortex-panel { min-height: 500px; }

#cortex-svg {
  width: 100%;
  height: 100%;
  cursor: grab;
}
#cortex-svg:active { cursor: grabbing; }

.cortex-link { stroke: var(--border-dim); stroke-opacity: 0.3; fill: none; }
.cortex-link.cross-domain {
  stroke-dasharray: 4 3;
  stroke-opacity: 0.5;
  animation: flow 2s linear infinite;
}
@keyframes flow { to { stroke-dashoffset: -14; } }

.cortex-node { cursor: pointer; transition: r 0.15s var(--ease); }
.cortex-node:hover { filter: brightness(1.3); }

.cortex-label {
  font-family: var(--font-mono);
  font-size: 8px;
  fill: var(--text-dim);
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: central;
}

.learning-trail {
  fill: none;
  stroke: var(--amber-bright);
  stroke-width: 2;
  stroke-opacity: 0.5;
  stroke-dasharray: 6 4;
  animation: flow 3s linear infinite;
}

/* ═══════════════════════════════════════════════
   SIDEBAR PANELS
   ═══════════════════════════════════════════════ */
.sidebar-stack {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border-dim);
}

/* Signals feed */
.signal-item {
  padding: 8px 12px;
  border-left: 3px solid var(--border-dim);
  font-size: 12px;
  font-family: var(--font-mono);
  transition: background 0.15s var(--ease);
}
.signal-item:hover { background: var(--bg-panel-hover); }
.signal-item.sig-usage { border-left-color: var(--cyan-faded); }
.signal-item.sig-gap { border-left-color: var(--red-faded); }
.signal-item.sig-change { border-left-color: var(--amber-faded); }
.signal-time {
  font-size: 10px;
  color: var(--text-dim);
  display: block;
  margin-top: 2px;
}

/* Heatmap */
.heatmap-grid {
  display: grid;
  gap: 2px;
  grid-template-columns: 70px repeat(7, 1fr);
}
.heatmap-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  padding-right: 4px;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 2px;
  background: var(--bg-deep);
  transition: background 0.2s var(--ease);
  min-height: 12px;
}

/* ═══════════════════════════════════════════════
   BOTTOM PANELS (Timeline + Table)
   ═══════════════════════════════════════════════ */
.bottom-panels {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border-dim);
}

#timeline-svg {
  width: 100%;
  height: 200px;
}

/* Skill table */
.skill-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 11px;
}
.skill-table th {
  text-align: left;
  padding: 6px 8px;
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-dim);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.skill-table th:hover { color: var(--cyan-bright); }
.skill-table th.sorted { color: var(--cyan-bright); }
.skill-table th.sorted::after { content: ' \u25BE'; }
.skill-table th.sorted.asc::after { content: ' \u25B4'; }

.skill-table td {
  padding: 5px 8px;
  border-bottom: 1px solid var(--border-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}
.skill-table tr { transition: background 0.1s; cursor: pointer; }
.skill-table tr:hover { background: var(--bg-panel-hover); }

.health-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 4px;
}
.health-dot.healthy { background: var(--green-bright); }
.health-dot.warning { background: var(--amber-bright); }
.health-dot.critical { background: var(--red-bright); animation: pulse-dot 2s ease infinite; }

@keyframes pulse-dot {
  0%, 100% { box-shadow: none; }
  50% { box-shadow: 0 0 6px var(--red-bright); }
}

.score-bar {
  height: 4px;
  background: var(--border-dim);
  border-radius: 2px;
  width: 50px;
  display: inline-block;
  vertical-align: middle;
  margin-left: 6px;
}
.score-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--cyan-faded);
  transition: width 0.4s var(--ease);
}

.domain-tag {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 2px;
  border: 1px solid;
  opacity: 0.8;
}

.table-wrap {
  max-height: 300px;
  overflow-y: auto;
}
.table-wrap::-webkit-scrollbar { width: 4px; }
.table-wrap::-webkit-scrollbar-track { background: var(--bg-deep); }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 2px; }

/* ═══════════════════════════════════════════════
   DETAIL INSPECTOR
   ═══════════════════════════════════════════════ */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s var(--ease);
}
.detail-overlay.open { opacity: 1; pointer-events: all; }

.detail-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 420px;
  height: 100vh;
  background: var(--bg-panel);
  border-left: 1px solid var(--border-glow);
  z-index: 201;
  transform: translateX(100%);
  transition: transform 0.3s var(--ease);
  overflow-y: auto;
  padding: 20px;
}
.detail-panel.open { transform: translateX(0); }

.detail-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: 1px solid var(--border-dim);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 14px;
  width: 28px;
  height: 28px;
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-close:hover { border-color: var(--red-faded); color: var(--red-bright); }

.detail-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 4px;
}
.detail-desc {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 16px;
  line-height: 1.4;
}

.detail-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.detail-meta-item {
  background: var(--bg-deep);
  padding: 8px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border-dim);
}
.detail-meta-label {
  font-family: var(--font-display);
  font-size: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
}
.detail-meta-val {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-bright);
  margin-top: 2px;
}

/* Radar chart */
.radar-wrap { text-align: center; margin: 16px 0; }
.radar-label {
  font-family: var(--font-mono);
  font-size: 9px;
  fill: var(--text-dim);
}
.radar-polygon {
  fill: var(--cyan-glow);
  stroke: var(--cyan-bright);
  stroke-width: 1.5;
}
.radar-grid { stroke: var(--border-dim); fill: none; }

.detail-deps {
  margin-top: 16px;
}
.detail-deps h4 {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.dep-chip {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 8px;
  border: 1px solid var(--border-dim);
  border-radius: 2px;
  margin: 2px;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s;
}
.dep-chip:hover { border-color: var(--cyan-faded); color: var(--cyan-bright); }

/* ═══════════════════════════════════════════════
   TOOLTIP
   ═══════════════════════════════════════════════ */
.no-tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--bg-panel);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-primary);
  z-index: 300;
  max-width: 260px;
  opacity: 0;
  transition: opacity 0.12s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.no-tooltip.show { opacity: 1; }
.no-tooltip .tt-name { color: var(--text-bright); font-weight: 700; }
.no-tooltip .tt-dim { color: var(--text-dim); }

/* ═══════════════════════════════════════════════
   RESPONSIVE & REDUCED MOTION
   ═══════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
@media (max-width: 900px) {
  .no-grid { grid-template-columns: 1fr; }
  .bottom-panels { grid-template-columns: 1fr; }
  .detail-panel { width: 100%; }
}
</style>
</head>
<body>

<!-- Tooltip -->
<div class="no-tooltip" id="tooltip"></div>

<!-- Detail Inspector -->
<div class="detail-overlay" id="detail-overlay"></div>
<div class="detail-panel" id="detail-panel">
  <button class="detail-close" id="detail-close">&times;</button>
  <div id="detail-content"></div>
</div>

<!-- Header -->
<header class="no-header">
  <div class="no-logo">NEURAL <span>OBSERVATORY</span></div>
  <div class="no-stats-bar">
    <div><span class="stat-val" id="stat-skills">-</span><span class="stat-label">skills</span></div>
    <div><span class="stat-val" id="stat-domains">-</span><span class="stat-label">domains</span></div>
    <div><span class="stat-val" id="stat-edges">-</span><span class="stat-label">edges</span></div>
    <div><span class="stat-val" id="stat-cross">-</span><span class="stat-label">bridges</span></div>
  </div>
  <div class="no-controls">
    <span class="refresh-status" id="refresh-status"></span>
    <button class="no-btn" id="btn-refresh" title="Reload all data">&#x21bb; refresh</button>
    <button class="no-btn" id="btn-trail" title="Toggle learning trail">trail</button>
    <button class="no-btn" id="btn-labels" title="Toggle labels">labels</button>
    <button class="no-btn" id="btn-theme" title="Toggle theme">light</button>
  </div>
</header>

<!-- Main Grid -->
<div class="no-grid">
  <!-- Domain Vitals Strip -->
  <div class="vitals-strip" id="vitals-strip"></div>

  <!-- Cortex Map -->
  <div class="no-panel" id="cortex-panel">
    <div class="no-panel-title">Cortex Map</div>
    <svg id="cortex-svg"></svg>
  </div>

  <!-- Sidebar Stack -->
  <div class="sidebar-stack">
    <div class="no-panel" id="signals-panel" style="max-height:260px;overflow-y:auto">
      <div class="no-panel-title">Signals Feed</div>
      <div id="signals-feed"></div>
    </div>
    <div class="no-panel" id="heatmap-panel">
      <div class="no-panel-title">Fluency Heatmap</div>
      <div id="heatmap-grid" class="heatmap-grid"></div>
    </div>
    <div class="no-panel" id="depth-panel">
      <div class="no-panel-title">Domain Depth</div>
      <div id="depth-bars"></div>
    </div>
  </div>

  <!-- Bottom Panels -->
  <div class="bottom-panels">
    <div class="no-panel" id="timeline-panel">
      <div class="no-panel-title">Growth Timeline</div>
      <svg id="timeline-svg"></svg>
    </div>
    <div class="no-panel" id="table-panel">
      <div class="no-panel-title">Skill Registry</div>
      <input type="text" id="table-search" placeholder="filter skills..."
        style="width:100%;margin-bottom:8px;padding:5px 8px;background:var(--bg-deep);border:1px solid var(--border-dim);border-radius:var(--radius);color:var(--text-primary);font-family:var(--font-mono);font-size:11px;outline:none">
      <div class="table-wrap" id="table-wrap">
        <table class="skill-table" id="skill-table">
          <thead><tr>
            <th data-col="name" class="sorted">Name</th>
            <th data-col="domain">Domain</th>
            <th data-col="type">Type</th>
            <th data-col="score">Score</th>
            <th data-col="words">Words</th>
            <th data-col="connections">Edges</th>
          </tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   NEURAL OBSERVATORY — Modular Namespace
   ═══════════════════════════════════════════════ */
const NO = {};

/* ─── Config ─── */
NO.config = {
  refreshInterval: 30000,
  files: {
    registry: './data/registry.json',
    usage: './data/usage.jsonl',
    gaps: './data/gaps.jsonl',
    evolution: './data/evolution.jsonl',
    changelogs: './data/changelogs.json',
  },
  domainColors: {
    investing: '#5acece', sommelier: '#ce5aaa', writing: '#ceb45a',
    worldbuilding: '#5ace6a', 'game-theory': '#ce5a5a', design: '#8a7ace',
    'data-science': '#5a9ace', infrastructure: '#8ace5a', research: '#ce8a5a',
    artifacts: '#5acea0', meta: '#9a9aaa', philosophy: '#ce7a8a', neocortex: '#aa5ace'
  },
  typeRadius: { orchestrator: 9, director: 7, action: 6, knowledge: 5, observer: 5 },
  typeShape: { orchestrator: 'diamond', director: 'square', action: 'circle', knowledge: 'circle', observer: 'triangle' },
};

/* ─── Data Module ─── */
NO.data = {
  registry: null, skills: null, skillList: [],
  usage: [], gaps: [], evolution: [], changelogs: {},
  domains: {}, skillDomain: {}, domainOrder: [],

  async loadAll() {
    const [regRes, usageRes, gapsRes, evoRes, clRes] = await Promise.all([
      fetch(NO.config.files.registry).then(r => r.json()),
      fetch(NO.config.files.usage).then(r => r.text()).catch(() => ''),
      fetch(NO.config.files.gaps).then(r => r.text()).catch(() => ''),
      fetch(NO.config.files.evolution).then(r => r.text()).catch(() => ''),
      fetch(NO.config.files.changelogs).then(r => r.json()).catch(() => ({})),
    ]);

    this.registry = regRes;
    this.skills = regRes.skills;
    this.skillList = Object.values(regRes.skills);
    this.domains = regRes.network?.domains || {};
    this.changelogs = clRes;
    this.usage = this.parseJSONL(usageRes);
    this.gaps = this.parseJSONL(gapsRes);
    this.evolution = this.parseJSONL(evoRes);

    // Build skill→domain mapping
    this.skillDomain = {};
    for (const [d, skills] of Object.entries(this.domains)) {
      for (const s of skills) this.skillDomain[s] = d;
    }

    // Domain order by size
    this.domainOrder = Object.entries(this.domains)
      .sort((a, b) => b[1].length - a[1].length)
      .map(d => d[0]);

    this.computeDerived();
  },

  parseJSONL(text) {
    if (!text) return [];
    return text.trim().split('\n').filter(Boolean).map(line => {
      try { return JSON.parse(line); } catch { return null; }
    }).filter(Boolean);
  },

  computeDerived() {
    // Count cross-domain edges
    let crossCount = 0;
    let totalEdges = 0;
    for (const entry of this.skillList) {
      const d = this.skillDomain[entry.name] || '';
      for (const dep of (entry.depends_on || [])) {
        totalEdges++;
        if (this.skillDomain[dep] && this.skillDomain[dep] !== d) crossCount++;
      }
      for (const ref of (entry.referenced_by || [])) {
        totalEdges++;
        if (this.skillDomain[ref] && this.skillDomain[ref] !== d) crossCount++;
      }
    }
    this.totalEdges = totalEdges;
    this.crossDomainEdges = crossCount;

    // Usage counts
    this.usageCounts = {};
    for (const e of this.usage) {
      this.usageCounts[e.skill] = (this.usageCounts[e.skill] || 0) + 1;
    }

    // Heatmap: domain × day
    this.heatmapData = {};
    for (const e of this.usage) {
      const d = this.skillDomain[e.skill];
      if (!d) continue;
      const day = e.timestamp?.substring(0, 10);
      if (!day) continue;
      const key = `${d}|${day}`;
      this.heatmapData[key] = (this.heatmapData[key] || 0) + 1;
    }
  }
};

/* ─── Tooltip ─── */
NO.tooltip = {
  el: document.getElementById('tooltip'),
  show(evt, html) {
    this.el.innerHTML = html;
    this.el.classList.add('show');
    const x = Math.min(evt.clientX + 12, window.innerWidth - 280);
    const y = Math.min(evt.clientY + 12, window.innerHeight - 100);
    this.el.style.left = x + 'px';
    this.el.style.top = y + 'px';
  },
  hide() { this.el.classList.remove('show'); }
};

/* ─── Detail Inspector ─── */
NO.detail = {
  overlay: document.getElementById('detail-overlay'),
  panel: document.getElementById('detail-panel'),
  content: document.getElementById('detail-content'),

  init() {
    document.getElementById('detail-close').onclick = () => this.close();
    this.overlay.onclick = () => this.close();
  },

  open(name) {
    const s = NO.data.skills[name];
    if (!s) return;
    const m = s.metrics || {};
    const domain = NO.data.skillDomain[name] || 'unknown';
    const color = NO.config.domainColors[domain] || '#888';
    const used = NO.data.usageCounts[name] || 0;

    // Radar data
    const radarAxes = [
      { label: 'Structure', val: this.estStructure(m) },
      { label: 'Depth', val: this.estDepth(m) },
      { label: 'Connect', val: Math.min(100, ((s.depends_on?.length || 0) + (s.referenced_by?.length || 0)) * 10) },
      { label: 'Fresh', val: this.estFreshness(s) },
      { label: 'Usage', val: Math.min(100, used * 15) },
      { label: 'Refs', val: Math.min(100, (m.reference_files || 0) * 25) },
    ];

    let html = `<div class="detail-name" style="color:${this.esc(color)}">${this.esc(name)}</div>`;
    html += `<div class="detail-desc">${this.esc(s.description || '')}</div>`;
    html += `<div class="detail-meta-grid">`;
    html += this.metaItem('Domain', domain);
    html += this.metaItem('Type', s.type || '?');
    html += this.metaItem('Score', s.composite_score || 0);
    html += this.metaItem('Health', s.health_status || '?');
    html += this.metaItem('Words', (m.body_words || 0).toLocaleString());
    html += this.metaItem('Tokens', (m.estimated_tokens_total || 0).toLocaleString());
    html += this.metaItem('Refs', m.reference_files || 0);
    html += this.metaItem('Used', used + 'x');
    html += `</div>`;

    // Radar SVG
    html += `<div class="radar-wrap">${this.renderRadar(radarAxes)}</div>`;

    // Dependencies
    if (s.depends_on?.length) {
      html += `<div class="detail-deps"><h4>Depends On</h4>`;
      for (const dep of s.depends_on) {
        html += `<span class="dep-chip" data-skill="${this.esc(dep)}">${this.esc(dep)}</span>`;
      }
      html += `</div>`;
    }
    if (s.referenced_by?.length) {
      html += `<div class="detail-deps"><h4>Referenced By</h4>`;
      for (const ref of s.referenced_by) {
        html += `<span class="dep-chip" data-skill="${this.esc(ref)}">${this.esc(ref)}</span>`;
      }
      html += `</div>`;
    }

    // Dates
    html += `<div style="margin-top:16px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">`;
    if (s.created) html += `created: ${s.created}<br>`;
    if (s.last_modified) html += `modified: ${s.last_modified}`;
    html += `</div>`;

    this.content.innerHTML = html;
    this.panel.classList.add('open');
    this.overlay.classList.add('open');

    // Wire dep chips
    this.content.querySelectorAll('.dep-chip').forEach(el => {
      el.onclick = () => this.open(el.dataset.skill);
    });
  },

  close() {
    this.panel.classList.remove('open');
    this.overlay.classList.remove('open');
  },

  metaItem(label, val) {
    return `<div class="detail-meta-item"><div class="detail-meta-label">${this.esc(label)}</div><div class="detail-meta-val">${this.esc(String(val))}</div></div>`;
  },

  renderRadar(axes) {
    const size = 160, cx = size/2, cy = size/2, r = 60;
    const n = axes.length;
    let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;

    // Grid rings
    for (const pct of [0.25, 0.5, 0.75, 1.0]) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
        pts.push(`${cx + r * pct * Math.cos(angle)},${cy + r * pct * Math.sin(angle)}`);
      }
      svg += `<polygon points="${pts.join(' ')}" class="radar-grid"/>`;
    }

    // Axes
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const ex = cx + r * Math.cos(angle), ey = cy + r * Math.sin(angle);
      svg += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--border-dim)" stroke-width="0.5"/>`;
      const lx = cx + (r + 14) * Math.cos(angle), ly = cy + (r + 14) * Math.sin(angle);
      svg += `<text x="${lx}" y="${ly}" class="radar-label" text-anchor="middle" dominant-baseline="central">${axes[i].label}</text>`;
    }

    // Data polygon
    const dataPts = [];
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const v = Math.max(0, Math.min(100, axes[i].val)) / 100;
      dataPts.push(`${cx + r * v * Math.cos(angle)},${cy + r * v * Math.sin(angle)}`);
    }
    svg += `<polygon points="${dataPts.join(' ')}" class="radar-polygon"/>`;
    svg += `</svg>`;
    return svg;
  },

  estStructure(m) {
    const sections = Math.min(100, (m.section_count || 0) * 12);
    const refs = Math.min(100, (m.reference_files || 0) * 30);
    return Math.round(sections * 0.6 + refs * 0.4);
  },
  estDepth(m) {
    const w = m.body_words || 0;
    if (w < 100) return 20;
    if (w < 300) return 40;
    if (w > 5000) return Math.max(40, 100 - (w - 5000) / 100);
    return Math.min(100, 40 + (w - 300) * 60 / 4700);
  },
  estFreshness(s) {
    if (!s.last_modified) return 30;
    const days = (Date.now() - new Date(s.last_modified).getTime()) / 86400000;
    return Math.max(0, Math.round(100 - (days / 90) * 100));
  },

  esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
};

/* ─── Vitals Strip ─── */
NO.vitals = {
  activeFilter: null,

  render() {
    const strip = document.getElementById('vitals-strip');
    const maxCount = Math.max(...NO.data.domainOrder.map(d => NO.data.domains[d]?.length || 0));
    let html = '';

    // All domains card
    html += `<div class="vital-card ${this.activeFilter === null ? 'active' : ''}" data-domain="all">`;
    html += `<div class="vital-domain" style="color:var(--text-dim)">ALL</div>`;
    html += `<div class="vital-count">${NO.data.skillList.length}</div>`;
    html += `<div class="vital-bar"><div class="vital-bar-fill" style="width:100%;background:var(--cyan-faded)"></div></div>`;
    html += `</div>`;

    for (const d of NO.data.domainOrder) {
      const skills = NO.data.domains[d] || [];
      const color = NO.config.domainColors[d] || '#888';
      const pct = Math.round((skills.length / maxCount) * 100);
      const active = this.activeFilter === d ? ' active' : '';
      html += `<div class="vital-card${active}" data-domain="${NO.detail.esc(d)}">`;
      html += `<div class="vital-domain" style="color:${color}">${NO.detail.esc(d)}</div>`;
      html += `<div class="vital-count">${skills.length}</div>`;
      html += `<div class="vital-bar"><div class="vital-bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
      html += `</div>`;
    }

    strip.innerHTML = html;
    strip.querySelectorAll('.vital-card').forEach(el => {
      el.onclick = () => {
        const d = el.dataset.domain;
        this.activeFilter = d === 'all' ? null : (this.activeFilter === d ? null : d);
        this.render();
        NO.cortex.filterDomain(this.activeFilter);
        NO.table.render();
      };
    });
  }
};

/* ─── Cortex Map (D3 Force) ─── */
NO.cortex = {
  svg: null, sim: null, nodes: [], links: [],
  showLabels: false, showTrail: false, filteredDomain: null,
  g: null, linkG: null, nodeG: null, labelG: null, trailG: null,

  init() {
    const container = document.getElementById('cortex-panel');
    const svg = d3.select('#cortex-svg');
    this.svg = svg;

    const width = container.clientWidth;
    const height = container.clientHeight - 32;
    svg.attr('viewBox', `0 0 ${width} ${height}`);

    // Build nodes and links
    this.buildGraph(width, height);

    // Glow filter
    const defs = svg.append('defs');
    const glow = defs.append('filter').attr('id', 'glow');
    glow.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
    const merge = glow.append('feMerge');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');

    // Groups
    const g = svg.append('g');
    this.g = g;
    this.trailG = g.append('g').attr('class', 'trail-group');
    this.linkG = g.append('g').attr('class', 'link-group');
    this.nodeG = g.append('g').attr('class', 'node-group');
    this.labelG = g.append('g').attr('class', 'label-group').style('display', 'none');

    // Zoom
    const zoom = d3.zoom()
      .scaleExtent([0.3, 4])
      .on('zoom', (e) => g.attr('transform', e.transform));
    svg.call(zoom);

    // Render
    this.renderLinks();
    this.renderNodes(width, height);
    this.renderLabels();
    this.startSimulation(width, height);
  },

  buildGraph(w, h) {
    const data = NO.data;
    // Domain centers in a circle
    const domainCenters = {};
    const domainList = data.domainOrder;
    domainList.forEach((d, i) => {
      const angle = (2 * Math.PI * i / domainList.length) - Math.PI / 2;
      const radius = Math.min(w, h) * 0.32;
      domainCenters[d] = { x: w/2 + radius * Math.cos(angle), y: h/2 + radius * Math.sin(angle) };
    });
    this.domainCenters = domainCenters;

    // Nodes
    this.nodes = data.skillList.map(s => ({
      id: s.name,
      domain: data.skillDomain[s.name] || 'unknown',
      type: s.type,
      score: s.composite_score || 0,
      health: s.health_status,
      used: (data.usageCounts[s.name] || 0) > 0,
      words: s.metrics?.body_words || 0,
      x: (domainCenters[data.skillDomain[s.name]]?.x || w/2) + (Math.random() - 0.5) * 40,
      y: (domainCenters[data.skillDomain[s.name]]?.y || h/2) + (Math.random() - 0.5) * 40,
    }));

    const nodeMap = new Map(this.nodes.map(n => [n.id, n]));

    // Links (depends_on only to avoid double-counting)
    this.links = [];
    for (const s of data.skillList) {
      for (const dep of (s.depends_on || [])) {
        if (nodeMap.has(dep)) {
          const sd = data.skillDomain[s.name], td = data.skillDomain[dep];
          this.links.push({
            source: s.name, target: dep,
            crossDomain: sd && td && sd !== td
          });
        }
      }
    }
  },

  renderLinks() {
    this.linkG.selectAll('path')
      .data(this.links)
      .join('path')
      .attr('class', d => 'cortex-link' + (d.crossDomain ? ' cross-domain' : ''))
      .attr('stroke', d => d.crossDomain ? 'var(--magenta-faded)' : 'var(--border-dim)')
      .attr('stroke-width', d => d.crossDomain ? 1.5 : 0.5);
  },

  renderNodes(w, h) {
    const self = this;
    const nodeEls = this.nodeG.selectAll('g')
      .data(this.nodes, d => d.id)
      .join('g')
      .attr('class', 'cortex-node-g')
      .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) self.sim.alphaTarget(0.1).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) self.sim.alphaTarget(0); d.fx = null; d.fy = null; })
      );

    nodeEls.each(function(d) {
      const g = d3.select(this);
      g.selectAll('*').remove();
      const r = NO.config.typeRadius[d.type] || 5;
      const color = NO.config.domainColors[d.domain] || '#888';

      if (d.type === 'orchestrator') {
        // Diamond
        const s = r * 1.2;
        g.append('rect')
          .attr('width', s * 2).attr('height', s * 2)
          .attr('x', -s).attr('y', -s)
          .attr('transform', 'rotate(45)')
          .attr('fill', color)
          .attr('opacity', d.used ? 0.9 : 0.4)
          .attr('filter', 'url(#glow)');
      } else if (d.type === 'director') {
        // Square
        const s = r;
        g.append('rect')
          .attr('width', s * 2).attr('height', s * 2)
          .attr('x', -s).attr('y', -s)
          .attr('rx', 2)
          .attr('fill', color)
          .attr('opacity', d.used ? 0.9 : 0.4);
      } else {
        // Circle for knowledge/action/observer
        g.append('circle')
          .attr('r', r)
          .attr('fill', color)
          .attr('opacity', d.used ? 0.85 : 0.35);
      }
    });

    // Hover and click
    nodeEls
      .on('mouseover', (e, d) => {
        const color = NO.config.domainColors[d.domain] || '#888';
        NO.tooltip.show(e, `<div class="tt-name" style="color:${color}">${d.id}</div><div class="tt-dim">${d.domain} / ${d.type}</div><div>Score: ${d.score} | Words: ${d.words.toLocaleString()}</div>`);
      })
      .on('mouseout', () => NO.tooltip.hide())
      .on('click', (e, d) => { e.stopPropagation(); NO.detail.open(d.id); });
  },

  renderLabels() {
    this.labelG.selectAll('text')
      .data(this.nodes, d => d.id)
      .join('text')
      .attr('class', 'cortex-label')
      .text(d => d.id.length > 14 ? d.id.substring(0, 12) + '..' : d.id);
  },

  startSimulation(w, h) {
    const self = this;
    const centers = this.domainCenters;

    function forceCluster(alpha) {
      for (const d of self.nodes) {
        const c = centers[d.domain];
        if (!c) continue;
        d.vx += (c.x - d.x) * 0.12 * alpha;
        d.vy += (c.y - d.y) * 0.12 * alpha;
      }
    }

    this.sim = d3.forceSimulation(this.nodes)
      .force('link', d3.forceLink(this.links).id(d => d.id).distance(35).strength(0.2))
      .force('charge', d3.forceManyBody().strength(-60).distanceMax(180))
      .force('x', d3.forceX(w / 2).strength(0.07))
      .force('y', d3.forceY(h / 2).strength(0.07))
      .force('cluster', forceCluster)
      .force('collide', d3.forceCollide(d => (NO.config.typeRadius[d.type] || 5) + 2))
      .alphaDecay(0.02)
      .on('tick', () => this.tick());
  },

  tick() {
    // Update links
    this.linkG.selectAll('path')
      .attr('d', d => {
        const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
        if (d.crossDomain) {
          const mx = (sx + tx) / 2, my = (sy + ty) / 2 - 30;
          return `M${sx},${sy} Q${mx},${my} ${tx},${ty}`;
        }
        return `M${sx},${sy} L${tx},${ty}`;
      });

    // Update nodes
    this.nodeG.selectAll('.cortex-node-g')
      .attr('transform', d => `translate(${d.x},${d.y})`);

    // Update labels
    this.labelG.selectAll('text')
      .attr('x', d => d.x)
      .attr('y', d => d.y + (NO.config.typeRadius[d.type] || 5) + 10);
  },

  filterDomain(domain) {
    this.filteredDomain = domain;
    this.nodeG.selectAll('.cortex-node-g')
      .transition().duration(200)
      .style('opacity', d => !domain || d.domain === domain ? 1 : 0.1);
    this.linkG.selectAll('path')
      .transition().duration(200)
      .style('opacity', d => {
        if (!domain) return 1;
        const sd = d.source.domain || d.source, td = d.target.domain || d.target;
        return (sd === domain || td === domain) ? 1 : 0.05;
      });
  },

  toggleLabels() {
    this.showLabels = !this.showLabels;
    this.labelG.style('display', this.showLabels ? null : 'none');
  },

  toggleTrail() {
    this.showTrail = !this.showTrail;
    this.trailG.selectAll('*').remove();
    if (!this.showTrail) return;

    // Build learning trail from usage log
    const usageNodes = [];
    const nodeMap = new Map(this.nodes.map(n => [n.id, n]));
    for (const e of NO.data.usage) {
      const n = nodeMap.get(e.skill);
      if (n) usageNodes.push(n);
    }
    if (usageNodes.length < 2) return;

    const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveCatmullRom.alpha(0.5));
    this.trailG.append('path')
      .datum(usageNodes)
      .attr('class', 'learning-trail')
      .attr('d', line);
  }
};

/* ─── Growth Timeline ─── */
NO.timeline = {
  render() {
    const svg = d3.select('#timeline-svg');
    const container = document.getElementById('timeline-panel');
    const width = container.clientWidth - 32;
    const height = 200;
    svg.attr('viewBox', `0 0 ${width} ${height}`);
    svg.selectAll('*').remove();

    // Group evolution data by date and domain
    const evoData = NO.data.evolution;
    if (!evoData.length) {
      svg.append('text').attr('x', width/2).attr('y', height/2)
        .attr('text-anchor', 'middle').attr('fill', 'var(--text-dim)')
        .attr('font-family', 'var(--font-mono)').attr('font-size', '11')
        .text('No evolution data yet — run: python3 scripts/snapshot_evolution.py');
      return;
    }

    // Get unique dates and domains
    const dateSet = new Set();
    const domainScores = {};
    for (const e of evoData) {
      const day = e.date?.substring(0, 10);
      if (!day) continue;
      dateSet.add(day);
      const domain = NO.data.skillDomain[e.skill] || 'unknown';
      if (!domainScores[day]) domainScores[day] = {};
      if (!domainScores[day][domain]) domainScores[day][domain] = [];
      domainScores[day][domain].push(e.composite_score || 0);
    }

    const dates = [...dateSet].sort();
    const domains = NO.data.domainOrder;

    // Build stacked data: average score per domain per date
    const stackData = dates.map(day => {
      const row = { date: day };
      for (const d of domains) {
        const scores = domainScores[day]?.[d] || [];
        row[d] = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
      }
      return row;
    });

    const margin = { top: 10, right: 10, bottom: 30, left: 35 };
    const iw = width - margin.left - margin.right;
    const ih = height - margin.top - margin.bottom;

    const x = d3.scalePoint().domain(dates).range([0, iw]).padding(0.2);
    const stack = d3.stack().keys(domains).order(d3.stackOrderNone).offset(d3.stackOffsetNone);
    const series = stack(stackData);
    const yMax = d3.max(series, s => d3.max(s, d => d[1])) || 100;
    const y = d3.scaleLinear().domain([0, yMax]).range([ih, 0]);

    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    // Area
    const area = d3.area()
      .x(d => x(d.data.date))
      .y0(d => y(d[0]))
      .y1(d => y(d[1]))
      .curve(d3.curveMonotoneX);

    g.selectAll('.area')
      .data(series)
      .join('path')
      .attr('d', area)
      .attr('fill', d => NO.config.domainColors[d.key] || '#888')
      .attr('opacity', 0.6);

    // Axes
    g.append('g')
      .attr('transform', `translate(0,${ih})`)
      .call(d3.axisBottom(x).tickValues(dates.filter((_, i) => i % Math.ceil(dates.length / 6) === 0)))
      .selectAll('text').attr('fill', 'var(--text-dim)').attr('font-size', '9');

    g.append('g')
      .call(d3.axisLeft(y).ticks(4))
      .selectAll('text').attr('fill', 'var(--text-dim)').attr('font-size', '9');

    g.selectAll('.domain').attr('stroke', 'var(--border-dim)');
    g.selectAll('.tick line').attr('stroke', 'var(--border-dim)');
  }
};

/* ─── Signals Feed ─── */
NO.signals = {
  render() {
    const feed = document.getElementById('signals-feed');
    const events = [];

    // Usage events
    for (const e of NO.data.usage.slice(-30)) {
      events.push({ type: 'usage', skill: e.skill, text: `Used ${e.skill}`, time: e.timestamp, stype: e.type });
    }

    // Gap events
    for (const e of NO.data.gaps) {
      events.push({ type: 'gap', text: `Gap: "${e.query}"`, time: e.timestamp });
    }

    // Sort by time desc
    events.sort((a, b) => (b.time || '').localeCompare(a.time || ''));

    let html = '';
    for (const e of events.slice(0, 25)) {
      const cls = e.type === 'usage' ? 'sig-usage' : e.type === 'gap' ? 'sig-gap' : 'sig-change';
      const timeStr = e.time ? new Date(e.time).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      html += `<div class="signal-item ${cls}">`;
      html += NO.detail.esc(e.text);
      html += `<span class="signal-time">${NO.detail.esc(timeStr)}</span>`;
      html += `</div>`;
    }

    feed.innerHTML = html || '<div style="padding:8px;color:var(--text-dim);font-size:11px">No signals yet</div>';
  }
};

/* ─── Fluency Heatmap ─── */
NO.heatmap = {
  render() {
    const grid = document.getElementById('heatmap-grid');
    const domains = NO.data.domainOrder.slice(0, 8); // Top 8 for space
    const hm = NO.data.heatmapData;

    // Get last 7 unique days from usage
    const allDays = new Set();
    for (const e of NO.data.usage) {
      const d = e.timestamp?.substring(0, 10);
      if (d) allDays.add(d);
    }
    const days = [...allDays].sort().slice(-7);
    if (!days.length) {
      grid.innerHTML = '<div style="color:var(--text-dim);font-size:11px;padding:4px">No usage data</div>';
      return;
    }

    // Find max for scaling
    let maxVal = 1;
    for (const v of Object.values(hm)) if (v > maxVal) maxVal = v;

    // Column count: label + days
    grid.style.gridTemplateColumns = `70px repeat(${days.length}, 1fr)`;

    let html = '<div></div>'; // empty corner
    for (const day of days) {
      html += `<div class="heatmap-label" style="justify-content:center;font-size:8px">${day.substring(5)}</div>`;
    }

    for (const d of domains) {
      const color = NO.config.domainColors[d] || '#888';
      html += `<div class="heatmap-label" style="color:${color}">${d.substring(0, 8)}</div>`;
      for (const day of days) {
        const val = hm[`${d}|${day}`] || 0;
        const intensity = val / maxVal;
        const bg = val === 0 ? 'var(--bg-deep)' : `color-mix(in srgb, ${color} ${Math.round(intensity * 80 + 20)}%, var(--bg-deep))`;
        html += `<div class="heatmap-cell" style="background:${bg}" title="${d}: ${val} on ${day}"></div>`;
      }
    }

    grid.innerHTML = html;
  }
};

/* ─── Domain Depth Bars ─── */
NO.depth = {
  render() {
    const container = document.getElementById('depth-bars');
    const domains = NO.data.domainOrder.slice(0, 8);

    let html = '';
    for (const d of domains) {
      const skills = NO.data.domains[d] || [];
      const color = NO.config.domainColors[d] || '#888';
      const typeCounts = { orchestrator: 0, director: 0, knowledge: 0, action: 0, observer: 0 };
      for (const sName of skills) {
        const s = NO.data.skills[sName];
        if (s) typeCounts[s.type] = (typeCounts[s.type] || 0) + 1;
      }
      const total = skills.length || 1;

      html += `<div style="margin-bottom:6px">`;
      html += `<div style="display:flex;justify-content:space-between;margin-bottom:2px">`;
      html += `<span style="font-family:var(--font-mono);font-size:10px;color:${color}">${d.substring(0, 10)}</span>`;
      html += `<span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">${skills.length}</span>`;
      html += `</div>`;
      html += `<div style="display:flex;height:6px;border-radius:2px;overflow:hidden;background:var(--bg-deep)">`;

      const segments = [
        { key: 'orchestrator', opacity: 1 },
        { key: 'director', opacity: 0.8 },
        { key: 'knowledge', opacity: 0.6 },
        { key: 'action', opacity: 0.45 },
        { key: 'observer', opacity: 0.3 },
      ];
      for (const seg of segments) {
        const pct = (typeCounts[seg.key] / total) * 100;
        if (pct > 0) {
          html += `<div style="width:${pct}%;background:${color};opacity:${seg.opacity}" title="${seg.key}: ${typeCounts[seg.key]}"></div>`;
        }
      }

      html += `</div></div>`;
    }

    container.innerHTML = html;
  }
};

/* ─── Skill Table ─── */
NO.table = {
  sortCol: 'name',
  sortAsc: true,

  init() {
    document.querySelectorAll('#skill-table th').forEach(th => {
      th.onclick = () => {
        const col = th.dataset.col;
        if (this.sortCol === col) { this.sortAsc = !this.sortAsc; }
        else { this.sortCol = col; this.sortAsc = true; }
        document.querySelectorAll('#skill-table th').forEach(t => {
          t.classList.remove('sorted', 'asc');
        });
        th.classList.add('sorted');
        if (this.sortAsc) th.classList.add('asc');
        this.render();
      };
    });

    document.getElementById('table-search').oninput = () => this.render();
    this.render();
  },

  render() {
    const tbody = document.getElementById('table-body');
    const query = (document.getElementById('table-search').value || '').toLowerCase();
    const domainFilter = NO.vitals.activeFilter;

    let rows = NO.data.skillList.map(s => ({
      name: s.name,
      domain: NO.data.skillDomain[s.name] || '',
      type: s.type,
      score: s.composite_score || 0,
      words: s.metrics?.body_words || 0,
      connections: (s.depends_on?.length || 0) + (s.referenced_by?.length || 0),
      health: s.health_status,
    }));

    // Filters
    if (query) rows = rows.filter(r => r.name.includes(query) || r.domain.includes(query));
    if (domainFilter) rows = rows.filter(r => r.domain === domainFilter);

    // Sort
    const col = this.sortCol;
    const dir = this.sortAsc ? 1 : -1;
    rows.sort((a, b) => {
      const av = a[col], bv = b[col];
      if (typeof av === 'number') return (av - bv) * dir;
      return String(av).localeCompare(String(bv)) * dir;
    });

    // Render (max 100)
    let html = '';
    for (const r of rows.slice(0, 100)) {
      const color = NO.config.domainColors[r.domain] || '#888';
      const scorePct = Math.min(100, r.score);
      html += `<tr data-skill="${NO.detail.esc(r.name)}">`;
      html += `<td><span class="health-dot ${r.health}"></span>${NO.detail.esc(r.name)}</td>`;
      html += `<td><span class="domain-tag" style="color:${color};border-color:${color}40">${NO.detail.esc(r.domain)}</span></td>`;
      html += `<td>${NO.detail.esc(r.type)}</td>`;
      html += `<td>${r.score}<span class="score-bar"><span class="score-bar-fill" style="width:${scorePct}%;background:${color}"></span></span></td>`;
      html += `<td>${r.words.toLocaleString()}</td>`;
      html += `<td>${r.connections}</td>`;
      html += `</tr>`;
    }

    tbody.innerHTML = html;

    tbody.querySelectorAll('tr').forEach(tr => {
      tr.onclick = () => NO.detail.open(tr.dataset.skill);
    });
  }
};

/* ─── Theme Toggle ─── */
NO.theme = {
  current: localStorage.getItem('no-theme') || 'dark',

  init() {
    this.apply();
    document.getElementById('btn-theme').onclick = () => {
      this.current = this.current === 'dark' ? 'light' : 'dark';
      this.apply();
      localStorage.setItem('no-theme', this.current);
    };
  },

  apply() {
    document.documentElement.setAttribute('data-theme', this.current);
    document.getElementById('btn-theme').textContent = this.current === 'dark' ? 'light' : 'dark';
  }
};

/* ─── Bootstrap ─── */
(async function() {
  try {
    await NO.data.loadAll();
  } catch (e) {
    document.querySelector('.no-grid').innerHTML =
      `<div class="no-panel" style="grid-column:1/-1;text-align:center;padding:60px">
        <div style="font-family:var(--font-display);color:var(--red-bright);margin-bottom:8px">DATA LOAD ERROR</div>
        <div style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim)">${e.message}</div>
        <div style="margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">
          Serve with: python3 -m http.server 8080
        </div>
      </div>`;
    return;
  }

  // Header stats
  document.getElementById('stat-skills').textContent = NO.data.skillList.length;
  document.getElementById('stat-domains').textContent = NO.data.domainOrder.length;
  document.getElementById('stat-edges').textContent = NO.data.totalEdges;
  document.getElementById('stat-cross').textContent = NO.data.crossDomainEdges;

  // Init modules
  NO.theme.init();
  NO.detail.init();
  NO.vitals.render();
  NO.cortex.init();
  NO.timeline.render();
  NO.signals.render();
  NO.heatmap.render();
  NO.depth.render();
  NO.table.init();

  // Wire buttons
  document.getElementById('btn-trail').onclick = () => {
    NO.cortex.toggleTrail();
    document.getElementById('btn-trail').classList.toggle('active');
  };
  document.getElementById('btn-labels').onclick = () => {
    NO.cortex.toggleLabels();
    document.getElementById('btn-labels').classList.toggle('active');
  };

  // Shared refresh function — reloads all data and re-renders every panel
  const refreshBtn = document.getElementById('btn-refresh');
  const refreshStatus = document.getElementById('refresh-status');

  NO.refresh = async function(silent) {
    if (NO._refreshing) return;
    NO._refreshing = true;
    refreshBtn.classList.add('refreshing');
    if (!silent) { refreshStatus.textContent = 'loading...'; refreshStatus.classList.add('show'); }

    try {
      const oldCount = NO.data.skillList.length;
      await NO.data.loadAll();
      const newCount = NO.data.skillList.length;
      const delta = newCount - oldCount;

      // Re-render all panels
      document.getElementById('stat-skills').textContent = newCount;
      document.getElementById('stat-domains').textContent = NO.data.domainOrder.length;
      document.getElementById('stat-edges').textContent = NO.data.totalEdges;
      document.getElementById('stat-cross').textContent = NO.data.crossDomainEdges;
      NO.vitals.render();
      NO.signals.render();
      NO.heatmap.render();
      NO.depth.render();
      NO.table.render();
      NO.timeline.render();

      // Status feedback
      const msg = delta > 0 ? `+${delta} new skills` : delta < 0 ? `${delta} skills` : 'up to date';
      refreshStatus.textContent = msg;
      refreshStatus.classList.add('show');
      setTimeout(() => refreshStatus.classList.remove('show'), 3000);
    } catch (e) {
      refreshStatus.textContent = 'refresh failed';
      refreshStatus.classList.add('show');
      setTimeout(() => refreshStatus.classList.remove('show'), 3000);
    } finally {
      NO._refreshing = false;
      refreshBtn.classList.remove('refreshing');
    }
  };

  // Manual refresh button
  refreshBtn.onclick = () => NO.refresh(false);

  // Auto-refresh every 30s (silent — only shows status if new data found)
  let lastHash = JSON.stringify(NO.data.skillList.length);
  setInterval(async () => {
    try {
      const res = await fetch(NO.config.files.registry + '?t=' + Date.now());
      const reg = await res.json();
      const hash = JSON.stringify(Object.keys(reg.skills || {}).length);
      if (hash !== lastHash) {
        lastHash = hash;
        await NO.refresh(true);
        refreshStatus.textContent = 'auto-updated';
        refreshStatus.classList.add('show');
        setTimeout(() => refreshStatus.classList.remove('show'), 3000);
      }
    } catch {}
  }, NO.config.refreshInterval);

})();
</script>
