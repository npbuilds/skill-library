<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skill-infra // terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

  /* ═══════════════════════════════════════════
     THEME SYSTEM
     ═══════════════════════════════════════════ */
  :root {
    --font: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    --radius: 4px;
    --transition: 0.2s ease;
  }

  [data-theme="dark"] {
    --bg-0: #0c0c10;
    --bg-1: #111117;
    --bg-2: #18181f;
    --bg-3: #1f1f28;
    --bg-4: #282833;
    --border: #2c2c3a;
    --border-hi: #3e3e52;
    --text-0: #f0f0f5;
    --text-1: #c8c8d4;
    --text-2: #8888a0;
    --text-3: #5c5c72;
    --prompt: #7b6fef;
    --prompt-dim: #5a4fc0;
    --prompt-glow: rgba(123,111,239,0.12);
    --green: #50fa7b;
    --green-dim: rgba(80,250,123,0.15);
    --yellow: #f1fa8c;
    --yellow-dim: rgba(241,250,140,0.12);
    --red: #ff5555;
    --red-dim: rgba(255,85,85,0.12);
    --cyan: #8be9fd;
    --cyan-dim: rgba(139,233,253,0.1);
    --orange: #ffb86c;
    --pink: #ff79c6;
    --comment: #6272a4;
    --selection: rgba(68,71,90,0.6);
    --glow: 0 0 20px rgba(123,111,239,0.08);
    --scanline-opacity: 0.03;
    --crt-flicker: crt-flicker 0.15s infinite;
  }

  [data-theme="light"] {
    --bg-0: #fafaf9;
    --bg-1: #f3f3f1;
    --bg-2: #eaeae6;
    --bg-3: #e0e0db;
    --bg-4: #d4d4cf;
    --border: #c8c8c0;
    --border-hi: #b0b0a8;
    --text-0: #1a1a1f;
    --text-1: #33333d;
    --text-2: #6b6b78;
    --text-3: #9b9ba8;
    --prompt: #6c5ce7;
    --prompt-dim: #5a4bd6;
    --prompt-glow: rgba(108,92,231,0.08);
    --green: #16a34a;
    --green-dim: rgba(22,163,74,0.1);
    --yellow: #ca8a04;
    --yellow-dim: rgba(202,138,4,0.08);
    --red: #dc2626;
    --red-dim: rgba(220,38,38,0.08);
    --cyan: #0891b2;
    --cyan-dim: rgba(8,145,178,0.08);
    --orange: #ea580c;
    --pink: #db2777;
    --comment: #8b8fa3;
    --selection: rgba(108,92,231,0.08);
    --glow: 0 1px 3px rgba(0,0,0,0.06);
    --scanline-opacity: 0;
    --crt-flicker: none;
  }

  /* ═══════════════════════════════════════════
     RESET & BASE
     ═══════════════════════════════════════════ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg-0);
    color: var(--text-1);
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* CRT scanline overlay — dark mode only */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,var(--scanline-opacity)) 2px,
      rgba(0,0,0,var(--scanline-opacity)) 4px
    );
  }

  ::selection { background: var(--selection); }

  /* ═══════════════════════════════════════════
     LAYOUT
     ═══════════════════════════════════════════ */
  .app { display: flex; min-height: 100vh; }

  /* ─── Sidebar ─── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--bg-1);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .sidebar-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .sidebar-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-0);
    letter-spacing: -0.3px;
  }
  .sidebar-title .prompt-char { color: var(--prompt); }
  .sidebar-title .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--prompt);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .sidebar-version {
    font-size: 10px;
    color: var(--text-3);
    margin-top: 4px;
    font-weight: 500;
  }

  .theme-toggle {
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-2);
    font-family: var(--font);
    font-size: 14px;
    width: 32px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--prompt); color: var(--text-0); }

  /* ─── Search ─── */
  .search-wrap {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
  }

  .search-input {
    width: 100%;
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px 7px 28px;
    color: var(--text-0);
    font-family: var(--font);
    font-size: 12px;
    outline: none;
    transition: border-color var(--transition);
  }
  .search-input:focus { border-color: var(--prompt); }
  .search-input::placeholder { color: var(--text-3); }

  .search-wrap { position: relative; }
  .search-wrap::before {
    content: '>';
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--prompt);
    font-size: 12px;
    font-weight: 700;
    pointer-events: none;
  }

  /* ─── Filters ─── */
  .filter-bar {
    padding: 8px 18px;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .filter-btn {
    font-family: var(--font);
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    transition: all var(--transition);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .filter-btn:hover { border-color: var(--prompt); color: var(--text-1); }
  .filter-btn.active { background: var(--prompt); border-color: var(--prompt); color: #fff; }

  /* ─── Skill List ─── */
  .skill-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  .skill-list::-webkit-scrollbar { width: 4px; }
  .skill-list::-webkit-scrollbar-track { background: transparent; }
  .skill-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .skill-item {
    padding: 10px 18px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.1s;
    position: relative;
  }
  .skill-item:hover { background: var(--bg-2); }
  .skill-item.active {
    background: var(--prompt-glow);
    border-left-color: var(--prompt);
  }

  .skill-item-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--cyan);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-healthy { background: var(--green); box-shadow: 0 0 4px var(--green); }
  .dot-warning { background: var(--yellow); box-shadow: 0 0 4px var(--yellow); }
  .dot-critical { background: var(--red); box-shadow: 0 0 4px var(--red); }

  [data-theme="light"] .dot-healthy { box-shadow: none; }
  [data-theme="light"] .dot-warning { box-shadow: none; }
  [data-theme="light"] .dot-critical { box-shadow: none; }

  .skill-item-desc {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 3px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .skill-item-meta {
    display: flex;
    gap: 8px;
    margin-top: 5px;
    font-size: 10px;
    color: var(--text-3);
    font-weight: 500;
  }

  .badge {
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .badge-action { background: var(--prompt-glow); color: var(--prompt); border: 1px solid rgba(123,111,239,0.25); }
  .badge-knowledge { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(139,233,253,0.2); }
  .badge-orchestrator { background: var(--yellow-dim); color: var(--orange); border: 1px solid rgba(255,184,108,0.2); }

  /* ═══════════════════════════════════════════
     MAIN CONTENT
     ═══════════════════════════════════════════ */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-1);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .tab {
    padding: 12px 18px;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    background: transparent;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all var(--transition);
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--text-1); }
  .tab.active { color: var(--prompt); border-bottom-color: var(--prompt); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ═══════════════════════════════════════════
     TERMINAL PANELS
     ═══════════════════════════════════════════ */
  .panel {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--glow);
  }

  .panel-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .panel-bar-dots {
    display: flex;
    gap: 5px;
  }
  .panel-bar-dots span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .panel-bar-dots span:nth-child(1) { background: var(--red); }
  .panel-bar-dots span:nth-child(2) { background: var(--yellow); }
  .panel-bar-dots span:nth-child(3) { background: var(--green); }

  [data-theme="light"] .panel-bar-dots span:nth-child(1) { background: #e0e0db; }
  [data-theme="light"] .panel-bar-dots span:nth-child(2) { background: #e0e0db; }
  [data-theme="light"] .panel-bar-dots span:nth-child(3) { background: #e0e0db; }

  .panel-body { padding: 16px; }

  /* ─── Stats Row ─── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--glow);
  }

  .stat-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-3);
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1px;
  }

  .stat-sub {
    font-size: 10px;
    color: var(--text-3);
    margin-top: 4px;
    font-weight: 500;
  }

  /* ─── Progress bar ─── */
  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--bg-3);
    border-radius: 3px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  .token-chips {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 6px;
    margin-top: 12px;
  }

  .token-chip {
    text-align: center;
    padding: 8px 4px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
    font-size: 10px;
    color: var(--text-3);
    font-weight: 500;
  }
  .token-chip:hover { border-color: var(--prompt); }
  .token-chip strong {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-0);
    margin-top: 2px;
  }

  /* ─── Domain Summary ─── */
  .domain-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .domain-row:last-child { border-bottom: none; }
  .domain-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .domain-name {
    width: 120px;
    font-weight: 700;
    color: var(--text-0);
    flex-shrink: 0;
  }
  .domain-bar-track {
    flex: 1;
    height: 16px;
    background: var(--bg-3);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .domain-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
    min-width: 2px;
  }
  .domain-stats {
    width: 180px;
    text-align: right;
    color: var(--text-2);
    font-size: 11px;
    flex-shrink: 0;
  }
  .domain-stats strong { color: var(--text-0); font-weight: 700; }

  /* ─── Domain-Grouped Token Chips ─── */
  .domain-group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    margin-top: 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-1);
    transition: all var(--transition);
    user-select: none;
  }
  .domain-group-header:first-child { margin-top: 0; }
  .domain-group-header:hover { border-color: var(--prompt); }
  .domain-group-header .dg-arrow {
    transition: transform 0.2s;
    color: var(--text-3);
    font-size: 10px;
  }
  .domain-group-header.open .dg-arrow { transform: rotate(90deg); }
  .domain-group-chips {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 6px;
    padding: 8px 0;
  }
  .domain-group-header.open + .domain-group-chips { display: grid; }

  /* ─── Score Distribution ─── */
  .score-dist {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 36px;
    margin-top: 6px;
  }
  .score-dist-bar {
    flex: 1;
    border-radius: 2px 2px 0 0;
    min-height: 2px;
    position: relative;
    transition: height 0.4s ease;
  }
  .score-dist-bar::after {
    content: attr(data-count);
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    font-weight: 700;
    color: var(--text-2);
  }
  .score-dist-labels {
    display: flex;
    gap: 3px;
    margin-top: 2px;
  }
  .score-dist-labels span {
    flex: 1;
    text-align: center;
    font-size: 8px;
    color: var(--text-3);
    font-weight: 600;
  }

  /* ─── Domain Badge (leaderboard) ─── */
  .domain-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--bg-3);
    border: 1px solid var(--border);
  }

  /* ─── Network Legend ─── */
  .net-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 12px 0 0;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .net-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-2);
    font-weight: 600;
  }
  .net-legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.5px solid;
  }

  /* ─── Table ─── */
  .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tbl th {
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-3);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: color var(--transition);
  }
  .tbl th:hover { color: var(--prompt); }
  .tbl th.sorted { color: var(--prompt); }

  .tbl td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text-1);
  }
  .tbl tr { transition: background 0.1s; cursor: pointer; }
  .tbl tbody tr:hover td { background: var(--bg-2); }
  .tbl .t-name { font-weight: 600; color: var(--cyan); }

  .score-pip {
    display: inline-block;
    height: 4px;
    border-radius: 2px;
    background: var(--prompt);
    vertical-align: middle;
    margin-right: 6px;
  }

  /* ═══════════════════════════════════════════
     NETWORK
     ═══════════════════════════════════════════ */
  .net-wrap { position: relative; min-height: 420px; }

  .net-node {
    position: absolute;
    padding: 6px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-1);
    cursor: pointer;
    z-index: 2;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .net-node:hover { border-color: var(--prompt); transform: translateY(-2px); box-shadow: var(--glow); }
  .net-node.active { border-color: var(--cyan); background: var(--cyan-dim); color: var(--cyan); }
  .net-node .n-score { font-size: 10px; color: var(--text-3); margin-left: 5px; font-weight: 500; }

  .net-svg { position: absolute; inset: 0; z-index: 1; }
  .net-svg line { stroke: var(--border); stroke-width: 1.5; transition: all 0.2s; }
  .net-svg line.hi { stroke: var(--prompt); stroke-width: 2.5; }

  /* ═══════════════════════════════════════════
     DETAIL VIEW
     ═══════════════════════════════════════════ */
  .detail-hero {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .detail-icon {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .detail-hero h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-0);
    text-transform: none;
    letter-spacing: -0.3px;
    margin-bottom: 2px;
  }
  .detail-hero h2 .nickname { color: var(--comment); font-weight: 400; font-size: 14px; }
  .detail-hero .detail-desc { font-size: 12px; color: var(--text-2); line-height: 1.5; }

  .detail-actions {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-2);
    color: var(--text-1);
    cursor: pointer;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover { border-color: var(--prompt); color: var(--text-0); }
  .btn-primary { background: var(--prompt); border-color: var(--prompt); color: #fff; }
  .btn-primary:hover { background: var(--prompt-dim); }

  .detail-metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .dm {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .dm-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-3); }
  .dm-value { font-size: 20px; font-weight: 800; margin-top: 3px; letter-spacing: -0.5px; }
  .dm-sub { font-size: 9px; color: var(--text-3); margin-top: 2px; font-weight: 500; }

  .section-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--comment);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .section-title::before { content: '# '; color: var(--prompt); }

  .section { margin-bottom: 20px; }

  .dep-grid { display: flex; gap: 16px; flex-wrap: wrap; }
  .dep-col { flex: 1; min-width: 160px; }
  .dep-col h4 {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-3);
    margin-bottom: 6px;
  }

  .dep-link {
    display: block;
    padding: 6px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--cyan);
    cursor: pointer;
    transition: all var(--transition);
  }
  .dep-link:hover { border-color: var(--prompt); background: var(--bg-3); }
  .dep-link.none { color: var(--text-3); cursor: default; font-style: italic; font-weight: 400; }
  .dep-link.none:hover { border-color: var(--border); background: var(--bg-2); }

  .tag-list { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text-2);
  }

  /* ─── Changelog Timeline ─── */
  .timeline { position: relative; padding-left: 18px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 4px;
    bottom: 4px;
    width: 1px;
    background: var(--border);
  }

  .tl-entry { position: relative; margin-bottom: 14px; }
  .tl-entry::before {
    content: '';
    position: absolute;
    left: -16px;
    top: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--prompt);
  }

  .tl-date { font-size: 10px; color: var(--text-3); font-weight: 500; }
  .tl-action { font-size: 11px; font-weight: 700; color: var(--prompt); }
  .tl-note { font-size: 11px; color: var(--text-2); margin-top: 1px; }

  /* ═══════════════════════════════════════════
     MODAL
     ═══════════════════════════════════════════ */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-bg.open { display: flex; }

  [data-theme="light"] .modal-bg { background: rgba(0,0,0,0.3); }

  .modal {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 580px;
    max-width: 92vw;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h3 { font-size: 14px; font-weight: 700; color: var(--text-0); }
  .modal-head p { font-size: 11px; color: var(--text-3); margin-top: 4px; }

  .modal-code {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .modal-code pre {
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    font-family: var(--font);
    font-size: 11px;
    color: var(--text-1);
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
    max-height: 400px;
    overflow-y: auto;
  }

  .modal-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--green);
    color: #000;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    z-index: 100;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.25s ease;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ─── Empty state ─── */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-3);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
  .empty p { font-size: 12px; }

  /* ─── Responsive ─── */
  @media (max-width: 960px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .detail-metrics { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-width: 100%; height: auto; position: relative; max-height: 45vh; }
    .content { padding: 16px; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div>
        <div class="sidebar-title"><span class="prompt-char">~</span> skill-infra<span class="cursor"></span></div>
        <div class="sidebar-version" id="version">loading...</div>
      </div>
      <button class="theme-toggle" id="theme-btn" title="Toggle light/dark mode">
        <span id="theme-icon">&#x2600;</span>
      </button>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="search" placeholder=" grep skills..." autocomplete="off" spellcheck="false">
    </div>
    <div class="filter-bar" id="filters"></div>
    <div class="skill-list" id="skill-list"></div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main">
    <div class="topbar">
      <button class="tab active" data-tab="overview">overview</button>
      <button class="tab" data-tab="network">network</button>
      <button class="tab" data-tab="detail" id="detail-tab" style="display:none"></button>
    </div>
    <div class="content">
      <div class="tab-pane active" id="pane-overview"></div>
      <div class="tab-pane" id="pane-network"></div>
      <div class="tab-pane" id="pane-detail">
        <div class="empty"><div class="empty-icon">_</div><p>Select a skill from the sidebar</p></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <p id="modal-desc"></p>
    </div>
    <div class="modal-code"><pre id="modal-pre"></pre></div>
    <div class="modal-foot">
      <button class="btn" id="modal-close">esc</button>
      <button class="btn btn-primary" id="modal-copy">copy</button>
    </div>
  </div>
</div>

<script>
(async function() {

  /* ── Load Data ── */
  var R;
  try {
    R = await (await fetch('./data/registry.json')).json();
  } catch(e) {
    document.getElementById('version').textContent = 'ERR: ' + e.message;
    return;
  }

  var S = R.skills, names = Object.keys(S), list = Object.values(S);
  var current = null, filter = 'all', query = '';

  /* ── Domain utilities ── */
  var domainColors = {
    'infrastructure': { color: 'var(--cyan)', raw: '--cyan' },
    'design':         { color: 'var(--pink)', raw: '--pink' },
    'game-theory':    { color: 'var(--orange)', raw: '--orange' },
    'worldbuilding':  { color: 'var(--green)', raw: '--green' },
    'data-science':   { color: 'var(--prompt)', raw: '--prompt' },
    'meta':           { color: 'var(--text-3)', raw: '--text-3' }
  };
  var defaultDomainColor = { color: 'var(--text-2)', raw: '--text-2' };

  function getDomain(skill) {
    var tags = skill.tags || [];
    for (var i = 0; i < tags.length; i++) {
      if (tags[i].indexOf('domain:') === 0) return tags[i].split(':')[1];
    }
    return 'other';
  }

  function getDomainColor(domain) {
    return domainColors[domain] || defaultDomainColor;
  }

  function groupByDomain() {
    var groups = {};
    list.forEach(function(s) {
      var d = getDomain(s);
      if (!groups[d]) groups[d] = [];
      groups[d].push(s);
    });
    return groups;
  }

  /* ── HTML escape helper (XSS prevention) ── */
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  var icons = {
    'skill-registry':  { e: '\uD83D\uDDFA\uFE0F', bg: 'var(--prompt-glow)' },
    'skill-health':    { e: '\uD83E\uDE7A', bg: 'var(--green-dim)' },
    'skill-dashboard': { e: '\uD83D\uDCCA', bg: 'var(--yellow-dim)' },
    'skill-scaffold':  { e: '\uD83C\uDFD7\uFE0F', bg: 'var(--cyan-dim)' },
    'skill-test':      { e: '\uD83E\uDDEA', bg: 'var(--red-dim)' },
    'skill-analyze':   { e: '\uD83D\uDD2E', bg: 'var(--prompt-glow)' },
    'skill-fork':      { e: '\u2702\uFE0F', bg: 'var(--yellow-dim)' },
    'skill-network':   { e: '\uD83C\uDF10', bg: 'var(--cyan-dim)' },
    'skill-export':    { e: '\uD83D\uDCE6', bg: 'var(--green-dim)' }
  };

  var nicks = {
    'skill-registry':'The Map','skill-health':'The Doctor','skill-dashboard':'The Observatory',
    'skill-scaffold':'The Builder','skill-test':'The Prover','skill-analyze':'The Oracle',
    'skill-fork':'The Splitter','skill-network':'The Cartographer','skill-export':'The Courier'
  };

  /* ── Theme Toggle ── */
  var theme = localStorage.getItem('si-theme') || 'dark';
  applyTheme(theme);

  document.getElementById('theme-btn').onclick = function() {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    localStorage.setItem('si-theme', theme);
  };

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('theme-icon').innerHTML = t === 'dark' ? '&#x2600;' : '&#x263D;';
  }

  /* ── Version Bar ── */
  document.getElementById('version').textContent =
    'v' + R.plugin_version + ' // ' + names.length + ' skills // schema v' + R.schema_version;

  /* ── Filters ── */
  var types = {};
  list.forEach(function(s) { types[s.type] = true; });
  var fHTML = '<button class="filter-btn active" data-f="all">all</button>';
  Object.keys(types).forEach(function(t) { fHTML += '<button class="filter-btn" data-f="type:' + esc(t) + '">' + esc(t) + '</button>'; });
  fHTML += '<button class="filter-btn" data-f="issues">issues</button>';
  document.getElementById('filters').innerHTML = fHTML;

  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.onclick = function() {
      document.querySelectorAll('.filter-btn').forEach(function(x) { x.classList.remove('active'); });
      this.classList.add('active');
      filter = this.dataset.f;
      renderList();
    };
  });

  /* ── Search ── */
  document.getElementById('search').oninput = function() { query = this.value.toLowerCase(); renderList(); };

  /* ── Skill List ── */
  function renderList() {
    var filtered = list.filter(function(s) {
      if (filter !== 'all') {
        if (filter.startsWith('type:') && s.type !== filter.split(':')[1]) return false;
        if (filter === 'issues' && s.health_status === 'healthy') return false;
      }
      if (query && s.name.toLowerCase().indexOf(query) === -1 &&
          (s.description || '').toLowerCase().indexOf(query) === -1) return false;
      return true;
    });

    var h = '';
    if (!filtered.length) h = '<div style="padding:16px 18px;color:var(--text-3);font-size:11px">no matches</div>';
    filtered.forEach(function(s) {
      var ac = current === s.name ? ' active' : '';
      h += '<div class="skill-item' + ac + '" data-s="' + esc(s.name) + '" tabindex="0" role="button">';
      h += '<div class="skill-item-name"><span class="dot dot-' + esc(s.health_status) + '"></span>' + esc(s.name) + '</div>';
      h += '<div class="skill-item-desc">' + esc(s.description) + '</div>';
      h += '<div class="skill-item-meta"><span class="badge badge-' + esc(s.type) + '">' + esc(s.type) + '</span>';
      var m = s.metrics || {};
      h += '<span>' + (s.composite_score || 0) + ' pts</span><span>' + (m.estimated_tokens_total || 0) + ' tok</span></div>';
      h += '</div>';
    });
    document.getElementById('skill-list').innerHTML = h;
    document.querySelectorAll('.skill-item').forEach(function(el) {
      el.onclick = function() { select(this.dataset.s); };
      el.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(this.dataset.s); } };
    });
  }
  renderList();

  function select(name) {
    current = name;
    renderList();
    renderDetail(name);
    switchTab('detail');
  }

  /* ── Tab Switching ── */
  function switchTab(t) {
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
    document.querySelectorAll('.tab-pane').forEach(function(x) { x.classList.remove('active'); });
    document.querySelector('[data-tab="' + t + '"]').classList.add('active');
    document.getElementById('pane-' + t).classList.add('active');
    if (t === 'detail') document.getElementById('detail-tab').style.display = '';
    if (t === 'network') setTimeout(renderNetwork, 30);
  }

  document.querySelectorAll('.tab').forEach(function(t) {
    t.onclick = function() { switchTab(this.dataset.tab); };
  });

  /* ══════════════════════════════════════
     OVERVIEW TAB
     ══════════════════════════════════════ */
  var totalMeta = 0, totalScore = 0, healthy = 0, totalTok = 0;
  list.forEach(function(s) {
    var m = s.metrics || {};
    totalMeta += m.estimated_tokens_metadata || 0;
    totalScore += s.composite_score || 0;
    totalTok += m.estimated_tokens_total || 0;
    if (s.health_status === 'healthy') healthy++;
  });
  var avg = list.length ? (totalScore / list.length).toFixed(1) : '0.0';

  var ov = '';

  // score distribution histogram
  var scores = list.map(function(s) { return s.composite_score || 0; });
  var minScore = Math.min.apply(null, scores), maxScore = Math.max.apply(null, scores);
  var buckets = [
    { label: '0-59', min: 0, max: 59, count: 0, color: 'var(--red)' },
    { label: '60-74', min: 60, max: 74, count: 0, color: 'var(--orange)' },
    { label: '75-89', min: 75, max: 89, count: 0, color: 'var(--yellow)' },
    { label: '90-99', min: 90, max: 99, count: 0, color: 'var(--green)' },
    { label: '100', min: 100, max: 100, count: 0, color: 'var(--cyan)' }
  ];
  scores.forEach(function(sc) {
    for (var i = 0; i < buckets.length; i++) {
      if (sc >= buckets[i].min && sc <= buckets[i].max) { buckets[i].count++; break; }
    }
  });
  var maxBucket = Math.max.apply(null, buckets.map(function(b) { return b.count; }));

  // stats
  ov += '<div class="stats-grid">';
  ov += '<div class="stat"><div class="stat-label">skills</div>';
  ov += '<div class="stat-value" style="color:var(--prompt)">' + names.length + '</div>';
  ov += '<div class="stat-sub">' + healthy + '/' + names.length + ' healthy</div></div>';

  ov += '<div class="stat"><div class="stat-label">avg score</div>';
  ov += '<div class="stat-value" style="color:var(--green)">' + avg + '</div>';
  ov += '<div class="stat-sub">range: ' + minScore + ' – ' + maxScore + '</div>';
  ov += '<div class="score-dist">';
  buckets.forEach(function(b) {
    var h = maxBucket ? Math.max(4, (b.count / maxBucket) * 32) : 4;
    ov += '<div class="score-dist-bar" style="height:' + h + 'px;background:' + b.color + '" data-count="' + b.count + '"></div>';
  });
  ov += '</div>';
  ov += '<div class="score-dist-labels">';
  buckets.forEach(function(b) { ov += '<span>' + b.label + '</span>'; });
  ov += '</div></div>';

  ov += '<div class="stat"><div class="stat-label">meta tokens</div>';
  ov += '<div class="stat-value" style="color:var(' + (totalMeta < 600 ? '--green' : '--yellow') + ')">' + totalMeta + '</div>';
  ov += '<div class="stat-sub">always loaded</div></div>';

  ov += '<div class="stat"><div class="stat-label">total tokens</div>';
  ov += '<div class="stat-value" style="color:var(--cyan)">' + totalTok.toLocaleString() + '</div>';
  ov += '<div class="stat-sub">all skills triggered</div></div>';
  ov += '</div>';

  // domain summary panel
  var domainGroups = groupByDomain();
  var domainStats = Object.keys(domainGroups).map(function(d) {
    var skills = domainGroups[d];
    var tok = 0, sc = 0;
    skills.forEach(function(s) {
      tok += (s.metrics || {}).estimated_tokens_total || 0;
      sc += s.composite_score || 0;
    });
    return { name: d, count: skills.length, tokens: tok, avgScore: (sc / skills.length).toFixed(0) };
  }).sort(function(a, b) { return b.tokens - a.tokens; });
  var maxDomainTok = Math.max.apply(null, domainStats.map(function(d) { return d.tokens; }));

  ov += '<div class="panel"><div class="panel-bar"><div class="panel-bar-dots"><span></span><span></span><span></span></div>domains</div>';
  ov += '<div class="panel-body">';
  domainStats.forEach(function(d) {
    var dc = getDomainColor(d.name);
    var barW = maxDomainTok ? (d.tokens / maxDomainTok) * 100 : 0;
    ov += '<div class="domain-row">';
    ov += '<div class="domain-dot" style="background:' + dc.color + '"></div>';
    ov += '<div class="domain-name">' + esc(d.name) + '</div>';
    ov += '<div class="domain-bar-track"><div class="domain-bar-fill" style="width:' + barW + '%;background:' + dc.color + '"></div></div>';
    ov += '<div class="domain-stats"><strong>' + d.count + '</strong> skills &middot; avg <strong>' + d.avgScore + '</strong> &middot; ' + d.tokens.toLocaleString() + ' tok</div>';
    ov += '</div>';
  });
  ov += '</div></div>';

  // token budget panel
  var pct = Math.min(100, (totalMeta / 600) * 100);
  var pc = pct < 70 ? 'var(--green)' : pct < 90 ? 'var(--yellow)' : 'var(--red)';
  ov += '<div class="panel"><div class="panel-bar"><div class="panel-bar-dots"><span></span><span></span><span></span></div>token budget &mdash; 600 target</div>';
  ov += '<div class="panel-body">';
  ov += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);font-weight:600">';
  ov += '<span>' + totalMeta + ' / 600</span><span>' + pct.toFixed(0) + '%</span></div>';
  ov += '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;background:' + pc + '"></div></div>';
  ov += '<div class="token-chips-grouped">';
  var sortedDomains = Object.keys(domainGroups).sort(function(a, b) {
    var ta = 0, tb = 0;
    domainGroups[a].forEach(function(s) { ta += (s.metrics || {}).estimated_tokens_metadata || 0; });
    domainGroups[b].forEach(function(s) { tb += (s.metrics || {}).estimated_tokens_metadata || 0; });
    return tb - ta;
  });
  sortedDomains.forEach(function(d) {
    var skills = domainGroups[d].slice().sort(function(a, b) {
      return ((b.metrics || {}).estimated_tokens_metadata || 0) - ((a.metrics || {}).estimated_tokens_metadata || 0);
    });
    var dTok = 0;
    skills.forEach(function(s) { dTok += (s.metrics || {}).estimated_tokens_metadata || 0; });
    var dc = getDomainColor(d);
    ov += '<div class="domain-group-header" data-domain="' + esc(d) + '" style="border-left:3px solid ' + dc.color + '">';
    ov += '<span>' + esc(d) + ' <span style="color:var(--text-3);font-weight:500">' + skills.length + ' skills</span></span>';
    ov += '<span><span style="color:var(--text-0)">' + dTok + '</span> meta tok <span class="dg-arrow">&#9654;</span></span>';
    ov += '</div>';
    ov += '<div class="domain-group-chips">';
    skills.forEach(function(s) {
      ov += '<div class="token-chip" data-s="' + esc(s.name) + '">' + esc(s.name.replace('skill-','')) + '<strong>' + ((s.metrics || {}).estimated_tokens_metadata || 0) + '</strong></div>';
    });
    ov += '</div>';
  });
  ov += '</div></div></div>';

  // leaderboard
  ov += '<div class="panel"><div class="panel-bar"><div class="panel-bar-dots"><span></span><span></span><span></span></div>leaderboard</div>';
  ov += '<div class="panel-body"><table class="tbl" id="tbl"></table></div></div>';

  document.getElementById('pane-overview').innerHTML = ov;

  // wire token chips and domain group headers
  document.querySelectorAll('.token-chip').forEach(function(c) { c.onclick = function() { select(this.dataset.s); }; });
  document.querySelectorAll('.domain-group-header').forEach(function(h) {
    h.onclick = function() { this.classList.toggle('open'); };
  });

  // leaderboard sorting
  var sortKey = 'composite_score', sortDir = -1;

  function gv(s, k) {
    if (k === 'name') return s.name;
    if (k === 'domain') return getDomain(s);
    if (s.metrics && s.metrics[k] !== undefined) return s.metrics[k];
    if (s[k] !== undefined) return s[k];
    return 0;
  }

  function renderTable() {
    var sorted = list.slice().sort(function(a, b) {
      var av = gv(a, sortKey), bv = gv(b, sortKey);
      return typeof av === 'string' ? sortDir * av.localeCompare(bv) : sortDir * (av - bv);
    });

    var cols = [
      { k: 'name', l: 'skill' }, { k: 'domain', l: 'domain' }, { k: 'composite_score', l: 'score' },
      { k: 'body_words', l: 'words' }, { k: 'estimated_tokens_total', l: 'tokens' },
      { k: 'health_status', l: 'health' }
    ];

    var h = '<thead><tr>';
    cols.forEach(function(c) {
      var cl = c.k === sortKey ? ' class="sorted"' : '';
      var ar = c.k === sortKey ? (sortDir === -1 ? ' \u2193' : ' \u2191') : '';
      h += '<th' + cl + ' data-k="' + c.k + '">' + c.l + ar + '</th>';
    });
    h += '</tr></thead><tbody>';

    sorted.forEach(function(s) {
      var sm = s.metrics || {};
      h += '<tr data-s="' + esc(s.name) + '">';
      var sDomain = getDomain(s);
      var sDc = getDomainColor(sDomain);
      h += '<td class="t-name">' + esc(s.name) + '</td>';
      h += '<td><span class="domain-badge" style="color:' + sDc.color + ';border-color:' + sDc.color + '">' + esc(sDomain) + '</span></td>';
      h += '<td><span class="score-pip" style="width:' + ((s.composite_score || 0) * 0.5) + 'px"></span>' + (s.composite_score || 0) + '</td>';
      h += '<td>' + (sm.body_words || 0) + '</td>';
      h += '<td>' + (sm.estimated_tokens_total || 0).toLocaleString() + '</td>';
      h += '<td><span class="dot dot-' + esc(s.health_status) + '" style="vertical-align:middle;margin-right:4px"></span>' + esc(s.health_status) + '</td>';
      h += '</tr>';
    });
    h += '</tbody>';
    document.getElementById('tbl').innerHTML = h;

    document.querySelectorAll('#tbl th').forEach(function(th) {
      th.onclick = function() {
        var k = this.dataset.k;
        if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
        renderTable();
      };
    });
    document.querySelectorAll('#tbl tbody tr').forEach(function(tr) {
      tr.onclick = function() { select(this.dataset.s); };
    });
  }
  renderTable();

  /* ══════════════════════════════════════
     NETWORK TAB
     ══════════════════════════════════════ */
  function renderNetwork() {
    var el = document.getElementById('pane-network');
    var legendHtml = '<div class="net-legend">';
    Object.keys(domainColors).forEach(function(d) {
      legendHtml += '<div class="net-legend-item"><div class="net-legend-dot" style="border-color:' + domainColors[d].color + ';background:' + domainColors[d].color + '"></div>' + d + '</div>';
    });
    legendHtml += '</div>';
    el.innerHTML = '<div class="panel"><div class="panel-bar"><div class="panel-bar-dots"><span></span><span></span><span></span></div>dependency graph</div><div class="panel-body"><div class="net-wrap" id="net"></div>' + legendHtml + '</div></div>';

    var c = document.getElementById('net');
    var w = c.offsetWidth; if (!w) return;
    var h = 420;
    var levels = {}, vis = {};
    var roots = names.filter(function(n) { return (S[n].depends_on || []).length === 0; });
    var q = roots.map(function(r) { return { n: r, l: 0 }; });

    while (q.length) {
      var it = q.shift();
      if (vis[it.n]) { if (it.l > levels[it.n]) levels[it.n] = it.l; continue; }
      vis[it.n] = true; levels[it.n] = it.l;
      (S[it.n].referenced_by || []).forEach(function(r) { if (S[r]) q.push({ n: r, l: it.l + 1 }); });
    }

    // M6 fix: place any skills missed by BFS (cycles or disconnected) at level 0
    names.forEach(function(n) {
      if (levels[n] === undefined) levels[n] = 0;
    });

    var maxL = 0, groups = {};
    for (var n in levels) {
      if (levels[n] > maxL) maxL = levels[n];
      if (!groups[levels[n]]) groups[levels[n]] = [];
      groups[levels[n]].push(n);
    }

    var pos = {};
    for (var lv in groups) {
      var ns = groups[lv];
      var y = 30 + (parseInt(lv) / Math.max(1, maxL)) * (h - 70);
      for (var i = 0; i < ns.length; i++) {
        pos[ns[i]] = { x: (w / (ns.length + 1)) * (i + 1), y: y };
      }
    }

    var svg = '';
    names.forEach(function(n) {
      (S[n].depends_on || []).forEach(function(d) {
        if (pos[n] && pos[d]) {
          svg += '<line x1="' + pos[d].x + '" y1="' + (pos[d].y + 12) +
            '" x2="' + pos[n].x + '" y2="' + (pos[n].y - 4) +
            '" data-from="' + d + '" data-to="' + n + '"/>';
        }
      });
    });

    c.style.height = h + 'px';
    var html = '<svg class="net-svg" viewBox="0 0 ' + w + ' ' + h + '">' + svg + '</svg>';
    names.forEach(function(n) {
      var p = pos[n]; if (!p) return;
      var ac = current === n ? ' active' : '';
      var nDomain = getDomain(S[n]);
      var nDc = getDomainColor(nDomain);
      html += '<div class="net-node' + ac + '" style="left:' + p.x + 'px;top:' + p.y + 'px;transform:translateX(-50%);border-color:' + nDc.color + ';border-left:3px solid ' + nDc.color + '" data-s="' + esc(n) + '">' +
        esc(n.replace('skill-','')) + '<span class="n-score">' + S[n].composite_score + '</span></div>';
    });
    c.innerHTML = html;

    c.querySelectorAll('.net-node').forEach(function(node) {
      node.onclick = function() { select(this.dataset.s); };
      node.onmouseenter = function() {
        var nm = this.dataset.s;
        document.querySelectorAll('.net-svg line').forEach(function(l) {
          if (l.dataset.from === nm || l.dataset.to === nm) l.classList.add('hi');
        });
      };
      node.onmouseleave = function() {
        document.querySelectorAll('.net-svg line').forEach(function(l) { l.classList.remove('hi'); });
      };
    });
  }

  window.addEventListener('resize', function() {
    if (document.getElementById('pane-network').classList.contains('active')) renderNetwork();
  });

  /* ══════════════════════════════════════
     DETAIL TAB
     ══════════════════════════════════════ */
  function renderDetail(name) {
    var s = S[name]; if (!s) return;
    var m = s.metrics || {};
    var ic = icons[name] || { e: '\u2699', bg: 'var(--bg-3)' };
    var nick = nicks[name] || '';

    document.getElementById('detail-tab').style.display = '';
    document.getElementById('detail-tab').textContent = s.name;

    var h = '';

    // hero
    h += '<div class="detail-hero">';
    h += '<div class="detail-icon" style="background:' + ic.bg + '">' + ic.e + '</div>';
    h += '<div><h2>' + esc(s.name) + (nick ? ' <span class="nickname">&mdash; ' + esc(nick) + '</span>' : '') + '</h2>';
    h += '<div class="detail-desc">' + esc(s.description) + '</div></div></div>';

    // actions (use data attributes to avoid onclick injection)
    h += '<div class="detail-actions">';
    h += '<button class="btn btn-primary" data-action="export-desktop" data-skill="' + esc(name) + '">copy for claude desktop</button>';
    h += '<button class="btn" data-action="export-all">export all</button>';
    h += '<button class="btn" data-action="copy-json" data-skill="' + esc(name) + '">{ } json</button>';
    h += '</div>';

    // metrics
    var issues = s.issues || [];
    var ms = [
      { l: 'score', v: s.composite_score, c: s.composite_score >= 97 ? 'green' : s.composite_score >= 70 ? 'yellow' : 'red', sub: 'auto: ' + s.auto_score + (s.manual_rating ? ' // manual: ' + s.manual_rating + '/5' : '') },
      { l: 'body words', v: m.body_words, c: m.body_words <= 1500 ? 'green' : m.body_words <= 2000 ? 'yellow' : 'red', sub: m.word_count + ' total' },
      { l: 'tokens', v: m.estimated_tokens_total.toLocaleString(), c: 'prompt', sub: 'meta:' + m.estimated_tokens_metadata + ' + body:' + m.estimated_tokens_body },
      { l: 'sections', v: m.section_count, c: 'cyan', sub: m.reference_files + ' refs // ' + m.template_files + ' tpl' },
      { l: 'health', v: s.health_status, c: s.health_status === 'healthy' ? 'green' : 'yellow', sub: issues.length ? issues.length + ' issues' : 'clean' },
      { l: 'type', v: s.type, c: 'cyan', sub: s.source },
      { l: 'status', v: s.status, c: s.status === 'active' ? 'green' : 'yellow', sub: s.created },
      { l: 'invoke', v: s.invocation, c: 'orange', sub: s.context_mode }
    ];

    h += '<div class="detail-metrics">';
    ms.forEach(function(mi) {
      h += '<div class="dm"><div class="dm-label">' + esc(mi.l) + '</div>';
      h += '<div class="dm-value" style="color:var(--' + mi.c + ')">' + esc(mi.v) + '</div>';
      h += '<div class="dm-sub">' + esc(mi.sub) + '</div></div>';
    });
    h += '</div>';

    // deps (with null safety)
    var deps = s.depends_on || [];
    var refs = s.referenced_by || [];
    h += '<div class="section"><div class="section-title">dependencies</div><div class="dep-grid">';
    h += '<div class="dep-col"><h4>depends on (' + deps.length + ')</h4>';
    if (!deps.length) h += '<div class="dep-link none">root node</div>';
    else deps.forEach(function(d) { h += '<div class="dep-link" data-nav="' + esc(d) + '">' + esc(d) + '</div>'; });
    h += '</div>';

    h += '<div class="dep-col"><h4>referenced by (' + refs.length + ')</h4>';
    if (!refs.length) h += '<div class="dep-link none">leaf node</div>';
    else refs.forEach(function(d) { h += '<div class="dep-link" data-nav="' + esc(d) + '">' + esc(d) + '</div>'; });
    h += '</div></div></div>';

    // tags
    var tags = s.tags || [];
    if (tags.length) {
      h += '<div class="section"><div class="section-title">tags</div><div class="tag-list">';
      tags.forEach(function(t) { h += '<span class="tag">' + esc(t) + '</span>'; });
      h += '</div></div>';
    }

    // changelog (with null safety)
    var cl = (s.changelog || []).slice().reverse();
    h += '<div class="section"><div class="section-title">changelog</div><div class="timeline">';
    cl.forEach(function(e) {
      h += '<div class="tl-entry"><div class="tl-date">' + esc(e.date) + '</div>';
      h += '<div class="tl-action">' + esc(e.action) + '</div>';
      h += '<div class="tl-note">' + esc(e.note) + '</div></div>';
    });
    h += '</div></div>';

    document.getElementById('pane-detail').innerHTML = h;

    // Wire action buttons via data attributes (safe from injection)
    document.querySelectorAll('[data-action]').forEach(function(btn) {
      btn.onclick = function() {
        var action = this.dataset.action;
        var skill = this.dataset.skill;
        if (action === 'export-desktop') exportDesktop(skill);
        else if (action === 'export-all') exportAll();
        else if (action === 'copy-json') copyJSON(skill);
      };
    });
    document.querySelectorAll('[data-nav]').forEach(function(el) {
      el.onclick = function() { select(this.dataset.nav); };
    });
  }

  /* ══════════════════════════════════════
     EXPORT FUNCTIONS
     ══════════════════════════════════════ */
  function genDesktop(s) {
    var t = '## ' + s.name;
    var m = s.metrics || {};
    var deps = s.depends_on || [];
    if (nicks[s.name]) t += ' \u2014 ' + nicks[s.name];
    t += '\n\n**Trigger:** ' + (s.description || '') + '\n\n';
    t += '**Type:** ' + s.type + ' | **Status:** ' + s.status + '\n\n';
    if (deps.length) t += '**Depends on:** ' + deps.join(', ') + '\n\n';
    t += '**Metrics:**\n';
    t += '- Body: ' + (m.body_words || 0) + ' words (' + (m.estimated_tokens_body || 0) + ' tokens)\n';
    t += '- Score: ' + s.composite_score + '/100\n';
    t += '- Health: ' + s.health_status + '\n';
    if (s.tags && s.tags.length) t += '- Tags: ' + s.tags.join(', ') + '\n';
    t += '\n**Source:** `' + s.location + '`\n';
    t += '*(Read the SKILL.md at this path for full instructions)*\n';
    return t;
  }

  window.exportDesktop = function(name) {
    showModal('export // ' + name, 'Paste into a Claude Desktop Project\'s custom instructions.', genDesktop(S[name]));
  };

  window.exportAll = function() {
    var t = '# skill-infra // Custom Instructions\n';
    t += '# v' + R.plugin_version + ' // ' + names.length + ' skills\n\n';
    t += 'You have the following skill knowledge available.\n\n---\n\n';
    list.forEach(function(s) { t += genDesktop(s) + '\n---\n\n'; });
    showModal('export // all skills', 'All ' + names.length + ' skills formatted for Claude Desktop.', t);
  };

  window.copyJSON = function(name) {
    showModal('json // ' + name, 'Raw registry entry.', JSON.stringify(S[name], null, 2));
  };

  /* ── Modal ── */
  function showModal(title, desc, content) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-desc').textContent = desc;
    document.getElementById('modal-pre').textContent = content;
    document.getElementById('modal').classList.add('open');
    document.getElementById('modal-copy').onclick = function() {
      function fallbackCopy() {
        var ta = document.createElement('textarea');
        ta.value = content; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        toast('copied to clipboard');
        closeModal();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(content).then(function() {
          toast('copied to clipboard');
          closeModal();
        }).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    };
  }

  window.closeModal = function() {
    document.getElementById('modal').classList.remove('open');
  };

  document.getElementById('modal').onclick = function(e) { if (e.target === this) closeModal(); };
  document.getElementById('modal-close').onclick = function() { closeModal(); };

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ── Toast ── */
  var toastTimer;
  function toast(msg) {
    clearTimeout(toastTimer);
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2200);
  }

})();
</script>
