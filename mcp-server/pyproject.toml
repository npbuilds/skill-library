[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-library"
version = "0.1.0"
description = "MCP server and CLI for a local skill library"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "click>=8.0",
]

[project.optional-dependencies]
search = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
graph = [
    "python-igraph>=0.11.0",
    "leidenalg>=0.10.0",
]
all = [
    "skill-library[search,graph]",
]

[project.scripts]
skills = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = ["cli.py", "server.py", "shared.py", "search_index.py"]
