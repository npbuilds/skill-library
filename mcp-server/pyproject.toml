[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-library"
version = "0.1.0"
description = "MCP server and CLI for a local skill library"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "click>=8.0",
]

[project.scripts]
skills = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = ["cli.py", "server.py"]
