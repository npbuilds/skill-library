# Declarative reference for the Cloud Run service.
#
# This file is NOT applied automatically — the deploy workflow
# (.github/workflows/deploy.yml) uses `gcloud run deploy` flags instead.
# Keep this in sync as a readable record of the intended service config.
#
# To apply manually (if you ever want to):
#   gcloud run services replace cloudrun/service.yaml \
#     --region=<REGION> --project=<PROJECT>
#
# Substitute PROJECT_ID, REGION, and AR_REPO before applying.

# IAM policy: roles/run.invoker is bound to allUsers via the
# `--allow-unauthenticated` flag in deploy.yml. The MCP server is intended
# to be publicly invokable so Claude Code can reach it without an auth gate.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: skill-library-mcp
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # One instance at a time — mirrors the maintenance idempotency
        # requirement and keeps concurrent-bot-job scenarios impossible
        # (Conflict Handling residual #1, #6 in the plan).
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 8  # in-flight requests per instance
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/AR_REPO/skill-library-mcp:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              # 2Gi is needed by the sentence-transformers stack:
              # PyTorch CPU runtime (~500MB resident) + MiniLM model
              # (~250MB resident at inference) + Python/MCP base.
              memory: "2Gi"
          env:
            - name: MCP_REMOTE
              value: "true"
            - name: MAINTENANCE_AUTONOMY
              value: conservative
            # Force sentence-transformers / HF Hub to load the MiniLM
            # weights from the image's local cache without a revision
            # check. Required because Cloud Run cpu-throttling makes the
            # revision-check round-trip slow enough to time out clients.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            # Bot PAT for maintenance router bot PR operations.
            # Layer 2 live since commit 7d0081d.
            - name: GITHUB_BOT_PAT
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: github-bot-pat
            # Caller-side shared secret for /maint/* endpoints. Required
            # because the service is `--allow-unauthenticated`; without
            # this token check, anonymous callers could trigger the
            # maintenance bot and use its PAT.
            - name: MAINT_TRIGGER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: maint-trigger-token
