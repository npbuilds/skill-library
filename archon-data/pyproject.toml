[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archon-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Archon imports mcp.server.fastmcp at module scope. MCP 2.x moved that
    # module, so standalone Archon installs need the same compatibility bound
    # as the skill-library server until both runtimes migrate together.
    "mcp>=1.0.0,<2.0.0",
    "yfinance>=0.2.0",
    "requests>=2.31.0",
    "fredapi>=0.5.0",
    "pandas>=2.0.0",
    "pytrends>=4.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["collectors", "processors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
