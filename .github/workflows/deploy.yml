name: Deploy to Cloud Run

# Deploys the MCP server container to Cloud Run when CI passes on main.
# Prereqs: see docs/cloud-setup.md for one-time GCP/GitHub setup.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:  # allow manual trigger for redeploys

permissions:
  contents: read
  id-token: write  # required for Workload Identity Federation

env:
  SERVICE_NAME: skill-library-mcp

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest

    # Only run on CI success (or manual trigger); never on CI failure.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false

    steps:
      # Pin to the exact commit that CI validated. On workflow_run,
      # github.sha is the default branch HEAD at workflow-start time,
      # which can race with a subsequent push. head_sha is the commit
      # that actually triggered CI.
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute deploy SHA + image URI
        id: image
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/${{ env.SERVICE_NAME }}:${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # Build in the GH runner (not Cloud Build). Avoids the post-2024
      # Cloud Build service-account setup dance on new projects.
      - name: Build image
        run: docker build -t "${{ steps.image.outputs.uri }}" .

      - name: Push image
        run: docker push "${{ steps.image.outputs.uri }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image="${{ steps.image.outputs.uri }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --platform=managed \
            --no-allow-unauthenticated \
            --max-instances=1 \
            --memory=2Gi \
            --cpu=1 \
            --timeout=300 \
            --port=8080 \
            --set-env-vars="MCP_REMOTE=true,MAINTENANCE_AUTONOMY=conservative,GITHUB_VAULT_REPO=npbuilds/skill-library-vault" \
            --set-secrets="GITHUB_BOT_PAT=github-bot-pat:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest" \
            --quiet

      - name: Report deploy
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          {
            echo "### ✅ Deployed"
            echo ""
            echo "- **Image**: \`${{ steps.image.outputs.uri }}\`"
            echo "- **Service URL**: $URL"
            echo "- **Commit**: \`${{ steps.image.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
