name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -e mcp-server/
          # numpy is needed by the search-index regression tests; the full
          # [search] extras (PyTorch + sentence-transformers) are not required
          # in CI and would add several minutes to install.
          pip install numpy

      - name: Run unit tests
        working-directory: mcp-server
        run: pytest tests/ -v

      # Standalone script tests (no GCP deps — they use fakes/tmp files)
      - name: Run scripts tests
        run: |
          python3 scripts/test_migrate_to_firestore.py
          python3 scripts/test_pull_telemetry.py
          python3 scripts/test_log_skill_invocation.py

  retrieval-eval:
    name: Retrieval Regression Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e mcp-server/
          # BM25 + numpy only. The vector signal (PyTorch + sentence-
          # transformers) is intentionally NOT installed here — it would add
          # minutes to the job. The gate therefore runs --signals bm25,graph
          # and the committed baseline is recorded in the same mode, so the
          # gate measures retrieval regressions, not the CI environment.
          pip install numpy rank-bm25 pyyaml

      - name: Retrieval regression gate
        run: |
          python3 scripts/eval_retrieval.py \
            --queries all --signals bm25,graph --sample 300 --seed 7 \
            --baseline data/health/eval_baseline.json --check

  validate:
    name: Registry & Skill Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install pyyaml

      - name: Validate registry JSON
        run: |
          python3 << 'EOF'
          import json
          with open('data/registry.json') as f:
              json.load(f)
          print('Registry JSON: valid')
          EOF

      - name: Check all registered skills exist
        run: |
          python3 << 'EOF'
          import json, os, sys
          with open('data/registry.json') as f:
              reg = json.load(f)
          missing = []
          for name, entry in reg.get('skills', {}).items():
              loc = entry.get('location', '')
              if loc and not os.path.exists(loc):
                  missing.append(f'{name}: {loc}')
          if missing:
              print('Missing skill files:')
              for m in missing:
                  print(f'  {m}')
              sys.exit(1)
          print(f'All {len(reg["skills"])} skill locations verified')
          EOF

      - name: Check for broken dependencies
        run: |
          python3 << 'EOF'
          import json, sys
          with open('data/registry.json') as f:
              reg = json.load(f)
          skills = reg.get('skills', {})
          broken = []
          for name, entry in skills.items():
              for dep in entry.get('depends_on', []):
                  if dep not in skills:
                      broken.append(f'{name} -> {dep}')
              parent = entry.get('parent')
              if parent and parent not in skills:
                  broken.append(f'{name} -> parent:{parent}')
          if broken:
              print('Broken references:')
              for b in broken:
                  print(f'  {b}')
              sys.exit(1)
          print(f'All dependencies resolved ({len(skills)} skills checked)')
          EOF

      - name: Validate skill structure (spot check)
        run: |
          python3 << 'EOF'
          import json, random, subprocess, sys
          with open('data/registry.json') as f:
              reg = json.load(f)
          skills = list(reg.get('skills', {}).items())
          sample = random.sample(skills, min(10, len(skills)))
          failures = []
          for name, entry in sample:
              loc = entry.get('location', '')
              if not loc:
                  continue
              # location is like "skills/domain/name/SKILL.md", we need the directory
              skill_dir = str('/'.join(loc.split('/')[:-1]))
              result = subprocess.run(
                  ['bash', 'scripts/validate-structure.sh', skill_dir],
                  capture_output=True, text=True
              )
              try:
                  data = json.loads(result.stdout)
                  if not data.get('valid', False):
                      crits = [i["message"] for i in data.get("issues", []) if i["severity"] == "critical"]
                      failures.append(f'{name}: {crits}')
              except json.JSONDecodeError:
                  failures.append(f'{name}: validation script returned non-JSON')
          if failures:
              print(f'Structure validation failed ({len(failures)}/{len(sample)}):')
              for f in failures:
                  print(f'  {f}')
              sys.exit(1)
          print(f'Structure validation passed ({len(sample)} skills spot-checked)')
          EOF

      - name: Score distribution check
        run: |
          python3 << 'EOF'
          import json, sys
          with open('data/registry.json') as f:
              reg = json.load(f)
          scores = [s.get('composite_score', 0) for s in reg['skills'].values() if s.get('status') != 'deprecated']
          if not scores:
              print('ERROR: No skills found in registry')
              sys.exit(1)
          avg = sum(scores) / len(scores)
          low = [n for n, s in reg['skills'].items() if s.get('composite_score', 0) < 30 and s.get('status') != 'deprecated']
          print(f'Score distribution: min={min(scores)}, max={max(scores)}, avg={avg:.1f}')
          print(f'Skills below 30 (critical): {len(low)}')
          if low:
              for name in low:
                  print(f'  {name}: {reg["skills"][name].get("composite_score", 0)}')
              sys.exit(1)
          EOF

      - name: Verify score recalibration is idempotent
        run: |
          output=$(python3 scripts/recalibrate_scores.py --dry-run 2>&1)
          echo "$output"
          if echo "$output" | grep -q "No score changes needed"; then
            echo "Scores are in sync"
          else
            # Accept minor time-driven drift (≤5 points per skill).
            # score_freshness uses day boundaries that can flip between
            # the local recalibrate and CI's dry-run, causing ~3 point
            # changes. Real score bugs produce larger deltas.
            MAX_CHANGE=$(echo "$output" | grep -oE '\([+-][0-9]+\)' | tr -d '()+-' | sort -n | tail -1)
            if [ -n "$MAX_CHANGE" ] && [ "$MAX_CHANGE" -le 5 ]; then
              echo "::warning::Minor score drift (${MAX_CHANGE}pt max) — within freshness tolerance"
            else
              echo "::error::Scores are out of sync (${MAX_CHANGE:-?}pt max) — run: python3 scripts/recalibrate_scores.py"
              exit 1
            fi
          fi

      - name: Verify registry is in sync with SKILL.md files
        # Catches drift that bypassed the post-write hook (commits from
        # other branches, web UI edits, sessions outside this harness).
        # `|| true` keeps `set -e` from firing on the substitution before
        # we get to print the captured output for debugging.
        run: |
          output=$(python3 scripts/sync-registry.py 2>&1) || true
          echo "$output"
          if echo "$output" | grep -q "Registry is in sync"; then
            echo "✓ Registry is in sync with SKILL.md files"
          else
            echo "::error::Registry has drifted from SKILL.md files. Run: python3 scripts/sync-registry.py --apply && python3 scripts/wire-all-domains.py --apply && python3 scripts/recalibrate_scores.py"
            exit 1
          fi

      - name: Run full diagnostic — fail on HIGH or MEDIUM issues
        # CRITICAL is allowed because 11 lateral cycles in DEPENDENCY_MAP
        # are intentionally deferred for editorial review. HIGH and MEDIUM
        # represent drift that should be auto-resolvable by the sync
        # scripts, so any non-zero count is a real regression.
        run: |
          output=$(python3 scripts/full_diagnostic_scan.py 2>&1) || true
          echo "$output"
          high=$(echo "$output" | awk '/^[[:space:]]*HIGH[[:space:]]*:/ {print $NF}')
          medium=$(echo "$output" | awk '/^[[:space:]]*MEDIUM[[:space:]]*:/ {print $NF}')
          high=${high:-0}
          medium=${medium:-0}
          if [ "$high" -gt 0 ] || [ "$medium" -gt 0 ]; then
            echo "::error::Diagnostic regressions: HIGH=$high MEDIUM=$medium. See log above for details."
            exit 1
          fi
          # Sanity-check: the diagnostic must have actually produced output.
          # If it crashed (e.g., import error) the awk produces empty results
          # and we'd silently pass — guard against that.
          if ! echo "$output" | grep -q "^Severity totals"; then
            echo "::error::Diagnostic did not run to completion — see output above"
            exit 1
          fi
          echo "✓ Diagnostic clean: HIGH=0 MEDIUM=0"
