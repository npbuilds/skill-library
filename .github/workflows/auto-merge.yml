name: Auto-merge maintenance PRs

# Merges maint:green PRs after CI passes. Polls check status and
# merges directly once all checks succeed (works on any GitHub plan
# including free-tier private repos, which lack native auto-merge
# and branch protection).
#
# Autonomy tiers (from plan):
#   conservative (v1): only maint:green auto-merges
#   standard:          also maint:yellow (add || condition below)
#   aggressive:        also maint:red (add || condition below)

on:
  pull_request:
    types: [opened, labeled, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto-merge if green
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Conservative autonomy: only maint:green PRs.
    # To escalate to standard, add:
    #   || contains(github.event.pull_request.labels.*.name, 'maint:yellow')
    if: contains(github.event.pull_request.labels.*.name, 'maint:green')

    steps:
      - name: Wait for CI checks then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "PR #${PR} has maint:green label — waiting for CI then merging"

          # Poll until all checks pass (or any fails).
          # CI typically takes ~25s. We poll every 15s for up to 10 minutes.
          ATTEMPTS=40
          INTERVAL=15

          for i in $(seq 1 $ATTEMPTS); do
            # Get check states (exclude our own workflow to avoid self-reference)
            CHECKS=$(gh pr checks "${PR}" --repo "${REPO}" --json name,state 2>/dev/null || echo "[]")
            # Filter out the auto-merge job itself
            CHECKS=$(echo "$CHECKS" | jq '[.[] | select(.name != "Auto-merge if green")]')
            COUNT=$(echo "$CHECKS" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              echo "  [${i}/${ATTEMPTS}] No CI checks yet, waiting ${INTERVAL}s..."
              sleep $INTERVAL
              continue
            fi

            # Any failures? Abort.
            FAILED=$(echo "$CHECKS" | jq '[.[] | select(.state == "FAILURE")] | length')
            if [ "$FAILED" -gt 0 ]; then
              echo "❌ CI check(s) failed — not merging PR #${PR}"
              echo "$CHECKS" | jq -r '.[] | select(.state == "FAILURE") | "  FAILED: \(.name)"'
              exit 1
            fi

            # All succeeded?
            SUCCEEDED=$(echo "$CHECKS" | jq '[.[] | select(.state == "SUCCESS")] | length')
            if [ "$SUCCEEDED" -eq "$COUNT" ]; then
              echo "✅ All ${COUNT} CI checks passed — merging PR #${PR}"
              gh pr merge "${PR}" --repo "${REPO}" --squash --delete-branch
              echo "🎉 PR #${PR} merged and branch deleted"
              exit 0
            fi

            # Some still pending
            PENDING=$((COUNT - SUCCEEDED))
            echo "  [${i}/${ATTEMPTS}] ${SUCCEEDED}/${COUNT} passed, ${PENDING} pending, waiting ${INTERVAL}s..."
            sleep $INTERVAL
          done

          echo "⏰ Timed out after $((ATTEMPTS * INTERVAL))s — CI checks did not complete"
          echo "PR #${PR} left open for manual review"
          exit 1
